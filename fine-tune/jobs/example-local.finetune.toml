# Example generic fine-tuning job manifest — LOCAL target (sm3lly RTX3090).
#
# Run with:
#   b00t-cli finetune validate fine-tune/jobs/example-local.finetune.toml
#   b00t-cli finetune run fine-tune/jobs/example-local.finetune.toml --dry-run
#
# See docs/superpowers/specs/2026-09-01-generic-finetune-job-oci-distribution-design.md
# for the full design this manifest schema implements.

[job]
id = "qwen38-peer-2026-09-01"
base_model = "unsloth/Qwen3.8-27B-unsloth-bnb-4bit"
framework = "unsloth"  # only value implemented; axolotl reserved (see axolotl.ai.toml)

[dataset]
source = "hf://datasets/elasticdotventures/b00t-training"
# OR: generate = true, using fine-tune/generate_dataset.py's existing templates

[target]
kind = "local"
hive_profile = "finetune"  # _b00t_/finetune.hive.toml — gpu_free_mb >= 15000 gate

[output]
datum = "qwen38-peer"       # -> qwen38-peer.ai.toml gets written/updated
storage = "s3"
s3_bucket = "b00t-finetune-artifacts"  # ap-southeast-4
mirror_to_hf = true                     # optional, default true during transition
