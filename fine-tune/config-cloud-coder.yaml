# b00t cloud fine-tune: Qwen3-Coder-30B-A3B-Instruct on HF Jobs A100
# Submit with: just hf-job-submit-coder
# Monitor with: just hf-job-logs <job-id>
# Adapter lands at: hf://buckets/elasticdotventures/b00t-adapters/qwen3-coder-30b/
#                   and pushed to: elasticdotventures/b00t-qwen3-coder-30b

base_model: "Qwen/Qwen3-Coder-30B-A3B-Instruct"
adapter_name: "b00t-qwen3-coder-30b"
dataset_path: "/data/train.jsonl"
output_dir: "/adapters/qwen3-coder-30b"   # writable HF bucket — survives job death; resume from last checkpoint
hub_model_id: "elasticdotventures/b00t-qwen3-coder-30b"
push_to_hub: true
private: true        # flip to false to publish publicly on HF Hub

# A100 80GB: 4-bit required — BF16 OOM at step 24 (78.63/79.25 GiB)
# 🤓 4-bit adds dequant cost but step time delta <10% with Unsloth fast kernel
load_in_4bit: true

# MoE 30B-A3B: r=16 sufficient (3B active params per forward pass)
lora_r: 16   # 🤓 MoE: r has NO effect on step time — bottleneck is 30B fwd/bwd pass, not optimizer
lora_alpha: 32
lora_dropout: 0.0    # 🤓 MUST be 0.0 — Unsloth fast kernel disabled for any dropout > 0 (140s/step → ~5s/step)
target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"

num_epochs: 1
batch_size: 1          # 2→1: halves activation memory; grad_accum compensates
grad_accum: 16         # 8→16: same effective batch (16), half per-step footprint
learning_rate: 1e-4
max_seq_length: 1024   # 2048→1024: quarters attention memory; MoE bottleneck is routing not attn
packing: true
optim: "adamw_8bit"
weight_decay: 0.01
lr_scheduler: "cosine"
warmup_ratio: 0.05
save_steps: 25   # checkpoint every ~2min at 5s/step; bucket persists across job death

use_gradient_checkpointing: true
report_to: "none"
logging_steps: 10
