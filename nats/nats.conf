# b00t ACP NATS server — LAN-only agent coordination bus
server_name: hive-b00t-relay
# Accessible from fung1 (192.168.1.149) and sm3lly (192.168.1.137)

port: 4222
http_port: 8222

# LAN agents (192.168.1.0/24) authenticate with a shared user/password.
# Replace with JWT operator when b00t auth federation is needed.
#
# Credential loaded via $VAR substitution, not hardcoded - this file is
# tracked in the public elasticdotventures/_b00t_ repo, so a committed
# plaintext value here is publicly exposed regardless of "LAN-only" being
# true for the port itself. HIVE_NATS_USER/HIVE_NATS_PASSWORD are exported
# by hive-b00t-relay.service's ExecStartPre (fetches from Azure Key Vault
# kv-pe-agent-secrets, config-global-hive-nats-{user,password}) - see
# b00t-cli/scripts/sync-nats-secrets.sh. Rotated 2026-09-01 after the prior
# static value was found committed here (infra#191).

# $VAR must be UNQUOTED here - confirmed live: "$HIVE_NATS_USER" (quoted)
# silently fails NATS's substitution (the literal quoted string gets used
# as the value), causing every real client to fail auth. Bare $VAR (no
# quotes) is required for substitution to actually trigger.
authorization {
  users = [
    { user: $HIVE_NATS_USER, password: $HIVE_NATS_PASSWORD }
  ]
}

# No clustering (direct connect between LAN peers)
# sm3lly connects directly as a plain LAN client (same subnet, no NAT), so
# it never needed the leafnode stub this comment used to describe.
#
# vultr1 (Vultr VPS, provisioned via `b00t provider endpoint deploy
# --provider vultr`) is not on the LAN. Per the pre-existing "b00t-node"
# firewall-group convention (only 22/80/443 public, reserved for
# SSH/pingap; NATS/Dapr stay localhost-only), its nats-server binds its
# leaf listener to 127.0.0.1 only — fung1 reaches it through a persistent
# SSH tunnel over port 22 (nats-vultr1-tunnel.service, forwards
# 192.168.1.149:17443 -> vultr1's 127.0.0.1:443) rather than direct public
# exposure. No TLS needed here since the SSH tunnel already encrypts the
# transport. Real credential lives in nats/leaf-remotes.conf (gitignored,
# see .gitignore) — NATS config `$VAR` substitution only resolves whole bare
# values, not references embedded inside a quoted compound string like a
# URL, so env-var interpolation doesn't work here; `include` is the only
# way to keep this out of git. Unlike the LAN password above, this
# credential ultimately reaches a public host and must never be committed
# in plaintext.
include ./leaf-remotes.conf

# Minimal logging
debug: false
trace: false
