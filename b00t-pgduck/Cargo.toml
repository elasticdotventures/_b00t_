[package]
name = "b00t-pgduck"
version = "0.10.6"
edition = "2024"
authors = ["Brian Horakh <brian@promptexecution.com>"]
license = "MIT"
description = "Postgres-wire-protocol OLAP server backed by DuckDB - drop-in replacement for the pods/postgres service, no Postgres binary required"

[lib]
name = "b00t_pgduck"
path = "src/lib.rs"

[[bin]]
name = "b00t-pgduck"
path = "src/main.rs"

[dependencies]
pgwire = { version = "0.36", default-features = false, features = ["server-api-aws-lc-rs"] }
duckdb = { version = "1.1", features = ["bundled"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "macros"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.31"
opentelemetry = { version = "0.30", features = ["trace"] }
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.30", features = ["trace", "grpc-tonic"] }

[lints.rust]
unused_must_use = "warn"
dead_code = "warn"

[lints.clippy]
pedantic = "warn"
cargo = "warn"
module_name_repetitions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }