[package]
name = "b00t-l3dg3rr-viz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic l3dg3rr invariant graph contract with Mermaid and SVG visualization utilities"
readme = "README.md"
keywords = ["b00t", "l3dg3rr", "visualization", "invariants", "graph"]
categories = ["visualization", "data-structures"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
kasuari = "0.4"
mermaid-rs-renderer = { version = "0.3", default-features = false, optional = true }

[features]
default = []
mermaid-native = ["dep:mermaid-rs-renderer"]

[dev-dependencies]
blake3 = "1.8"

[lints]
workspace = true
