[package]
name = "b00t-bouncer"
version.workspace = true
edition = "2024"
authors = ["Brian Horakh <brian@promptexecution.com>"]
license = "MIT"
description = "Bouncer pattern gatekeeper for b00t hive agents"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
regex = "1.10.5"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
