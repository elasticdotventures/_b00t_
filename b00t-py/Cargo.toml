[package]
name = "b00t-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for b00t-cli with native performance using PyO3"
keywords = ["b00t", "python", "bindings", "mcp", "cli"]
categories = ["api-bindings", "command-line-utilities"]

[lib]
name = "b00t_py"
crate-type = ["cdylib"]

[dependencies]
# Workspace dependencies
b00t-cli = { path = "../b00t-cli" }
b00t-c0re-lib = { path = "../b00t-c0re-lib", features = ["python"] }
k0mmand3r = { path = "../k0mmand3r" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml.workspace = true

# PyO3 for Python bindings.
# abi3-py38: build against the stable ABI floor matching requires-python
# (>=3.8 in pyproject.toml) — one wheel then works unmodified across every
# newer CPython 3.x, rather than needing a fresh wheel built per minor
# version release (3.11/3.12/3.13/3.14/...).
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"] }

[build-dependencies]
pyo3-build-config = "0.27"
