[package]
name = "b00t-cli"
# 🤓 Version inherited from b00t-c0re-lib - the single source of truth
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "b00t-cli"
path = "src/main.rs"

[[bin]]
name = "b00t"
path = "src/b00t.rs"

[[bin]]
name = "b00t-rpa"
path = "src/bin/rpa.rs"
required-features = ["rpa"]

[lib]
name = "b00t_cli"
path = "src/lib.rs"

[dependencies]
rpassword = "7"
tiktoken-rs = "0.7.0"
# Shared workspace dependencies
serde = { version = "1.0", features = ["derive"] }
hostname = "0.4"
serde_json = "1.0"
toml.workspace = true
clap = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
diffy = { workspace = true }
tempfile = "3.13.0"
thiserror = "2"

# b00t-cli specific dependencies
rhai = { workspace = true }
b00t-c0re-lib = { workspace = true }
b00t-l3dg3rr-viz = { workspace = true }
b00t-bouncer = { path = "../b00t-bouncer" }
blessed = { path = "../blessed" }
b00t-grok = { workspace = true }
k0mmand3r = { workspace = true }
openssl-sys = { workspace = true }
duct = "1.0"
shellexpand = "3.1"
shlex = "1.3"
semver = "1.0"
tera = "1.20"
dirs = "6.0"
once_cell = "1.20"
kube = { version = "4.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
snafu = "0.8"
tokio = { version = "1.34.0", features = ["full"] }
serde_yaml = "0.9"
tracing = "0.1"
opentelemetry.workspace = true
uuid = { version = "1.0", features = ["v4"] }
mti.workspace = true
b00t-reflect-types.workspace = true
fs2 = "0.4"
confy = "2.0"
libc = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
axum = { version = "0.7", features = ["macros"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
rusqlite = { version = "0.32", features = ["bundled"] }
whoami = "1.6"
b00t-chat = { workspace = true }
env_logger = "0.11"
mdns-sd = "0.19.1"
rand = "0.8"
b00t-ipc = { path = "../b00t-ipc" }
b00t-embed = { workspace = true }
b00t-c0re-gov = { path = "../b00t-c0re-gov" }
b00t-c0re-hierarchy = { path = "../b00t-c0re-hierarchy" }
b00t-c0re-a2a = { path = "../b00t-c0re-a2a" }
zbus = { workspace = true, optional = true }
url = "2.5"
async-nats = "0.45.0"
glob = "0.3.3"
which = "7"
inquire = "0.7"
sha2 = "0.10"
ed25519-dalek = "2"
zeroize = { version = "1", features = ["alloc"] }
hex = "0.4"
walkdir = "2"
flate2 = "1"

# Apalis - Background job processing for workflow execution
apalis = "1.0.0-rc.3"
apalis-sqlite = "1.0.0-rc.3"

# LLM Inference & RAG Integration - Phase 7
# 🤓 candle: Meta's Rust ML framework with zero-copy GPU acceleration
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
# 🤓 hf-hub: Hugging Face model hub client for downloading pre-trained models
hf-hub = { version = "0.4", optional = true }
# 🤓 tokenizers: Fast BPE tokenizer implementation
tokenizers = { version = "0.22", optional = true }
# 🤓 llama.cpp-sys: LLVM-accelerated CPU inference fallback (feature-gated)
llama_cpp_sys = { version = "0.2", optional = true }
# 🤓 ndarray: N-dimensional array algebra for tensor operations (Task 7: RAG vector storage)
ndarray = "0.15"
# 🤓 async-trait: Syntactic sugar for trait methods with async fn (Task 2: LLMInference trait definition)
async-trait = "0.1"
# RunPod GPU cloud client — serverless endpoints + on-demand pods; reqwest-based async
# 🤓 vendor/runpod-sdk: upstream missing required fields fixed locally; PR pending ernestas-poskus/runpod
runpod-sdk = { path = "../vendor/runpod-sdk" }
gix-attributes = "0.33"
bstr = "1.12"

# RPA: Browser automation via CDP + ratatui TUI (feature-gated)
chromiumoxide = { version = "0.9", optional = true }
futures = "0.3"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
nucleo = { version = "0.5", optional = true }
atty = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }

[features]
default = []
# 🤓 rpa: Browser RPA via CDP + ratatui TUI (heavy deps — chromiumoxide, ratatui)
rpa = ["chromiumoxide", "ratatui", "crossterm", "nucleo", "atty", "base64"]
rpa-playwright = []  # Playwright subprocess backend (no extra Rust deps)
# 🤓 dbus: Enable D-Bus IPC via zbus (restored; required by lib.rs, hive.rs, commands/soul.rs)
dbus = ["b00t-ipc/dbus", "dep:zbus"]
# 🤓 candle: Enable Candle-based inference (GPU/CPU with CUDA support)
# ✅ Fixed 2026-05-04: bumped candle from 0.4 → 0.10 to resolve rand_distr/half f16 trait conflict.
#    cargo build --features candle now compiles cleanly.
candle = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "tokenizers"]
# 🤓 llamacpp-fallback: Enable llama.cpp CPU inference for systems without GPU
llamacpp-fallback = ["llama_cpp_sys"]

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.13.0"
