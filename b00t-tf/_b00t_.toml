# b00t Session Configuration
# Default values for infrastructure provisioning

[b00t]
name = "b00t-infrastructure"
type = "session"
hint = "OpenTofu infrastructure provisioning defaults"

[session]
project_name = "b00t"
aws_region = "us-east-1"
cloudflare_zone = ""

[gcp]
# Build plane (plan gleaming-jingling-nygaard). .env keys GCP_PROJECT_ID /
# GCP_REGION / GCP_CONTROL_MACHINE_TYPE / GCP_ALLOWED_CIDRS / GCP_NETWORK_MODE
# override these.
project_id = "promptexecution"
region = "australia-southeast1"
control_machine_type = "e2-small"
# "public" = build phase (external IP + Cloud Run waker). "tailnet" = end state
# (no public ingress; reach over Tailscale). See plan Phase 2.75.
network_mode = "public"

[providers]
anthropic_enabled = true
openrouter_enabled = false
openai_enabled = false

[infrastructure]
cloudflare_workers = true
aws_lambda = false
monitoring = false

[tools]
filesystem = true
git = true
terminal = true
terraform = true
docker = false
kubernetes = false