[package]
name = "cloudflare-b00t"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloudflare capability provider for b00t — typed ProviderRegistry, AbstractCloudProvider impl, datum-driven discovery"
repository.workspace = true

[lib]
name = "cloudflare_b00t"
crate-type = ["rlib"]

[dependencies]
b00t-c0re-lib = { workspace = true }
serde = { workspace = true }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
anyhow = "1"
tracing = "0.1"
chrono = { workspace = true }
blake3 = "1"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
