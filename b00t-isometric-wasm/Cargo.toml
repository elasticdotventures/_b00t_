[package]
name = "b00t-isometric-wasm"
version.workspace = true
edition.workspace = true
description = "WASM wrapper around b00t-l3dg3rr-viz isometric engine for client-side layout + SVG rendering"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2"
b00t-l3dg3rr-viz = { path = "../b00t-l3dg3rr-viz" }
serde_json = "1"
