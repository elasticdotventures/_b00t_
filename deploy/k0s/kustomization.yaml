# Keyless GCP identity for the k0s / kubernetes dstack backend.
# Plan gleaming-jingling-nygaard. Apply after modules/gcp-build-plane/wif-k0s.tf
# and deploy/k0s/publish-oidc-discovery.sh.
#
#   kubectl kustomize deploy/k0s | \
#     sed -e "s/PROJECT_NUMBER/$(gcloud projects describe promptexecution --format='value(projectNumber)')/g" \
#         -e "s/PROJECT_ID/promptexecution/g" | kubectl apply -f -
#
# 🤓 PROJECT_NUMBER / PROJECT_ID are placeholders — the sed above (or a CI step)
# substitutes them. Kept literal here so `kubectl kustomize` builds offline.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: b00t-ci

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - ar-pull-refresher.yaml

configMapGenerator:
  - name: gcp-wif-credential-config
    files:
      - credential-configuration.json=files/credential-configuration.json
  - name: ar-pull-refresh-script
    files:
      - ar-pull-refresh.sh=files/ar-pull-refresh.sh

generatorOptions:
  disableNameSuffixHash: true
