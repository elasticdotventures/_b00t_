# SPIRE custom resources (the SPIRE server/agent/OIDC/CSI themselves come from
# the spiffe/spire Helm chart — see values.yaml). Apply AFTER the chart so the
# ClusterSPIFFEID CRD exists.
#
#   kubectl kustomize deploy/k0s/spire | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - clusterspiffeid-build-plane.yaml
