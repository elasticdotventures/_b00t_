# SPIRE on k0s — the single multi-cloud identity root.
# Plan gleaming-jingling-nygaard, identity-plane step 3.
# Chart: https://github.com/spiffe/helm-charts-hardened  (`spiffe/spire`)
#
#   helm repo add spiffe https://spiffe.github.io/helm-charts-hardened/
#   helm upgrade --install spire spiffe/spire -n spire-mgmt --create-namespace \
#     -f deploy/k0s/spire/values.yaml
#
# Trust domain is fixed here so workload SPIFFE IDs / cloud trust conditions
# never have to change. See
# docs/superpowers/specs/2026-09-09-identity-plane-minimum-requirements.md.

global:
  spire:
    trustDomain: b00t.promptexecution.com
    # k0s ships containerd; the CSI driver + agent talk to it here.
    clusterName: b00t-node

spire-server:
  replicaCount: 3            # HA — requirement #6
  # Requirement #6: a real datastore, not the default sqlite PVC. Point this at
  # CloudSQL / RDS / Cockroach before production. Left as sqlite here only so a
  # single-node bring-up works; DO NOT ship 3 replicas on sqlite.
  dataStore:
    sql:
      databaseType: sqlite3   # TODO: postgres + external DSN via a Secret
  # CA: self-managed upstream CA is fine for v1; swap to an upstream (GCP CAS /
  # AWS PCA / Vault) when the CA becomes a shared dependency.
  caTTL: 168h
  # SVIDs measured in minutes — requirement #4.
  ttl: 30m
  controllerManager:
    enabled: true             # requirement #8 — reconcile entries from CRs
    watchClassless: false
  ingress:
    enabled: false            # server API is cluster-internal only

spire-agent:
  # k0s containerd socket
  socketPath: /run/spire/agent-sockets/spire-agent.sock
  workloadAttestors:
    k8s:
      enabled: true
      disableContainerSelectors: false   # allow image-digest selectors — req #3

# The OIDC Discovery Provider — this is the public JWKS endpoint every cloud
# (GCP WIF / Azure fed-cred / AWS IAM-OIDC) federates against. Requirement #6:
# stable public HTTPS URL + managed cert + monitoring.
spiffe-oidc-discovery-provider:
  enabled: true
  config:
    domains:
      - oidc.b00t.promptexecution.com
  tls:
    spire:
      enabled: false          # terminate TLS at the ingress / Cloudflare
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: oidc.b00t.promptexecution.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts: [oidc.b00t.promptexecution.com]
        secretName: spire-oidc-tls

# The SPIFFE CSI driver — how workloads receive their SVID (replaces the k0s
# projected-token + pfnet webhook path from the bootstrap step).
spiffe-csi-driver:
  enabled: true
