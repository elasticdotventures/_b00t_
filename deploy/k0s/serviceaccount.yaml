# The ServiceAccount build-plane task Pods run as. Its projected token is what
# GCP WIF trusts (see modules/gcp-build-plane/wif-k0s.tf attribute_condition:
# assertion.sub == "system:serviceaccount:b00t-ci:b00t-ci").
#
# The annotations are consumed by the pfnet-research
# gcp-workload-identity-federation-webhook, which injects the projected-token
# volume + the external_account ADC config into any Pod using this SA — no
# per-task boilerplate. Without the webhook, mount cm/gcp-wif-credential-config
# + a serviceAccountToken projected volume manually.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: b00t-ci
  namespace: b00t-ci
  annotations:
    cloud.google.com/workload-identity-provider: "projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/external-idp/providers/k0s-oidc"
    cloud.google.com/service-account-email: "b00t-k0s-workload@PROJECT_ID.iam.gserviceaccount.com"
    cloud.google.com/audience: "//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/external-idp/providers/k0s-oidc"
    cloud.google.com/token-expiration: "3600"
