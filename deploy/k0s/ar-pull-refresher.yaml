# Keeps the `ar-pull` dockerconfigjson Secret fresh with a short-lived,
# keyless (WIF) Artifact Registry token — replaces the long-lived
# _json_key pull secret. Runs every 40 min; tokens last ~60.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ar-pull-refresher
  namespace: b00t-ci
  annotations:
    cloud.google.com/workload-identity-provider: "projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/external-idp/providers/k0s-oidc"
    cloud.google.com/service-account-email: "b00t-k0s-workload@PROJECT_ID.iam.gserviceaccount.com"
    cloud.google.com/audience: "//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/external-idp/providers/k0s-oidc"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ar-pull-secret-writer
  namespace: b00t-ci
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ar-pull-refresher
  namespace: b00t-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ar-pull-secret-writer
subjects:
  - kind: ServiceAccount
    name: ar-pull-refresher
    namespace: b00t-ci
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ar-pull-refresher
  namespace: b00t-ci
spec:
  schedule: "*/40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        spec:
          serviceAccountName: ar-pull-refresher
          restartPolicy: Never
          containers:
            - name: refresh
              image: docker.io/library/python:3.12-slim
              command: ["/bin/bash", "/scripts/ar-pull-refresh.sh"]
              env:
                - name: WIF_AUDIENCE
                  value: "//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/external-idp/providers/k0s-oidc"
                - name: SA_EMAIL
                  value: "b00t-k0s-workload@PROJECT_ID.iam.gserviceaccount.com"
                - name: AR_HOST
                  value: "australia-southeast1-docker.pkg.dev"
                - name: TARGET_NS
                  value: "b00t-ci"
                - name: SECRET_NAME
                  value: "ar-pull"
              volumeMounts:
                - name: gcp-token
                  mountPath: /var/run/secrets/gcp
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: gcp-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: "//iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/external-idp/providers/k0s-oidc"
                      expirationSeconds: 3600
                      path: token
            - name: scripts
              configMap:
                name: ar-pull-refresh-script
                defaultMode: 0755
