[package]
name = "b00t-embed"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified embedding adapter wrapping embed_anything for b00t, ledgrrr, and irontology-mcp"

[dependencies]
embed_anything = { path = "../vendor/embed-anything-b00t/rust" }
anyhow = "1"
hf-hub = { version = "1.0", default-features = false, features = ["blocking"] }
tokenizers = { version = "0.22", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2"
candle-core = "0.11"
candle-nn = "0.11"
dyn-clone = "1"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
cuda = ["embed_anything/cuda"]
metal = ["embed_anything/metal"]
ort = ["embed_anything/ort"]

[[example]]
name = "extract_qwen3_heads"
path = "examples/extract_qwen3_heads.rs"
