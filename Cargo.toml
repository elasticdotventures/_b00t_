[workspace]
members = [
    "b00t-crate",
    "b00t-cad",
    "b00t-cli",
    "b00t-pgduck",
    "b00t-mcp",
    "b00t-c0re-lib",
    "b00t-c0re-gov",
    "capability-forge",
    "b00t-lib-chat",
    "b00t-grok",
    "k0mmand3r",
    "b00t-pyverse",
    "b00t-ipc",
    "b00t-azure-cp",
    "blessed",
    "b00t-l3dg3rr-viz",
    "b00t-ast",
    "b00t-bouncer",
    "b00t-c0re-hierarchy",
    "b00t-c0re-role",
    "b00t-c0re-a2a",
    "b00t-embed",
    "b00t-candle-serve",
    "b00t-datum-core",
    "b00t-lsp",
    "b00t-zellij",
    "b00t-admin",
    "b00t-mermaid-wasm",
    "b00t-ui-wasm",
    # 🤓 #714: tracked in git (feat 50d13d82) but missing from workspace
    # members — this is the WASM renderer that actually consumes
    # /api/admin/viz/entangle/json (see its own module doc), yet was
    # unbuildable via `cargo build --workspace`. Restoring membership so it
    # participates in workspace builds/tests again.
    "b00t-isometric-wasm",
    "b00t-embed-serve",
    "b00t-stt-serve",
    "b00t-council",
    # 🤓 uses version.workspace=true / edition.workspace=true — was absent from
    # both members and exclude, so `cargo check -p b00t-c0re` failed with
    # Cargo's "package believes it's in a workspace" error. Restoring
    # membership; it's a leaf wasm-bindgen crate (no path deps), safe to add.
    "b00t-c0re-npm",
    "b00t-forge-kv",
]
exclude = ["vendor/embed-anything-b00t",
    "vendor/rust-docs-mcp-b00t",
    "vendor/runpod-sdk"]
# 🤓 "vendor/gemm-common" removed from this list (2026-08-24) — the
# .gitmodules entry it corresponded to was a stale declaration with no
# actual gitlink or directory on disk; removed in the same housekeeping
# pass, so excluding a nonexistent path is no longer needed.
resolver = "2"

[workspace.package]
# 🤓 Version management centralized in b00t-c0re-lib
# All workspace crates inherit from the single source of truth
version = "0.10.5"
edition = "2024"
authors = ["Brian Horakh <brian@promptexecution.com>"]
license = "MIT"
repository = "https://github.com/elasticdotventures/_b00t_"

[workspace.dependencies]
diffy = "0.5"
# ufo-types was extracted out of this monorepo (crates/ufo-types) into its
# own lightweight standalone repo — see https://github.com/PromptExecution/ufo-types.
# It has no _b00t_-specific deps; pulling it via a plain crate-scoped git dep
# avoids consumers of ufo-types (e.g. external repos like app4dog) needing to
# clone this entire 34-submodule monorepo just to get a ~3k-line types crate.
# Pinned to the v0.11.0 tag, which covers the `sysml`/`mbse`/`iso_ir`/
# `data_format`/`model_capability`/`coherence`/`multi_model` modules (b00t
# SysML v2 spine consolidation epic, elasticdotventures/_b00t_#1177) —
# previously pinned by rev since no tag covered them yet.
ufo-types = { git = "https://github.com/PromptExecution/ufo-types.git", tag = "v0.11.0" }
# Workspace members
b00t-cli = { path = "b00t-cli" }
b00t-c0re-lib = { path = "b00t-c0re-lib" }
k0mmand3r = { path = "k0mmand3r" }
b00t-grok = { path = "b00t-grok", default-features = false }
b00t-chat = { path = "b00t-lib-chat" }
b00t-l3dg3rr-viz = { path = "b00t-l3dg3rr-viz" }
# tomllm = { path = "vendor/tomllm" }

# Rhai scripting engine — used for datum hooks (detect, install guards, etc.)
rhai = { version = "1", features = ["sync"] }

# Common dependencies that could be shared across workspace members
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.44", features = ["full"] }
rmcp = { version = "1", features = ["client", "transport-io", "server", "macros", "schemars", "transport-streamable-http-server", "transport-worker", "transport-child-process"] }
tracing = "0.1"
opentelemetry = { version = "0.31", features = ["trace"] }
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
thiserror = "2"
sha2 = "0.10"

# b00t-embed — unified embedding adapter  
b00t-embed = { path = "b00t-embed" }
b00t-datum-core = { path = "b00t-datum-core" }
b00t-zellij = { path = "b00t-zellij" }
b00t-admin = { path = "b00t-admin" }
b00t-reflect-types = { path = "vendor/ledgrrr/crates/b00t-reflect-types" }
# #1104: NOT taking a Cargo dependency on vendor/ledgrrr's `ledger-core` here
# -- its optional arc-kit-au -> msft-agent-gov-ledgrrr -> agentmesh chain
# hard-pins serde =1.0.228, which conflicts with the rest of this workspace's
# serde 1.0.229 (a real cross-cutting version conflict inside vendor/ledgrrr
# itself, not something to paper over by bumping serde workspace-wide, and
# out of scope to fix in that submodule right now -- other sessions are
# actively working in it). agent_token.rs instead reproduces just the small
# double-entry beancount transaction shape it needs locally; see that
# module's doc comment.
mti = "1.1.1"





[workspace.lints.rust]
unused_must_use = "warn"
dead_code = "warn"

[workspace.lints.clippy]
pedantic = "warn"
cargo = "warn"
# Allow some pedantic lints that are too noisy
# priority = 1 required: individual overrides must outrank their lint group (priority 0)
module_name_repetitions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

# Fork: gemm-common 0.19.0 — replace indexed FMLA (FEAT_FP16FML) with dup+regular
# FMLA (FEAT_FP16) for aarch64 hosts without fullfp16 (rk3588s, cortex-a55).
# TODO: upstream PR to gemm crate.
[patch.crates-io]
# gemm-common = { path = "vendor/gemm-common" }  # TODO: init submodule
# 🤓 runpod-sdk: upstream has required Pod/Machine fields absent in API responses; fixed locally, PR pending
runpod-sdk = { path = "vendor/runpod-sdk" }
