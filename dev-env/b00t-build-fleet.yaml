# b00t standby cloud build server — backing fleet.
# See docs/superpowers/specs/2026-08-10-cloud-build-server-design.md and
# plan gleaming-jingling-nygaard (Phase 4).
#
# 🤓 Not in that design doc's original "Components" list — added here
# because dstack requires a fleet to already exist before a dev-environment
# can be provisioned against it ("Before running a dev environment, make
# sure you've... created a fleet" — dstack's own dev-environments docs).
# `idle_duration` also belongs here, not on the dev-environment: verified
# against dstack's real fleet/dev-environment reference docs (the design
# doc's own idle_duration placement, on the dev-environment, doesn't match
# dstack's actual schema — this fleet is where dstack actually enforces it,
# deprovisioning instances above `min` once idle past this duration).
type: fleet
name: b00t-build-fleet

# 🤓 Region pin (plan decision #2, 2026-09-08): every build-plane resource
# pins to australia-southeast1 — a network volume can only attach to compute
# in its own region, so the fleet must match b00t-build-cache.volume.yaml.
# This deliberately overrides the older "don't hardcode fleet scope"
# convention (2026-07-23-b00t-dstack-gcp-backend-design.md).
regions: [australia-southeast1]

# min 0 (costs nothing while nothing's running), max 1 — a single-box build
# server, not a pool. Matches DstackProvider::ensure_fleet's own 0..1
# philosophy for on-demand capacity.
nodes: 0..1

# CPU/disk/network build box, no GPU. Floor sized for this workspace's cold
# compile (b00t-cli + Qdrant/candle/kube/embed-anything/OpenTelemetry): a
# smaller box thrashes. `..` = "at least".
resources:
  cpu: 8..
  memory: 32GB..
  disk: 200GB..
  gpu: 0

# Spot: ~60-70% cheaper (operator decision 2026-09-08, "eviction is okay if
# restart can be achieved"). `auto` = prefer spot, fall back to on-demand when
# spot capacity is unavailable so a build is never fully blocked; switch to
# `spot` for pure-cheapest (fails instead of falling back).
spot_policy: auto

# Auto re-provision an evicted node. ⚠️ verify `on_events` vs `on_status` and
# the accepted event names against dstack 0.20.28 before trusting this.
retry:
  on_events: [interruption, no-capacity]
  duration: 1h

idle_duration: 30m
# 🤓 Restart after a spot eviction: the node re-provisions (retry above), the
# dev-env `init:` re-runs (idempotent, re-mounts /mnt/cache from GCS), and the
# in-flight `cargo` dies — just re-run `just remote-build`/`remote-test`, which
# resumes WARM because target/ + sccache live on the GCS-backed mount, not the
# ephemeral box.
