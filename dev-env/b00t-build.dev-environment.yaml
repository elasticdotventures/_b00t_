# b00t standby cloud build server.
# See docs/superpowers/specs/2026-08-10-cloud-build-server-design.md,
# plan gleaming-jingling-nygaard (Phases 4-6), docs/runbooks/remote-build-server.md.
#
# SSH-only (no `ide:`) — driven by `just remote-build`/`remote-test`. Provisioned
# against b00t-build-fleet.yaml (apply that first — `just remote-provision`).
#
# Persistence model (rev 2026-09-08d): NO PD, NO FUSE mount. `target/` and the
# git checkout are LOCAL disk (ephemeral). The ONLY thing that survives an
# idle-stop is the **sccache cache**, which sccache writes straight to the GCS
# bucket via its native backend (SCCACHE_GCS_* below) — no gcsfuse, no privileged
# container. A rebuild on a fresh box replays 99.7% of compilation units from
# GCS (measured 2026-09-08: cold ~9 min -> warm ~3 min for b00t-cli).
type: dev-environment
name: b00t-build

# Prebaked toolchain image (containers/b00t-build/) — Ubuntu 24.04 +
# build-essential/cmake/clang/protoc/z3 + rustup stable + prebuilt sccache/
# nextest + gcsfuse. Rebuilt weekly by .github/workflows/b00t-build-image.yml.
# The `command -v X ||` guards in init: make it also work on a bare image.
image: australia-southeast1-docker.pkg.dev/promptexecution/b00t/b00t-build:latest

# The dev-environment drives its OWN provisioning (a fleet with target=0 has
# no idle nodes to land on) — so it needs its own resources + spot policy, not
# just the fleet's. Match the fleet floor.
resources:
  cpu: 8..
  memory: 32GB..
  disk: 200GB..
  gpu: 0
spot_policy: spot
retry:
  on_events: [no-capacity, interruption]
  duration: 30m
# Stop the box after 30m with no SSH (matches the fleet's idle_duration intent).
inactivity_duration: 30m

env:
  # dstack 0.20.28: bare `- FOO` resolves from the LOCAL shell only; secrets
  # need `- FOO=${{ secrets.FOO }}` (server-side substitution).
  - b00t_build_deploy_key=${{ secrets.b00t_build_deploy_key }}   # read-only deploy key for elasticdotventures/_b00t_

  # --- sccache -> GCS directly (opendal), no FUSE mount. Auth = the build-VM's
  #     attached SA via the metadata server (b00t-build-vm has
  #     storage.objectAdmin on the bucket — granted in b00t-tf Phase 2). ---
  - RUSTC_WRAPPER=sccache
  - SCCACHE_GCS_BUCKET=b00t-buildcache-promptexecution
  - SCCACHE_GCS_KEY_PREFIX=sccache
  - SCCACHE_GCS_RW_MODE=READ_WRITE                                # default is READ_ONLY
  - SCCACHE_GCS_SERVICE_ACCOUNT=b00t-build-vm@promptexecution.iam.gserviceaccount.com
  - CARGO_INCREMENTAL=0                                           # sccache rejects incremental

  # leverage #3: mold linker. Kept byte-identical to ci-build.task.yaml so an
  # interactive `cargo build --profile ci` lands on the same sccache entries CI
  # produced. 🤓 gcc/clang >= 12 accept `-fuse-ld=mold` directly (Ubuntu 24.04
  # ships gcc 13); on an older cc use `-C link-arg=--ld-path=/usr/bin/mold`.
  - RUSTFLAGS=-C link-arg=-fuse-ld=mold

  # --- workspace — checkout + target/ on LOCAL disk (target/ on an object FS
  #     is ~15-20x slower — measured). ---
  - CHECKOUT=/data/b00t
  - CARGO_TARGET_DIR=/data/b00t/target

# Idempotent — runs on every boot/resume, MUST finish before "ready".
init:
  # -- toolchain (ci-occt has only git) --
  - sudo apt-get update -qq
  - sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential cmake clang protobuf-compiler pkg-config libssl-dev z3 curl
  - command -v rustc >/dev/null || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
  # Prebuilt binaries — `cargo install` from source is 10-20 min each on 8 vCPU.
  - command -v sccache >/dev/null || { curl -fsSL "https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp && sudo install -m755 /tmp/sccache-*/sccache /usr/local/bin/sccache; }
  - command -v cargo-nextest >/dev/null || { curl -fsSL "https://get.nexte.st/latest/linux" | tar xz -C /tmp && sudo install -m755 /tmp/cargo-nextest /usr/local/bin/cargo-nextest; }
  # -- deploy key for the private clone --
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - printf '%s\n' "$b00t_build_deploy_key" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
  - grep -q github.com ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts
  # -- source checkout (local disk) --
  - '[ -d "$CHECKOUT/.git" ] || git clone git@github.com:elasticdotventures/_b00t_.git "$CHECKOUT"'
  - git -C "$CHECKOUT" submodule update --init --depth 1 vendor/embed-anything-b00t vendor/tomllm vendor/runpod-sdk
  - '[ -d "$CHECKOUT/vendor/ledgrrr/.git" ] || git clone --depth 1 https://github.com/PromptExecution/ledgrrr.git "$CHECKOUT/vendor/ledgrrr"'
  # -- warm sccache + report --
  - sccache --start-server && sccache --show-stats | head -3
  - . "$HOME/.cargo/env" && cd "$CHECKOUT" && echo "b00t-build ready @ $(git rev-parse --short HEAD) — $(rustc --version)"
