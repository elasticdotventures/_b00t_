# CI RUN stage on the KUBERNETES backend (k0s on vultr1) — plan
# gleaming-jingling-nygaard. Same job as ci-test.task.yaml (run one nextest
# partition from the archive, no compilation) but scheduled as a k8s Pod
# instead of a GCP Spot VM: no Docker on the node (k0s containerd), lazy image
# pull via SOCI (if b00t-build has an index).
#
# GCS auth is KEYLESS: the pod receives a SPIRE JWT-SVID
# (spiffe://promptexecution.com/...) and gcs-obj.sh exchanges it at STS for a
# short-lived token via the `external_account` config path. SPIRE + the WIF
# binding live in PromptExecution/infrastructure (terraform/google/
# google-oidc-spire.tf, fleet/spire-agents.json) — NOT here. See
# docs/superpowers/specs/2026-09-09-build-plane-identity.md.
#
# Requires: a dstack `kubernetes` backend (deploy_cp_node.py --data
# k0s_kubeconfig=…) and the SPIRE SVID + external_account config delivered to
# the pod at the paths below (SPIRE CSI driver / spiffe-helper, per infra).
type: task
name: b00t-ci-test-k0s

image: australia-southeast1-docker.pkg.dev/promptexecution/b00t/b00t-build:latest

backends: [kubernetes]

resources:
  cpu: 4..
  memory: 16GB..
  disk: 40GB..
  gpu: 0

env:
  - BUILDCACHE_BUCKET=b00t-buildcache-promptexecution
  # external_account config written by the SVID-delivery sidecar; its
  # credential_source.file points at the JWT-SVID under /spiffe-workload-api.
  - GOOGLE_APPLICATION_CREDENTIALS=/var/run/gcp/credential-configuration.json
  - b00t_build_deploy_key=${{ secrets.b00t_build_deploy_key }}
  # supplied per-run by the workflow / Dagster:
  - CI_ARCHIVE_KEY
  - CI_REF
  - NEXTEST_PARTITION            # e.g. "1/4"

commands:
  - set -eu
  - . "$HOME/.cargo/env"
  - mkdir -p /data/src
  # gcs-obj.sh ships in the src tarball, but we need it before we have src.
  # It is also baked into the b00t-build image at /usr/local/bin — use that.
  - gcs-obj.sh get "$BUILDCACHE_BUCKET" "$CI_ARCHIVE_KEY/src.tar.zst" /data/src.tar.zst
  - gcs-obj.sh get "$BUILDCACHE_BUCKET" "$CI_ARCHIVE_KEY/nextest.tar.zst" /data/nextest.tar.zst
  - tar -I zstd -xf /data/src.tar.zst -C /data/src
  - du -sh /data/src /data/nextest.tar.zst
  - cargo nextest run
      --archive-file /data/nextest.tar.zst
      --workspace-remap /data/src
      --partition "count:${NEXTEST_PARTITION}"
