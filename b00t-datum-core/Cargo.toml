[package]
name = "b00t-datum-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core datum types and TOMLLM document parser for b00t ecosystem"
keywords = ["b00t", "datum", "tomllm", "edl", "z3"]
categories = ["data-structures", "parsing"]

[lib]
name = "b00t_datum_core"
path = "src/lib.rs"

[features]
default = []
# z3 validation via subprocess (requires z3 binary in PATH; no libz3-sys link-time dep)
z3-subprocess = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile = "3.10"
