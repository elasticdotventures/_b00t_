[mcp]
name = "pm2-mcp"
description = "PM2 process manager MCP — start/stop/restart/status/logs for b00t background services"
command = "node"
args = ["{{ script_dir }}/pm2-mcp-server.mjs"]

[b00t]
icon = "⚡"
status = "active"
enabled = true

[b00t.lifecycle]
restart = "always"
health_check_cmd = "pm2 ping"
