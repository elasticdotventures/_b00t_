[b00t]
name = "ccometixline"
desires = "latest"
install = """
npm install -g @cometix/ccline
"""
update = """
npm update -g @cometix/ccline
"""
version = "ccline --version"
version_regex = '\d+\.\d+\.\d+'
hint = "CCometixLine is a high-performance Rust-based statusline tool for Claude Code. Displays git status, Claude model info, context usage, and workspace location. Requires Nerd Fonts for icon display."

[b00t.learn]
topic = "ccometixline"

[b00t.references]
github = "https://github.com/Haleclipse/CCometixLine"
npm = "https://www.npmjs.com/package/@cometix/ccline"

[b00t.usage]
examples = [
  { description = "Check installation", command = "ccline --version" },
  { description = "View statusline output", command = "ccline" },
  { description = "Enable verbose mode", command = "ccline --verbose" }
]

[b00t.requirements]
git_version = "1.5+"
recommended_git = "2.22+"
fonts = "Nerd Fonts required for proper icon display"
environment = "Claude Code"
