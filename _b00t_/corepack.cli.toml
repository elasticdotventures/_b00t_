[b00t]
name = "corepack"
type = "cli"
desires = "0.31.0"
# corepack is bundled with Node.js >= 16.10 — no separate download needed.
# If Node.js is present, just enable corepack:
install = """
NODE_VER=$(node --version 2>/dev/null | sed 's/v//') || true
if [ -z "$NODE_VER" ]; then
  echo "❌ Node.js not found. Install Node.js >=16.10 via nvm or your distro package manager." && exit 1
fi
NODE_MAJOR=$(echo "$NODE_VER" | cut -d. -f1)
NODE_MINOR=$(echo "$NODE_VER" | cut -d. -f2)
if [ "$NODE_MAJOR" -lt 16 ] || { [ "$NODE_MAJOR" -eq 16 ] && [ "$NODE_MINOR" -lt 10 ]; }; then
  echo "❌ Node.js $NODE_VER detected; corepack requires >=16.10." && exit 1
fi
corepack enable
corepack enable pnpm
corepack enable yarn
"""
update = """
npm install -g corepack@latest
corepack enable
"""
version = "corepack --version"
version_regex = '\d+\.\d+\.\d+'
hint = "corepack manages pnpm/yarn versions declared in package.json#packageManager. Bundled with Node.js >=16.10; never needs curl|sh."
