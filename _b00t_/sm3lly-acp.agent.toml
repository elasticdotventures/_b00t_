# b00t Agent Datum — sm3llsl1k3s0ld3r remote ch0nky node

[b00t]
name = "sm3lly-acp"
type = "agent"
hint = "Remote sm3llsl1k3s0ld3r solar+battery node route for ch0nky Qwen36 ACP delegation over NATS"

entangled_mcp = ["b00t-mcp.mcp"]

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
pid = "sm3lly-001"
model = "qwen36/ch0nky"
skills = ["compile", "test", "install", "long-session", "ch0nky-code", "nats-acp"]
personality = "laconic"
role = "specialist"

[b00t.agent.ipc]
protocol = "nats+acp"
pubsub = true
subject_prefix = "hive.sm3lly.acp"
nats_url_env = "NATS_URL"
default_nats_url = "nats://c010.promptexecution.com:4222"

[b00t.agent.crew]
role = "specialist"
captain = false
tier = "ch0nky"


[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

[b00t.agent.exchange]
local_offer = "run sm0l toil models/tasks locally for sm3llyd0s"
remote_offer = "run qwen36 ch0nky compile/test/install sessions for b00t"
policy = "two-way service exchange inside same hive/cluster"

[[b00t.usage]]
description = "Inspect local ACP transport state"
command = "just acp-sm3lly-status"

[[b00t.usage]]
description = "Publish local ACP status through current chat transport"
command = "b00t chat send --transport nats --message 'sm3lly route check'"

