[b00t]
name = "ockham"
type = "skill"
type_tags = ["transferable"]
hint = "Occam's razor — prefer the simplest explanation that fits the evidence; complexity is a liability"
keywords = ["occam", "ockham", "razor", "simplicity", "parsimony", "complexity", "explanation", "minimal"]

[b00t.learn]
content = """
Occam's Razor (William of Ockham): among competing explanations, prefer the one with fewest assumptions.
"Entities must not be multiplied beyond necessity." (entia non sunt multiplicanda praeter necessitatem)
Application in reasoning: if two hypotheses fit the evidence equally well, choose the simpler one.
Application in code: if two implementations are correct, choose the one with fewer moving parts.
Complexity test: "does removing this component break anything?" If no → remove it.
In debugging: the simple explanation (misconfiguration, off-by-one, nil pointer) is almost always right.
Resist: exotic multi-system conspiracy theories when a single mundane cause fits all evidence.
Caveat: Occam's razor selects between EQUALLY FITTED explanations — don't use it to reject a complex
truth when the evidence actually requires it. Parsimony, not oversimplification.
Anti-pattern: over-engineering; adding abstraction layers "just in case."
"""

