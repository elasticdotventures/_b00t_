[b00t.learn]
content = """
Pre-mortem (Gary Klein): before starting, assume the project has catastrophically failed.
Ask: "It is 6 months from now. This project failed completely. Why?"
Then list every plausible cause. Rank by likelihood × impact.
This works because prospective hindsight activates different reasoning than risk analysis.
People are more honest about failure causes when asked "why did it fail" vs "what might go wrong."
Steps:
  1. State the goal clearly.
  2. Fast-forward to failure. "It failed. What happened?"
  3. List all causes — suppress optimism bias, allow pessimism.
  4. For each top-3 cause: add a mitigation to the plan now.
In code: "we shipped this feature and it broke prod — why?" Before shipping, not after.
Anti-pattern: only planning for success; optimism bias makes teams underweight tail risks.
"""

