# b00t Hive Profile — Qwen3.6-35B-A3B sm0l inference via llama.cpp Podman
# 🤓 MoE (Mixture of Experts): 35B total, ~3B active per token — sm0l tier
# 🤓 UD-IQ4_XS quant: 17GB model + KV cache = ~20GB VRAM — fits RTX 3090 24GB
# 🤓 NOT systemd-managed — run via: podman kube play _b00t_/k8s/a3b-sm0l.pod.yml
# 🤓 OpenAI-compatible API at port 8001/v1 — b00t's native proxy endpoint
# 🤓 OpenCode: opencode run --model b00t-sm0l "task"
#
# Activate: podman kube play _b00t_/k8s/a3b-sm0l.pod.yml
# Deactivate: podman kube down _b00t_/k8s/a3b-sm0l.pod.yml

[b00t]
name = "inference-qwen36-35b-a3b-llamacpp"
type = "hive_profile"
hint = "Qwen3.6-35B-A3B UD-IQ4_XS via llamacpp podman — 17.7GB VRAM + 6GB KV, 64k ctx, RTX3090"
depends_on = ["qwen36-local.model.ai", "vllm.cli", "huggingface.cli", "ollama.ai"]

[b00t.hive.resources]
# 🤓 UD-IQ4_XS weights ~17GB + KV@32K ~3GB + overhead ~1GB = ~21GB; 3GB headroom
ram_gb    = 2
gpu_mb    = 21000
cpu_cores = 2

[b00t.hive.resources.gate]
ram_free_gb = 1
gpu_free_mb = 20000

[b00t.hive.exclusion]
group    = "ai-inference"
priority = 80

# ── Guard: systemctl is legacy — use podman kube play ───────────────────────
[[b00t.hive.guards]]
pattern = "systemctl"
action  = "warn"
message = "⚠️  systemctl is deprecated for service management. Use: podman kube play _b00t_/k8s/*.pod.yml"

[[b00t.hive.guards]]
pattern = "pip install"
action  = "warn"
message = "🦨 use uv pip install"

[[b00t.hive.guards]]
pattern = "docker run"
action  = "warn"
message = "🦨 use podman (CDI GPU: podman kube play)"

# ── Environment (OpenAI-compatible) ──────────────────────────────────────────
[b00t.hive.env]
B00T_AI_SM0L_BASE   = "http://127.0.0.1:8001/v1"
B00T_AI_SM0L_MODEL  = "b00t-sm0l"
OPENAI_BASE_URL     = "http://127.0.0.1:8001/v1"
OPENAI_API_KEY      = "local-b00t"

# ── OpenCode integration ─────────────────────────────────────────────────────
[b00t.opencode]
endpoint = "http://127.0.0.1:8001/v1"
model    = "b00t-sm0l"
api_key  = "local-b00t"
tier     = "sm0l"
config   = """
models:
  b00t-sm0l:
    api_base: http://127.0.0.1:8001/v1
    api_key: local-b00t
    model_id: b00t-sm0l
    tier: sm0l
    context_window: 32768
    capabilities:
      - code_generation
      - tool_calling
      - reasoning
"""

# ── Usage recipes ────────────────────────────────────────────────────────────
[[b00t.usage]]
description = "Start sm0l inference via podman (preferred)"
command = "podman kube play _b00t_/k8s/a3b-sm0l.pod.yml"

[[b00t.usage]]
description = "Stop sm0l inference"
command = "podman kube down _b00t_/k8s/a3b-sm0l.pod.yml"

[[b00t.usage]]
description = "Verify sm0l endpoint"
command = "curl -s http://localhost:8001/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "Test sm0l completion"
command = "curl -s http://localhost:8001/v1/chat/completions -H 'Content-Type: application/json' -d '{\"model\":\"b00t-sm0l\",\"messages\":[{\"role\":\"user\",\"content\":\"reply with: HIVE_SM0L_ONLINE\"}],\"max_tokens\":10}' | python3 -m json.tool"

[[b00t.usage]]
description = "Run OpenCode with local sm0l"
command = "opencode run --model b00t-sm0l 'say hello in 3 words'"

[[b00t.usage]]
description = "Check VRAM usage"
command = "nvidia-smi --query-gpu=memory.used,memory.free,utilization.gpu --format=csv,noheader"

[[b00t.usage]]
description = "Check podman container logs"
command = "podman logs -f b00t-sm0l-llamacpp"

