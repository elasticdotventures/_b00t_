# Multi-stage build and test workflow
# Real-world example of building and testing b00t-cli

[b00t]
name = "build-and-test"
parent = "b00t.cli"
type = "job"
hint = "Multi-stage build and test workflow for b00t-cli"
version = "1.0.0"

[b00t.job]
description = "Build, test, and validate b00t-cli with checkpoints"
author = "b00t-dev-team"
tags = ["build", "test", "ci"]

[b00t.job.config]
mode = "sequential"
checkpoint_mode = "auto"
checkpoint_after_each_step = true
create_git_tag = true
use_subagents = false
continue_on_failure = false
retry_failed_steps = 0
rollback_on_failure = true

# Stage 1: Verify environment
[[b00t.job.steps]]
name = "verify-env"
description = "Verify build environment and dependencies"
checkpoint = "env-verified"

[b00t.job.steps.task]
type = "bash"
command = '''
echo "Verifying build environment..."
rustc --version
cargo --version
git --version
echo "Environment OK"
'''

# Stage 2: Clean build artifacts
# 🤓 scoped to this package only — a bare `cargo clean` wipes the shared
#    workspace target/ (20+ members), forcing every other crate to rebuild
#    from scratch too. `--package` only drops b00t-cli's own artifacts.
[[b00t.job.steps]]
name = "clean"
description = "Clean previous build artifacts (b00t-cli package only)"
checkpoint = "cleaned"

[b00t.job.steps.task]
type = "bash"
command = "cargo clean --package b00t-cli && echo 'Build artifacts cleaned'"
timeout_ms = 30000

# Stage 3: Run clippy lints
[[b00t.job.steps]]
name = "lint"
description = "Run clippy lints on codebase"
checkpoint = "lint-pass"
depends_on = ["b00t.cli", "rust.cli", "cargo.cli", "git.cli"]

[b00t.job.steps.task]
type = "bash"
command = '''
echo "Running clippy..."
cargo clippy --all-targets --all-features -- -D warnings || true
echo "Lint checks complete"
'''
timeout_ms = 120000

# Stage 4: Build debug
[[b00t.job.steps]]
name = "build-debug"
description = "Build debug binaries"
checkpoint = "debug-built"
depends_on = ["b00t.cli", "rust.cli", "cargo.cli", "git.cli"]

[b00t.job.steps.task]
type = "bash"
command = '''
echo "Building debug..."
cargo build --bin b00t-cli
echo "Debug build complete"
'''
timeout_ms = 300000

# Stage 5: Run unit tests
[[b00t.job.steps]]
name = "test-unit"
description = "Run unit tests"
checkpoint = "tests-pass"
depends_on = ["b00t.cli", "rust.cli", "cargo.cli", "git.cli"]

[b00t.job.steps.task]
type = "bash"
command = '''
echo "Running unit tests..."
cargo test --lib --no-fail-fast || true
echo "Unit tests complete"
'''
timeout_ms = 180000

# Stage 6: Build release
[[b00t.job.steps]]
name = "build-release"
description = "Build optimized release binaries"
checkpoint = "release-built"
depends_on = ["b00t.cli", "rust.cli", "cargo.cli", "git.cli"]

[b00t.job.steps.task]
type = "bash"
command = '''
echo "Building release..."
cargo build --release --bin b00t-cli
ls -lh target/release/b00t-cli
echo "Release build complete"
'''
timeout_ms = 600000

# Stage 7: Verify binaries
[[b00t.job.steps]]
name = "verify"
description = "Verify built binaries execute correctly"
checkpoint = "verified"
depends_on = ["b00t.cli", "rust.cli", "cargo.cli", "git.cli"]

[b00t.job.steps.task]
type = "bash"
command = '''
echo "Verifying binaries..."
./target/release/b00t-cli --version
echo "Binaries verified"
'''

# Rollback steps on failure
# 🤓 no destructive cleanup here on purpose — a failed build doesn't corrupt
#    the shared target/ cache, and `git clean -fdx target/` would wipe every
#    other workspace member's build artifacts too (target/ is gitignored
#    wholesale, so that command is equivalent to `rm -rf target/`). Just
#    re-running `cargo build` after a fix reuses the existing cache.
[[b00t.job.rollback]]
name = "report-failure"
description = "Report failure without touching the shared build cache"

[b00t.job.rollback.task]
type = "bash"
command = "echo 'build-and-test failed — target/ preserved intentionally for a fast retry; fix the code and re-run' >&2"

[b00t.job.env]
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"

[b00t.job.outputs]
artifacts = ["target/release/b00t-cli"]
logs = [".b00t/jobs/build-and-test/*.json"]
