[b00t]
name = "claude"
type = "cli"
desires = "2.1.76"
install = '''
npm install -g @anthropic-ai/claude-code
# post-install: wire b00t agent-hooks (non-destructive merge)
~/.b00t/_b00t_/agent-hooks/install-claude-hooks.sh
'''
update = '''
npm update -g @anthropic-ai/claude-code
~/.b00t/_b00t_/agent-hooks/install-claude-hooks.sh
'''
version = "claude --version"
version_regex = '\d+\.\d+\.\d+'
hint = "Claude Code CLI — AI coding assistant by Anthropic. b00t agent-hooks auto-installed on update."

# 🤓 agent-hooks are AI agent lifecycle hooks (PreToolUse, SubagentStart, etc.)
#    distinct from git hooks (pre-commit, pre-push) or CI/CD pipeline hooks.
#    install-claude-hooks.sh merges _b00t_/agent-hooks into ~/.claude/settings.json
#    non-destructively using jq deep-merge — safe to run repeatedly (idempotent).

hook_learn = '''
let hooks = exec("find $HOME/.b00t/_b00t_/agent-hooks -name '*.sh' | sort 2>/dev/null");
if hooks == "" {
    "warn: no agent-hooks found in _b00t_/agent-hooks/"
} else {
    let status = exec("cat $HOME/.claude/settings.json 2>/dev/null | python3 -c \"import sys,json; d=json.load(sys.stdin); h=d.get('hooks',{}); print('agent-hooks registered: ' + ', '.join(h.keys()) if h else 'no hooks registered in ~/.claude/settings.json')\" 2>/dev/null || echo 'settings.json not found'");
    "## b00t agent-hooks\n\nFiles:\n" + hooks + "\n\nStatus: " + status
}
'''

[validate]
command = "claude --version"
regex = "Claude Code"

[roles]
required_for = ["developer", "executive", "orchestrator"]
optional_for = []

# agent-hooks this datum provides (mapped to agent-hooks/events/ and roles/)
[b00t.agent_hooks]
events = ["session.start", "tool.pre", "tool.post", "agent.start", "agent.stop"]
install_script = "_b00t_/agent-hooks/install-claude-hooks.sh"
settings_target = "~/.claude/settings.json"

