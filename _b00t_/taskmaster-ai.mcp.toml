[b00t]
name = "taskmaster-ai"
type = "mcp"
hint = """
⚠️  LEGACY / REMOVED FROM ACTIVE B00T WORKFLOWS

TaskMaster is no longer part of the active b00t backlog path.
Use `TODO-next.md`, `b00t job`, and Redis-backed agent coordination instead.

This datum remains only for compatibility with older repos.

"""
[[b00t.mcp.stdio]]
command = "npx"
args = ["-y", "--package=task-master-ai", "task-master-ai"]
transport = "stdio"
priority = 0
requires = ["node"]

[b00t.env]
MISTRAL_API_KEY = ""
OPENROUTER_API_KEY = ""
XAI_API_KEY = ""
PERPLEXITY_API_KEY = ""
OPENAI_API_KEY = ""
OPENAI_BASE_URL = ""
ANTHROPIC_API_KEY = ""
AZURE_OPENAI_API_KEY = ""
AZURE_OPENAI_ENDPOINT= ""
OLLAMA_API_KEY = ""
OLLAMA_BASE_URL = ""
GOOGLE_API_KEY = ""
VERTEX_PROJECT_ID = ""
VERTEX_LOCATION = ""
GOOGLE_APPLICATION_CREDENTIALS = ""

[validate]
command = "npx --yes task-master --version"
regex = "\\d+\\.\\d+"

[roles]
required_for = []
optional_for = ["developer"]
