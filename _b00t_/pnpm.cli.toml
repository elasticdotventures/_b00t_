[b00t]
name = "pnpm"
desires = "10.6.5"
# ✅ Safe install path: corepack (bundled with Node.js >=16.10) — no curl|sh required.
# If corepack is not available, fall back to npm global install.
install = """
if command -v corepack >/dev/null 2>&1; then
  corepack enable pnpm
  corepack install -g pnpm@latest
elif command -v npm >/dev/null 2>&1; then
  npm install -g pnpm
else
  echo "❌ Neither corepack nor npm found. Install Node.js first (nvm recommended)."
  echo "   Run: b00t install corepack"
  exit 1
fi
"""
update = """
if command -v corepack >/dev/null 2>&1; then
  corepack install -g pnpm@latest
else
  npm install -g pnpm@latest
fi
"""
version = "pnpm --version"
version_regex = '\d+\.\d+\.\d+'
hint = "pnpm is a fast, disk-efficient package manager. Install via corepack (Node.js >=16.10) or npm. NEVER use curl|sh."
