[b00t]
name = "gh"
trigger_words = ["github", "issue", "pr", "repo", "backlog"]
type = "cli"
desires = "latest"
install = "curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && echo 'deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && sudo apt update && sudo apt install gh -y"
version = "gh --version"
version_regex = "\\d+\\.\\d+\\.\\d+"
hint = "gh is the official GitHub CLI, for interacting with GitHub from the command line."
unlocks = ["gh *"]

# ── Abstract interfaces for GitHub operations ───────────────────────────
# Priority: github_mcp (when MCP server running) → gh_cli (default) → curl_rest (fallback)
# Available backends are tried in order; first resolvable wins.
#
# github_mcp: uses @modelcontextprotocol/server-github MCP server
#   Tools: create_pull_request_comment, create_pull_request_review, etc.
#   Requires: MCP server running (b00t mcp list | grep github)
# gh_cli: GitHub CLI (gh pr comment, gh pr review, etc.)
#   Requires: gh auth status (authenticated)
# curl_rest: GitHub REST API via curl
#   Requires: GITHUB_TOKEN env var

[b00t.abstracts.pr_comment]
description = "Post a comment on a pull request"
github_mcp = "mcp__github__create_pull_request_comment pr={pr} body={body}"
gh_cli = "gh pr comment {pr} --body '{body}'"
curl_rest = '''
PR={pr}; BODY='{body}'
OWNER=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f1)
REPO=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f2)
curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
  https://api.github.com/repos/$OWNER/$REPO/issues/$PR/comments \
  -d "{\"body\": \"$BODY\"}"
'''
tokens = ["pr", "body"]

[b00t.abstracts.pr_review]
description = "Submit a formal PR review (approve, request-changes, comment)"
github_mcp = "mcp__github__create_pull_request_review pr={pr} event={event} body={body}"
gh_cli = "gh pr review {pr} --{event} --body '{body}'"
curl_rest = '''
PR={pr}; EVENT={event}; BODY='{body}'
OWNER=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f1)
REPO=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f2)
HEAD_SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
  https://api.github.com/repos/$OWNER/$REPO/pulls/$PR \
  | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['sha'])")
curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
  https://api.github.com/repos/$OWNER/$REPO/pulls/$PR/reviews \
  -d "{\"commit_id\": \"$HEAD_SHA\", \"event\": \"$EVENT\", \"body\": \"$BODY\"}"
'''
tokens = ["pr", "event", "body"]

[b00t.abstracts.pr_diff]
description = "Get the diff for a pull request"
gh_cli = "gh pr diff {pr}"
curl_rest = '''
PR={pr}
OWNER=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f1)
REPO=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f2)
curl -s -H "Authorization: token $GITHUB_TOKEN" \
  -H "Accept: application/vnd.github.v3.diff" \
  https://api.github.com/repos/$OWNER/$REPO/pulls/$PR
'''
tokens = ["pr"]

[b00t.abstracts.pr_list]
description = "List open pull requests"
gh_cli = "gh pr list --state open --limit {limit}"
curl_rest = '''
LIMIT={limit}
OWNER=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f1)
REPO=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f2)
curl -s -H "Authorization: token $GITHUB_TOKEN" \
  "https://api.github.com/repos/$OWNER/$REPO/pulls?state=open&per_page=$LIMIT"
'''
tokens = ["limit"]

[b00t.abstracts.pr_checkout]
description = "Check out a PR branch locally for review"
gh_cli = "gh pr checkout {pr}"
git_fallback = "git fetch origin pull/{pr}/head:pr-{pr} && git checkout pr-{pr}"
tokens = ["pr"]

[b00t.abstracts.pr_view]
description = "View PR details (title, author, body)"
gh_cli = "gh pr view {pr} --json title,author,body,state,additions,deletions,files"
curl_rest = '''
PR={pr}
OWNER=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f1)
REPO=$(git remote get-url origin | sed -E 's|.*github\\.com[:/]||; s|\\.git$||' | cut -d/ -f2)
curl -s -H "Authorization: token $GITHUB_TOKEN" \
  https://api.github.com/repos/$OWNER/$REPO/pulls/$PR
'''
tokens = ["pr"]

[validate]
command = "gh --version"
regex = "\\d+\\.\\d+\\.\\d+"

[roles]
required_for = ["developer", "executive", "operator", "reviewer"]
optional_for = []

