[b00t]
name = "usage"
type = "cli"
desires = "2.0.0"
install = '''
# usage is installed via cargo-binstall or from source
cargo install usage-cli
'''
update = '''
cargo install usage-cli --force
'''
version = "usage --version"
version_regex = '\\d+\\.\\d+\\.\\d+'
hint = "usage is a portable KDL CLI specification parser and generator. Use `b00t usage` for passthrough, provides completions/docs/man-pages from KDL specs."
unlocks = ["usage *"]

[b00t.maintenance]
check_interval_days = 14
check_command = "curl -sL https://api.github.com/repos/jdx/usage/releases/latest | jq -r '.tag_name // empty' | sed 's/^v//'"
version_source = "github:jdx/usage"
check_regex = "(\\\\d+\\\\.\\\\d+\\\\.\\\\d+)"

[b00t.learn]
topic = "usage"
auto_digest = true

[[b00t.usage]]
description = "Show usage help"
command = "usage --help"

[[b00t.usage]]
description = "Lint a KDL usage spec"
command = "usage lint spec.usage.kdl"

[[b00t.usage]]
description = "Generate completions"
command = "usage generate completion bash <cmd> --file spec.usage.kdl"

[[b00t.usage]]
description = "Generate markdown docs"
command = "usage generate markdown --file spec.usage.kdl"

[validate]
command = "usage --version"
regex = "\\d+\\.\\d+\\.\\d+"

[roles]
optional_for = ["developer", "orchestrator"]