[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b00t-ngc"
version = "0.1.0"
description = "NGC + NVIDIA model API client for the b00t hive"
requires-python = ">=3.10"
dependencies = []  # stdlib-only — intentional; no httpx/requests bloat

[project.scripts]
b00t-ngc = "b00t_ngc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["b00t_ngc"]

[tool.ruff]
line-length = 100
target-version = "py310"
