# b00t datum: sccache — shared compiler cache for Rust/C build acceleration
# type: cli
# Installed via cargo, wraps rustc to cache compiled artifacts across rebuilds.

[b00t]
name = "sccache"
type = "cli"
hint = "Shared compilation cache — wraps rustc/gcc to cache .o artifacts across rebuilds"
desires = "latest"
# @tribal (b00t task #40): install MUST live here under [b00t], not in a
# separate top-level [install] table — BootDatum.install only ever reads a
# nested `[b00t].install` key. A top-level `[install]` table (the old shape
# here) doesn't map to any UnifiedConfig field, so it was silently dropped
# and `b00t install sccache` was a no-op. See b00t-cli/src/config_types.rs.
install = "cargo install sccache --locked"

[version]
cmd = "sccache --version"
regex = "(\\d+\\.\\d+\\.\\d+)"

[validate]
command = "sccache --version"
regex = "sccache"

[[b00t.usage]]
description = "Verify sccache is active for Rust builds"
command = "sccache --show-stats"

[[b00t.usage]]
description = "Enable sccache for cargo (add to ~/.cargo/config.toml)"
command = "mkdir -p ~/.cargo && echo '[build]' >> ~/.cargo/config.toml && echo 'rustc-wrapper = \"sccache\"' >> ~/.cargo/config.toml"

[[b00t.usage]]
description = "Clear sccache cache"
command = "sccache --clear"

[roles]
required_for = ["developer"]
optional_for = ["orchestrator"]
