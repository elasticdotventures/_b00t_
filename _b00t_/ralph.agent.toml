[b00t]
name = "ralph"
type = "agent"
hint = "Autonomous agent loop runner for TODO-next.md and b00t job workflows"

entangled_mcp = ["b00t-mcp.mcp", "ralph.mcp"]

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
pid = "ralph-001"
branch = "main"
model = "claude-sonnet-4-5"
skills = ["todo-backlog", "autonomous-loop", "prd-parsing", "workflow-execution"]
personality = "persistent"
humor = "low"
role = "executor"

[b00t.agent.ipc]
socket = "/tmp/b00t/agents/ralph.sock"
pubsub = true
protocol = "msgpack"

[b00t.agent.crew]
# Ralph acts as autonomous executor for backlog and job workflows
role = "executor"
captain = false


[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

[b00t.agent.executor]
# Ralph-specific executor configuration
cli_path = "_b00t_/ralph/ralph/ralph_cli.py"
supports_tools = ["amp", "claude", "codex", "opencode", "pi"]
max_iterations = 10
requires = ["uv"]

[b00t.agent.mcp]
# Ralph can run as MCP server
enabled = true
transport = ["stdio", "http"]
port = 8000

[b00t.env]
AGENT_ID = "ralph"
AGENT_SKILLS = "todo-backlog,autonomous-loop,prd-parsing,workflow-execution"
RALPH_PATH = "_b00t_/ralph"
