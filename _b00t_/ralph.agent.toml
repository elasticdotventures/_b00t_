[b00t]
name = "ralph"
type = "agent"
hint = "Autonomous agent loop runner for TODO-next.md and b00t job workflows"

[b00t.agent]
pid = "ralph-001"
branch = "main"
model = "claude-sonnet-4-5"
skills = ["todo-backlog", "autonomous-loop", "prd-parsing", "workflow-execution"]
personality = "persistent"
humor = "low"
role = "executor"

[b00t.agent.ipc]
socket = "/tmp/b00t/agents/ralph.sock"
pubsub = true
protocol = "msgpack"

[b00t.agent.crew]
# Ralph acts as autonomous executor for backlog and job workflows
role = "executor"
captain = false

[b00t.agent.executor]
# Ralph-specific executor configuration
cli_path = "_b00t_/ralph/ralph/ralph_cli.py"
supports_tools = ["amp", "claude", "codex", "opencode", "pi"]
max_iterations = 10
requires = ["uv"]

[b00t.agent.mcp]
# Ralph can run as MCP server
enabled = true
transport = ["stdio", "http"]
port = 8000

[b00t.env]
AGENT_ID = "ralph"
AGENT_SKILLS = "todo-backlog,autonomous-loop,prd-parsing,workflow-execution"
RALPH_PATH = "_b00t_/ralph"
