[b00t]
name = "github"
type = "mcp"
hint = "GitHub MCP server with configurable toolsets for issues, PRs, actions, code security"
lfmf_category = "github-mcp"

[b00t.learn]
topic = "github-mcp"
auto_digest = true

# 🤓: Default config without toolsets - only basic tools enabled
# Use env.GITHUB_TOOLSETS to enable specific toolsets
[[b00t.mcp.stdio]]
priority = 0
command = "npx"
requires = ["node"]
transport = "stdio"
args = ["-y", "@modelcontextprotocol/server-github"]

[b00t.mcp.stdio.env]
# 🤓: Enable specific toolsets: repos,issues,pull_requests,actions,code_security,experiments
# Use "all" to enable everything, "default" for baseline (context,repos,issues,pull_requests,users)
# GITHUB_TOOLSETS = "issues,pull_requests,actions"

[[b00t.usage]]
description = "Enable all toolsets"
command = "GITHUB_TOOLSETS=\"all\" npx -y @modelcontextprotocol/server-github"

[[b00t.usage]]
description = "Enable specific toolsets (issues, PRs, actions)"
command = "GITHUB_TOOLSETS=\"issues,pull_requests,actions\" npx -y @modelcontextprotocol/server-github"

[[b00t.usage]]
description = "Extend default toolsets"
command = "GITHUB_TOOLSETS=\"default,code_security,experiments\" npx -y @modelcontextprotocol/server-github"

[[b00t.usage]]
description = "Run with docker (all toolsets)"
command = "docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN=$GITHUB_TOKEN -e GITHUB_TOOLSETS=\"all\" ghcr.io/github/github-mcp-server"

[[b00t.references]]
name = "Official GitHub MCP Server"
url = "https://github.com/github/github-mcp-server"

[[b00t.references]]
name = "MCP GitHub Documentation"
url = "https://modelcontextprotocol.io/llms-full.txt"
