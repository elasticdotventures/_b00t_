[b00t]
name = "ai-finetune"
type = "skill"
hint = "QLoRA fine-tuning pipeline: dataset gen, local k8s (sm0l/ch0nky), HF Jobs cloud (30B+), MLflow, adapter test"

[b00t.skill]
depends_on = ["hf-cli", "HF-JOBS", "HF-DATASET", "HF-HUB-MODELS"]
unlocks = [
    "ai-finetune::dataset",
    "ai-finetune::rustdoc",
    "ai-finetune::train-smol",
    "ai-finetune::train-kube",
    "ai-finetune::train-ch0nky",
    "ai-finetune::cloud-coder",
    "ai-finetune::hf-push",
    "ai-finetune::hf-job-status",
    "ai-finetune::hf-job-logs",
    "ai-finetune::hf-job-cancel",
    "ai-finetune::hf-adapter-pull",
    "ai-finetune::test",
    "ai-finetune::logs",
    "ai-finetune::sparkline",
    "ai-finetune::mlflow-status",
]
description = """
AI fine-tuning skill for b00t.

LOCAL TIER (sm3lly RTX3090, k8s):
  just ai-finetune::dataset          — regenerate train.jsonl from b00t corpus
  just ai-finetune::train-smol       — Qwen2.5-0.5B QLoRA (3h, ~3GB VRAM)
  just ai-finetune::train-kube       — Qwen3.6-27B full job (scale sm0l first)
  just ai-finetune::test             — 5-probe b00t-awareness smoke test

CLOUD TIER (HF Jobs A100 80GB, no timeout risk):
  just ai-finetune::hf-push          — upload dataset+scripts to elasticdotventures/b00t-training
  just ai-finetune::cloud-coder      — submit Qwen3-Coder-30B fine-tune (detached, 10h budget)
  just ai-finetune::hf-job-logs <id> — stream logs
  just ai-finetune::hf-adapter-pull  — pull adapter to sm3lly after completion

OBSERVE:
  just ai-finetune::sparkline        — live loss sparkline from training pod
  just ai-finetune::mlflow-status    — MLflow pod health (http://mlflow.b00t.local:30080)

CONFIG FILES:
  fine-tune/config-smol.yaml         — sm0l: Qwen2.5-0.5B, r=32, 3 epochs
  fine-tune/config-cloud-coder.yaml  — cloud: Qwen3-Coder-30B, BF16, push_to_hub
"""

[b00t.skill.metadata]
justfile_module = "_b00t_/ai-finetune.just"
training_script = "fine-tune/train_unsloth.py"
test_script = "fine-tune/test_adapter.py"
configs = ["fine-tune/config-smol.yaml", "fine-tune/config-cloud-coder.yaml"]
k8s_manifests = ["_b00t_/k8s.🚢/fine-tune/"]
adapter_hub = "elasticdotventures/"
dataset_hub = "elasticdotventures/b00t-training"

