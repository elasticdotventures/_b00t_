# b00t Agent Datum — moltis as first-class hive sub-agent
# 🤓 moltis is a Rust-native binary from vendor/moltis-b00t submodule
#    Repo: promptexecution/moltis-b00t (submodule at vendor/moltis-b00t)
#    Soul/memory backend: b00t soul serve HTTP K/V on :7700
#    Hive: shares :1234 litellm gateway
#    Build: cargo build --manifest-path vendor/moltis-b00t/Cargo.toml --release
#    https://github.com/promptexecution/moltis-b00t

[b00t]
name = "moltis"
type = "agent"
hint = "Rust-native claw — sandboxed, secure, auditable. Voice, memory, MCP tools, multi-channel."

[b00t.agent]
pid = "moltis-001"
branch = "main"
# 🤓 ch0nky tier — shares :1234 litellm gateway with hive
model = "ch0nky"
skills = ["voice", "memory", "mcp-tools", "multi-channel"]
personality = "pragmatic"
humor = "low"
role = "specialist"

[b00t.agent.executor]
# 🤓 binary is built from submodule; not on global PATH until installed
cli_path = "vendor/moltis-b00t/target/release/moltis"
cli_args = []
supports_tools = ["read", "write", "bash", "grep", "mcp"]
max_iterations = 20
requires = ["b00t-soul.service"]
# hive_profile: soul must be running before moltis starts
hive_profile = "moltis-soul"

[b00t.agent.ipc]
# 🤓 moltis exposes OpenAI-compatible HTTP API; no stdio RPC
socket = ""
pubsub = false
protocol = "http+openai"

[b00t.agent.crew]
role = "specialist"
captain = false

[b00t.agent.mcp]
# 🤓 moltis has built-in MCP tool support via its own crates/tools layer
enabled = true

[b00t.agent.memory]
# 🤓 MoltisMemory_🥾 shim: moltis memory calls → b00t soul HTTP K/V on :7700
backend = "b00t-soul"
soul_url = "http://127.0.0.1:7700"
# Key namespace prefix to avoid collision with other hive agents
key_prefix = "moltis/"

# ── Inline service spec — b00t generates this unit dynamically ───────────────
# 🤓 b00t@moltis-agent.service → `moltis` persistent HTTP daemon
#    Requires soul serve to be up first (b00t soul serve on :7700)
[b00t.hive.service]
description = "moltis Rust-native agent — voice, memory, MCP, multi-channel"
service_type = "simple"
restart = "on-failure"
restart_sec = "10s"
timeout_start_sec = "60"
after = ["network.target", "b00t-soul.service"]
environment = [
  "PATH=/home/brianh/.cargo/bin:/usr/local/bin:/usr/bin:/bin",
  "MOLTIS_SOUL_URL=http://127.0.0.1:7700",
  "OPENAI_BASE_URL=http://127.0.0.1:1234/v1",
  "OPENAI_API_KEY=local-litellm",
]
exec_start = "vendor/moltis-b00t/target/release/moltis"

[b00t.hive.resources]
ram_gb = 2
gpu_mb = 0
cpu_cores = 2

[b00t.hive.resources.gate]
ram_free_gb = 2
gpu_free_mb = 0

[b00t.hive.exclusion]
# 🤓 moltis is standalone; no mutual-exclusion group with pi/opencode
#    soul serve must be running independently on :7700
group = "moltis-agent"
priority = 40

[b00t.env]
AGENT_ID = "moltis"
AGENT_SKILLS = "code,voice,memory,mcp-tools,multi-channel,sandbox"
MOLTIS_DIR = "vendor/moltis-b00t"
MOLTIS_SOUL_URL = "http://127.0.0.1:7700"
OPENAI_BASE_URL = "http://127.0.0.1:1234/v1"
OPENAI_API_KEY = "local-litellm"

[[b00t.usage]]
description = "Build moltis binary from vendor submodule"
command = "just moltis-build"

[[b00t.usage]]
description = "Run moltis with b00t soul backend"
command = "just moltis-run"

[[b00t.usage]]
description = "Test soul<->moltis K/V roundtrip"
command = "just moltis-soul-test"

[[b00t.usage]]
description = "Start moltis agent service (b00t hive)"
command = "systemctl --user start b00t@moltis-agent.service"

[[b00t.usage]]
description = "Stop moltis agent service"
command = "systemctl --user stop b00t@moltis-agent.service"

# b00t:map v1
