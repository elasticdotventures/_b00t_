[b00t]
name = "brave-search"
type = "mcp"
hint = "Brave Search API integration"

# <|🦨: aspirational — companion .cli datum never authored; the .mcp datum is the tool surface; roadmap _b00t_#850, triage #163 |>
entangled_cli = ["brave-search.cli"]

[[b00t.mcp.stdio]]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
transport = "stdio"
priority = 0
requires = ["node"]

[[b00t.gate]]
env = "BRAVE_API_KEY"
hint = "BRAVE_API_KEY required in .env (get from dashboard.search.brave.com)"
