[b00t]
name = "brave-search"
type = "mcp"
hint = "Brave Search API integration"

[[b00t.mcp.stdio]]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-brave-search"]
transport = "stdio"
priority = 0
requires = ["node"]

[[b00t.gate]]
env = "BRAVE_API_KEY"
hint = "BRAVE_API_KEY required in .env (get from dashboard.search.brave.com)"
