# Test job for apalis MVP integration
# 🤓 Simple sequential workflow to verify apalis-sqlite backend works

[b00t]
name = "test-apalis"
parent = "b00t.cli"
type = "job"
hint = "Test apalis MVP with SQLite backend and git checkpoints"
version = "0.1.0"

[b00t.job]
description = "Test apalis integration with simple bash commands and checkpoints"
author = "b00t-apalis-mvp"
tags = ["test", "apalis", "mvp"]

[b00t.job.config]
mode = "sequential"
checkpoint_mode = "auto"
checkpoint_after_each_step = true
create_git_tag = true
use_subagents = false
continue_on_failure = false

# Step 1: Initial test step
[[b00t.job.steps]]
name = "start"
description = "Print test start message"
checkpoint = "test-start"

[b00t.job.steps.task]
type = "bash"
command = "echo '🚀 Starting apalis MVP test'"

# Step 2: Verify Cargo works (depends on step 1)
[[b00t.job.steps]]
name = "cargo-check"
description = "Run cargo check to verify build system works"
checkpoint = "cargo-check-passed"
depends_on = ["start"]

[b00t.job.steps.task]
type = "bash"
command = "cargo check --quiet --package b00t-cli"
timeout_ms = 60000

# Step 3: Completion message (depends on step 2)
[[b00t.job.steps]]
name = "complete"
description = "Print test completion message"
checkpoint = "test-complete"
depends_on = ["cargo-check"]

[b00t.job.steps.task]
type = "bash"
command = "echo '✅ Apalis MVP test complete - all steps succeeded'"

[b00t.job.env]
RUST_BACKTRACE = "0"
