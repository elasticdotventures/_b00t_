# b00t Agent Datum — TRIZ contradiction analysis sub-agent for multi-framework code review
# 🤓 TRIZ = Theory of Inventive Problem Solving. This agent identifies contradictions
#    in design choices, maps them to TRIZ inventive principles, surfaces unnecessary
#    trade-offs, and flags false contradictions (things that look contradictory but aren't).
#    Phase 3 of the multi-framework-review pipeline — runs in parallel with MECE and Eureka.

[b00t]
name = "triz-analyzer"
type = "agent"
hint = "TRIZ contradiction analysis agent: trade-off detection, inventive principle mapping, false contradiction flagging for multi-framework PR review"

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
tier = "ch0nky"
capabilities = ["contradiction-detection", "trade-off-analysis", "inventive-principle-mapping", "false-contradiction-flagging"]
tools = ["codebase-memory.mcp", "context7.mcp"]
skills = ["systematic-debugging", "multi-framework-code-review"]
# 🤓 multi-framework-code-review skill routes to TRIZ phase when loaded by this agent

[b00t.agent.inference]
endpoint = "http://127.0.0.1:8001/v1"   # OpenAI-compatible base
health   = "http://127.0.0.1:8001/health"
model    = "qwen36-local/ch0nky"
protocol = "openai"                      # openai | acp | rpc
required = true                          # false ⇒ Claude-backed / stub ⇒ doctor SKIPs

[b00t.agent.crew]
role = "specialist"
captain = false

[b00t.agent.contract]
capabilities = ["contradiction-detection", "trade-off-analysis", "inventive-principle-mapping", "false-contradiction-flagging"]
min_quality_score = 0.8
availability = "on-demand"
gates = ["sanitize", "credential-check"]

[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

entangled_mcp = ["codebase-memory.mcp", "context7.mcp"]
keywords = ["agent", "triz", "contradiction-detection", "trade-off-analysis", "inventive-principle-mapping", "false-contradiction", "review", "specialist", "sub-agent"]
depends_on = ["multi-framework-review.datum", "CREW-ROLES.tomllmd"]

# b00t:map v1
# summary: TRIZ contradiction analysis sub-agent — trade-off detection, inventive principle mapping, false contradiction flagging for multi-framework PR review (triz phase)
# tags: agent, triz, contradiction-detection, trade-off-analysis, inventive-principle-mapping, false-contradiction, review, specialist, sub-agent
# tier: ch0nky
# cmds: just review-triz, b00t agent delegate --role specialist --agent triz-analyzer
# complexity: 3
