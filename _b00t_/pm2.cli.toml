[b00t]
name = "pm2"
type = "cli"
hint = "PM2 + MCP bundle (bun-installed GitHub package)"
desires = "5.3.0"
keywords = ["process-manager", "nodejs", "daemon", "clustering", "monitoring", "mcp"]

# Install via bun globally (includes MCP server)
install = """
command -v bun >/dev/null 2>&1 || { echo "bun required for pm2-mcp install" >&2; exit 1; }
bun install github:promptexecution/pm2-mcp -g
"""

# Update to latest version of the MCP-enabled bundle
update = """
command -v bun >/dev/null 2>&1 || { echo "bun required for pm2-mcp update" >&2; exit 1; }
bun install github:promptexecution/pm2-mcp -g --force
"""

# Version detection
version = "pm2 --version"
version_regex = "^(\\d+\\.\\d+\\.\\d+)"
depends_on = ["node.cli"]

aliases = ["pm2-list", "pm2-logs", "pm2-mon", "pm2-stop-all", "pm2-delete-all", "pm2-restart-all", "pm2-save", "pm2-resurrect"]

[b00t.env]
# PM2 home directory
PM2_HOME = "~/.pm2"
# Enable PM2 monitoring
PM2_MONITORING = "true"
# Max memory restart threshold
PM2_MAX_MEMORY_RESTART = "500M"
