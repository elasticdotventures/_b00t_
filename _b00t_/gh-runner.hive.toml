[b00t]
name = "gh-runner"
type = "hive"
hint = "Self-hosted GitHub Actions runner — repo, labels, workdir, user supplied at install time. Zero host/repo data in source."

# ── Template: placeholders filled at install time ──────────────────
# Installed as: b00t@gh-runner-{repo_slug}.service
# Concrete profiles: ~/.config/b00t/profiles/gh-runner-{slug}.toml

[b00t.hive]
template = true
description = "Self-hosted GitHub Actions runner managed by b00t hive"

[b00t.hive.resources]
ram_gb = 2
cpu_cores = 2
gpu_mb = 0

[b00t.hive.resources.gate]
ram_free_gb = 2
gpu_free_mb = 0

[b00t.hive.exclusion]
group = "gh-runner"
priority = 10

# ── Inline service spec — generate_systemd_unit() fills placeholders ──
[b00t.hive.service]
description = "b00t gh-runner: {{repo_slug}} — {{labels}}"
service_type = "simple"
restart = "on-failure"
restart_sec = "30s"
timeout_start_sec = "120"
after = ["network.target", "network-online.target"]
working_directory = "{{workdir}}"

exec_start_pre = [
  "{{workdir}}/bin/installdependencies.sh || true",
  "{{workdir}}/config.sh --url https://github.com/{{repo}} --token $(cat {{token_file}}) --name {{runner_name}} --labels {{labels}} --unattended {{ephemeral_flag}} --replace",
]
exec_start = "{{workdir}}/run.sh"
exec_stop_post = "{{workdir}}/config.sh remove --token $(gh api -X POST repos/{{repo}}/actions/runners/removal-token --jq .token) || true"

environment = [
  "HOME={{home_dir}}",
  "PATH={{runner_bin_dir}}:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin",
  "RUNNER_ALLOW_RUNASROOT=0",
]

limit_nofile = 65536

[b00t.env]
# Runtime config — filled at install time, never committed to git
# GH_RUNNER_REPO = ""
# GH_RUNNER_LABELS = ""
# GH_RUNNER_WORKDIR = ""
# GH_RUNNER_USER = ""
# GH_RUNNER_VERSION = ""
# GH_RUNNER_EPHEMERAL = ""

