# b00t AI Model Datum — Qwen3.6 local inference variants (ch0nky tier)
# Two serving options on RTX 3090 24GB VRAM; both available as GGUF via llamacpp podman
# Active variant determined by which hive profile is running on :8001
# RTX 3090 community benchmark (HF discussion #37): 35B-A3B Q3_K_M → 120 tok/s, 23GB VRAM

[b00t]
name    = "qwen36-local"
type    = "model"
hint    = "Qwen3.6 local ch0nky: 27B-Q4_K_M (16GB, dense) OR 35B-A3B-MXFP4_MOE (22GB, MoE+thinking)"
aliases = ["qwen36", "qwen3.6", "ch0nky-q36", "qwen36-local"]

[b00t.env]
OPENAI_BASE_URL      = "http://127.0.0.1:8001/v1"
OPENAI_API_KEY       = "local-b00t"
B00T_AI_CH0NKY_BASE  = "http://127.0.0.1:8001/v1"
B00T_AI_CH0NKY_MODEL = "ch0nky"

# ─── Shared model endpoint (both variants serve as "ch0nky" on :8001) ────────
[ai_model]
provider       = "openai_compatible"
size           = "large"
capabilities   = ["chat", "code", "reasoning", "tool_use", "thinking"]
litellm_model  = "openai/ch0nky"
api_base       = "http://127.0.0.1:8001/v1"
api_key_env    = "OPENAI_API_KEY"
rpm_limit      = 60
context_window = 262144
enabled        = true
access_groups  = ["default", "local", "ch0nky"]

[ai_model.parameters]
max_tokens  = 8192
temperature = 0.6
top_p       = 0.95
top_k       = 20
min_p       = 0.0
# 🤓 Qwen3 sampling: temp 0.6 / top_p 0.95 / top_k 20 = Qwen team recommendation for reasoning

# ─── Variant A: Qwen3.6-27B Q4_K_M (dense, lower VRAM, no thinking mode) ───
[[ai_model.variants]]
id             = "q27b-q4km"
name           = "Qwen3.6-27B-Q4_K_M"
hf_repo        = "unsloth/Qwen3.6-27B-GGUF"
gguf_file      = "Qwen3.6-27B-Q4_K_M.gguf"
gguf_path      = "~/.cache/huggingface/hub/models--unsloth--Qwen3.6-27B-GGUF/snapshots/82d411acf4a06cfb8d9b073a5211bf410bfc29bf/Qwen3.6-27B-Q4_K_M.gguf"
vram_mb        = 16000
context_window = 262144
thinking       = false
runtime        = "llamacpp-podman"
hive_profile   = "inference-qwen36-27b-llamacpp"
quant          = "Q4_K_M"
params_total   = "27B"
params_active  = "27B"
tok_per_sec_est = 33   # observed: RTX 3090, Q4_K_M dense, 33.1 avg tok/s across 5 eval prompts
# 🤓 vLLM support attempted (inference-qwen36-27b) but fails: GGUF path treated as repo ID
# 🤓 llamacpp is the reference GGUF implementation — always use for GGUF serving

# ─── Variant B: Qwen3.6-35B-A3B MXFP4_MOE (MoE, ~22GB VRAM, thinking mode) ─
[[ai_model.variants]]
id             = "q35b-a3b-mxfp4"
name           = "Qwen3.6-35B-A3B-MXFP4_MOE"
hf_repo        = "unsloth/Qwen3.6-35B-A3B-GGUF"
gguf_file      = "Qwen3.6-35B-A3B-MXFP4_MOE.gguf"
gguf_path      = "~/.cache/huggingface/hub/models--unsloth--Qwen3.6-35B-A3B-GGUF/snapshots/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-MXFP4_MOE.gguf"
vram_mb        = 22135   # observed: 22.1GB on RTX 3090, 1.9GB headroom
context_window = 262144   # full training context; KV spills to CPU RAM beyond VRAM headroom (~2.4GB)
thinking       = true    # --reasoning-format deepseek enables <think> tokens
runtime        = "llamacpp-podman"
hive_profile   = "inference-qwen36-35b-a3b-llamacpp"
quant          = "MXFP4_MOE"
params_total   = "35B"
params_active  = "~3B"   # MoE: only active expert layers run per token
tok_per_sec_est = 97     # observed: MXFP4_MOE 96.9 avg tok/s (eval-20260427T235434); community: UD-Q3_K_M 120 tok/s
# 🤓 MXFP4_MOE: Unsloth mixed-precision FP4 MoE — requires server-cuda image (confirmed working)
# 🤓 Preferred variant: more capable, thinking mode, better community benchmarks
# ⚠️  If UD-Q3_K_M downloaded later, update gguf_path and expect same ~120 tok/s at lower VRAM

# ─── Usage recipes ───────────────────────────────────────────────────────────
[[b00t.usage]]
description = "Serve variant A (27B dense, ~16GB VRAM)"
command     = "just qwen36-serve-llamacpp"

[[b00t.usage]]
description = "Serve variant B (35B-A3B MoE, ~22GB VRAM, thinking mode) [PREFERRED]"
command     = "just qwen36-serve-35b"

[[b00t.usage]]
description = "Stop all qwen36 services"
command     = "just qwen36-stop"

[[b00t.usage]]
description = "Check active variant on :8001"
command     = "curl -s http://localhost:8001/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "Run eval comparison (sequential: 27B → 35B-A3B)"
command     = "just ch0nky-eval-compare"

[[b00t.usage]]
description = "Download UD-Q3_K_M variant (community-validated, ~15GB, may outperform MXFP4)"
command     = "hf download unsloth/Qwen3.6-35B-A3B-GGUF --include 'Qwen3.6-35B-A3B-UD-Q3_K_M.gguf'"

