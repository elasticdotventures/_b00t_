[b00t]
name = "kiro-plugin"
type = "mcp"
hint = "Launches the Kiro CLI plugin via MCP stream with b00t-aware agents."
lfmf_category = "kiro"

[[b00t.mcp.stdio]]
command = "scripts/run-kiro-mcp.sh"
args = []
transport = "stdio"
priority = 0
requires = ["kiro-cli"]

# Extended metadata for kiro-specific capabilities
[b00t.meta.capabilities]
agents = true
agent_dir = "~/.kiro/agents"
mcp_config = "~/.kiro/mcp/mcp.json"
subcommands = ["chat", "agent", "doctor", "settings"]
sync_format = "json"

[b00t.meta.agent]
list_cmd = "kiro-cli agent list"
create_cmd = "kiro-cli agent create"
run_cmd = "kiro-cli chat --agent"
config_format = "json"
config_extension = ".json"

[b00t.meta.mcp_syntax]
format = "json"
server_key = "mcpServers"
command_key = "command"
args_key = "args"

[b00t.meta.sync]
push_cmd = "scripts/b00t-mcp-sync.sh push kiro"
pull_cmd = "scripts/b00t-mcp-sync.sh pull kiro"
agent_mcp_path = "mcpServers"
global_mcp_path = "~/.kiro/mcp/mcp.json"

[b00t.meta.namespace]
enabled = true
extract_from = "toolsSettings.namespace"
syntax = "jinja"
skill_isolation = true
template = "_b00t_/templates/agent.kiro.json.j2"

