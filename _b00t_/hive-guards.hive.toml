[b00t]
name = "hive-guards"
type = "hive_profile"
hint = "Universal command guards — always active regardless of hive profile; enforces b00t engineering standards"

# 🤓 This is the universal guard registry loaded by `b00t run` before profile-specific guards.
# Profile guards supplement; these are always checked first.
# action: warn (proceed with message), block (refuse), redirect (replace command)

[b00t.hive.exclusion]
group = "guards"  # not a workload profile; always active

# 🤓 rhai_macros — named guard expressions defined in datum header.
# Each macro becomes `let <name> = <expr>;` in Rhai scope before guard evaluation.
# Guards reference macros by bare name: pattern = { rhai = "pip_guard" }
# Compose with || &&:          pattern = { rhai = "pip_guard || docker_guard" }
# Pipe-compatible functions (fn form) enable `|>` operator for functional chaining:
#   cmd |> is_docker() |> is_run()
# Function forms are defined as `fn name(cmd) = expr` and registered via Rhai engine.
[b00t.hive.rhai_macros]
# Expression-form macros (legacy, `let <name> = <expr>`)
pip_guard = "cmd.contains(\"pip\") && cmd.contains(\"install\")"
pip3_guard = "cmd.contains(\"pip3\") && cmd.contains(\"install\")"
pip_mod_guard = "cmd.contains(\"python -m pip\") || cmd.contains(\"python3 -m pip\")"
conda_guard = "cmd.contains(\"conda\") && cmd.contains(\"install\")"
docker_guard = "cmd.contains(\"docker\")"
docker_run_guard = "docker_guard && cmd.contains(\"run\")"
docker_build_guard = "docker_guard && cmd.contains(\"build\")"
docker_compose_guard = "cmd.contains(\"docker-compose\") || cmd.contains(\"docker compose\")"
force_push_guard = "cmd.contains(\"git\") && cmd.contains(\"push\") && cmd.contains(\"--force\")"
hard_reset_guard = "cmd.contains(\"git\") && cmd.contains(\"reset\") && cmd.contains(\"--hard\")"
npm_global_guard = "cmd.contains(\"npm\") && cmd.contains(\"install\") && cmd.contains(\"-g\")"
brew_guard = "cmd.contains(\"brew\") && cmd.contains(\"install\")"
hf_download_guard = "cmd.contains(\"huggingface-cli\") && cmd.contains(\"download\")"
ulimit_guard = "cmd.contains(\"ulimit\") && cmd.contains(\"-n\")"
rm_rf_guard = "cmd.contains(\"rm\") && cmd.contains(\"-rf\") && (cmd.contains(\" /etc\") || cmd.contains(\" /var\") || cmd.contains(\" /bin\") || cmd.contains(\" /boot\") || cmd.contains(\" /dev\") || cmd.contains(\" /lib\") || cmd.contains(\" /proc\") || cmd.contains(\" /sys\") || cmd.contains(\" /usr\") || cmd.contains(\" / \"))"

# Pipe-compatible function-form macros (registered as Rhai functions)
# These enable `|>` pipe operator: cmd | is_docker() | is_run()
# @tribal: function-form macros are registered via Rhai engine.register_fn() in hook_engine.rs.
# Expression-form macros compose via `||` / `&&` — function-form macros compose via `|>`.
# Both forms coexist; guards can reference either.

# --- Idiomatic Guard Macros (8 concepts from Plan) ---

# GUARD 4: rename-all-references — catches git mv without prior reference grep
rename_refs_guard = "cmd.contains(\"git mv\") || cmd.contains(\"git rename\")"

# GUARD 1: agent-format-errors — catches bail!/anyhow! with >120 char messages
# Also catches cargo doc / write ops that introduce long error strings
long_err_guard = "cmd.contains(\"bail!\") || cmd.contains(\"anyhow!\") || cmd.contains(\"eprintln!\") || (cmd.contains(\"error\") && cmd.len() > 120)"

# GUARD 2: help-from-impl — catches clap about=/long_about= that may drift
help_drift_guard = "cmd.contains(\"clap\") && (cmd.contains(\"about\") || cmd.contains(\"long_about\"))"

# GUARD 3: boolean-over-enum — catches --type/--severity/--mode flags
enum_flag_guard = "cmd.contains(\"--type\") || cmd.contains(\"--severity\") || cmd.contains(\"--mode\") || cmd.contains(\"--kind\")"

# GUARD 5: asymmetric-naming — catches singular subcommand without plural
asymmetric_naming_guard = "cmd.contains(\"enum\") && (cmd.contains(\"Command\") || cmd.contains(\"Subcommand\"))"

# GUARD 6: why-over-what — catches comment patterns that describe WHAT not WHY
# Triggers on // or /// lines with trivially descriptive language
why_comment_guard = "cmd.contains(\"//\") && regex_match(cmd, \"(increment|decrement|set |get |add |remove |calls |creates )\")"

# --- Python/pip guards ---
[[b00t.hive.guards]]
pattern = "pip install"
action = "warn"
message = "🦨 use uv pip install (faster, reproducible, respects .python-version)"
redirect = "uv pip install"
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = "pip3 install"
action = "warn"
message = "🦨 use uv pip install"
redirect = "uv pip install"
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = "python -m pip"
action = "warn"
message = "🦨 use uv pip"
redirect = "uv pip"
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = "conda install"
action = "warn"
message = "🦨 use uv (conda env not used in b00t hive; use uv venv + uv pip)"

# --- Container guards ---
[[b00t.hive.guards]]
pattern = "docker run"
action = "warn"
message = "🦨 use podman run (CDI GPU passthrough: --device nvidia.com/gpu=all --security-opt=label=disable)"

[[b00t.hive.guards]]
pattern = "docker build"
action = "warn"
message = "🦨 use podman build"
redirect = "podman build"

[[b00t.hive.guards]]
pattern = "docker-compose"
action = "warn"
message = "🦨 use podman-compose or podman play kube"

# --- Destructive operations ---
# Per-path explicit guards (for simple string matching + per-path messages)
[[b00t.hive.guards]]
pattern = "rm -rf / "
action = "block"
message = "🚫 blocked: destructive root deletion (rm -rf / with trailing space)"

[[b00t.hive.guards]]
pattern = "rm -rf /etc"
action = "block"
message = "🚫 blocked: destructive system path (/etc)"

[[b00t.hive.guards]]
pattern = "rm -rf /var"
action = "block"
message = "🚫 blocked: destructive system path (/var)"

[[b00t.hive.guards]]
pattern = "rm -rf /bin"
action = "block"
message = "🚫 blocked: destructive system path (/bin)"

[[b00t.hive.guards]]
pattern = "rm -rf /boot"
action = "block"
message = "🚫 blocked: destructive system path (/boot)"

[[b00t.hive.guards]]
pattern = "rm -rf /dev"
action = "block"
message = "🚫 blocked: destructive system path (/dev)"

[[b00t.hive.guards]]
pattern = "rm -rf /lib"
action = "block"
message = "🚫 blocked: destructive system path (/lib)"

[[b00t.hive.guards]]
pattern = "rm -rf /proc"
action = "block"
message = "🚫 blocked: destructive system path (/proc)"

[[b00t.hive.guards]]
pattern = "rm -rf /sys"
action = "block"
message = "🚫 blocked: destructive system path (/sys)"

[[b00t.hive.guards]]
pattern = "rm -rf /usr"
action = "block"
message = "🚫 blocked: destructive system path (/usr)"

# Comprehensive rm_rf guard using Rhai macro — catches ALL dangerous paths
# including /home, /root, /opt, /sbin, /srv, /mnt, /media, /run, /lost+found
# plus system paths listed above. This is the catch-all; individual per-path
# guards above provide more specific error messages for common targets.
# The rm_rf_guard macro is defined in [b00t.hive.rhai_macros] section.
[[b00t.hive.guards]]
pattern = { rhai = "rm_rf_guard" }
action = "block"
message = "🚫 blocked: destructive recursive deletion of critical system path"

[[b00t.hive.guards]]
pattern = "git push --force"
action = "warn"
message = "⚠️ force push detected — confirm branch is not main/master"

[[b00t.hive.guards]]
pattern = "git reset --hard"
action = "warn"
message = "⚠️ hard reset will discard uncommitted changes; checkpoint first with: git stash"

# --- Rust shop guards ---
[[b00t.hive.guards]]
pattern = "npm install -g"
action = "warn"
message = "🦨 prefer pnpm add -g for global JS tools (b00t hive uses pnpm)"

[[b00t.hive.guards]]
pattern = "brew install"
action = "warn"
message = "🦨 b00t hive is linux; use apt, cargo install, or uv tool install"

# --- HF/model download guards ---
[[b00t.hive.guards]]
pattern = "huggingface-cli download"
action = "warn"
message = "🦨 huggingface-cli is deprecated; use: hf download"
redirect = "hf download"

# --- Parse-time stage guards ---
[[b00t.hive.guards]]
pattern = { stage = "pre_parse" }
action = "block"
message = "🚫 blocked at parse time"

[[b00t.hive.guards]]
pattern = "ulimit -n"
action = "warn"
message = "⚠️ ulimit only affects current shell; systemd services use LimitNOFILE=65536 in unit file; for persistent system fix: sudo bash -c 'echo \"* soft nofile 65536\" >> /etc/security/limits.conf'"


# --- SCM branch/commit conventions ---
# Enforced via `b00t hive run` before any command reaches git.
# Prevents accidental main-branch work and non-conventional commits.
# Ref: _b00t_/schema/SCM-CONVENTIONS.tomllmd
# Uses simple cmd.contains() — regex_match(cmd, pattern) also available
# for more precise matching if needed (registered on Rhai engine).

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git checkout\") && (cmd.contains(\" main\") || cmd.contains(\" master\"))" }
action = "block"
message = "🚫 blocked: switching to main/master — work on a feature branch (feat/, fix/, chore/)"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git push\") && cmd.contains(\"origin main\")" }
action = "block"
message = "🚫 blocked: pushing to main — create a PR instead"
redirect = "gh pr create"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git merge\") && cmd.contains(\"main\")" }
action = "block"
message = "🚫 blocked: merging main — use gh pr merge or rebase flow"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git checkout -b\") && !cmd.contains(\"/\")" }
action = "warn"
message = "🦨 branch name should use type/description format (e.g. feat/add-widget, fix/login-crash)"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git commit\") && cmd.contains(\"-m\") && !cmd.contains(\":\")" }
action = "warn"
message = "🦨 commit message should follow Conventional Commits: type(scope): description (e.g. feat: add widget)"

[[b00t.usage]]
description = "Check a command against universal guards"
command = "b00t run <your-command>"

[[b00t.usage]]
description = "List all active guards"
command = "b00t hive status --guards"

# ================================================================
# CATEGORY A: API Key / Secret Exposure (guards 1-4)
# ================================================================
[[b00t.hive.guards]]
pattern = "--token "
action = "warn"
message = "🦨 API token in command — use env var or .env instead"

[[b00t.hive.guards]]
pattern = "--api-key "
action = "warn"
message = "🦨 API key in command — use env var instead"

[[b00t.hive.guards]]
pattern = "--password "
action = "warn"
message = "🦨 Password in command — use stdin or env var"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"export\") && (cmd.contains(\"SECRET\") || cmd.contains(\"TOKEN\") || cmd.contains(\"API_KEY\"))" }
action = "block"
message = "🚫 Blocked: exporting secrets to env — use .env file instead"

# ================================================================
# CATEGORY B: Code Review / Safety (guards 5-8)
# ================================================================
[[b00t.hive.guards]]
pattern = "chmod 777"
action = "block"
message = "🚫 Blocked: chmod 777 is a security risk — use more restrictive permissions"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"curl\") && (cmd.contains(\"| bash\") || cmd.contains(\"| sh\"))" }
action = "warn"
message = "🦨 Piping curl to shell is dangerous — verify the source first"

[[b00t.hive.guards]]
pattern = "sudo rm -rf"
action = "block"
message = "🚫 Blocked: sudo rm -rf — use precise paths, never force delete with sudo"

[[b00t.hive.guards]]
pattern = "> /dev/null 2>&1"
action = "warn"
message = "🦨 Suppressing errors — you may miss important failures"

# ================================================================
# CATEGORY C: Agent Context / State (guards 9-12)
# ================================================================
[[b00t.hive.guards]]
pattern = "kill -9"
action = "warn"
message = "🦨 kill -9 prevents clean shutdown — try kill -15 first"

[[b00t.hive.guards]]
pattern = "pkill -f"
action = "warn"
message = "🦨 pkill -f is broad — use specific process names"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"rm -rf .git\") && !cmd.contains(\".gitignore\") && !cmd.contains(\".gitmodules\") && !cmd.contains(\".gitconfig\") && !cmd.contains(\".gitkeep\") && !cmd.contains(\".gitattributes\")" }
action = "block"
message = "🚫 Blocked: deleting .git destroys version history — use git clean instead"

[[b00t.hive.guards]]
pattern = "git clean -fd"
action = "warn"
message = "🦨 git clean -fd removes untracked files — irreversible"

# ================================================================
# CATEGORY D: Configuration / Secrets (guards 13-16)
# ================================================================
[[b00t.hive.guards]]
pattern = "git config --global user.email"
action = "warn"
message = "🦨 Setting global git email — use --local for project-specific"

[[b00t.hive.guards]]
pattern = "npm config set registry"
action = "warn"
message = "🦨 Changing npm registry globally — use --scope or .npmrc instead"

[[b00t.hive.guards]]
pattern = "pip config set global.index-url"
action = "warn"
message = "🦨 Changing pip index globally — use --index-url per command instead"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"echo\") && cmd.contains(\"> /etc/\")" }
action = "block"
message = "🚫 Blocked: writing to /etc/ requires sudo — use proper config management"

# ================================================================
# CATEGORY E: Resource Abuse (guards 17-20)
# ================================================================
[[b00t.hive.guards]]
pattern = ":(){ :|:& };:"
action = "block"
message = "🚫 Blocked: fork bomb detected"

[[b00t.hive.guards]]
pattern = "dd if=/dev/urandom"
action = "warn"
message = "🦨 dd with /dev/urandom can exhaust entropy — use fallocate or truncate"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"cargo test\") && !cmd.contains(\"--no-run\") && !cmd.contains(\"::\")" }
action = "warn"
message = "🦨 Bare cargo test recompiles deps (5+ min with DuckDB). Use `cargo test --no-run && ./target/debug/deps/... <filter>::` for fast iteration"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"npx\") && !cmd.contains(\"--yes\") && !cmd.contains(\"-y\")" }
action = "warn"
message = "🦨 npx without --yes will prompt interactively. Add --yes or -y for non-interactive execution"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"apt install\") && !cmd.contains(\"-y\") && !cmd.contains(\"--assume-yes\")" }
action = "warn"
message = "🦨 apt install without -y will prompt. Add -y for non-interactive: sudo apt install -y <pkg>"

[[b00t.hive.guards]]
pattern = "cargo clean"
action = "warn"
message = "🦨 cargo clean destroys build cache (5+ min rebuild with DuckDB). Use `cargo check` first, or clean specific package: `cargo clean -p <crate>`"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"sed -i\") && !cmd.contains(\".bak\") && !cmd.contains(\"--follow-symlinks\")" }
action = "warn"
message = "🦨 sed -i without backup (.bak) can destroy files. Add `-i.bak` to keep backup: sed -i.bak 's/foo/bar/' file"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git push\") && !cmd.contains(\"origin\")" }
action = "warn"
message = "🦨 git push without remote specified — will use push.default. Explicit: git push origin <branch>"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"chown\") && cmd.contains(\"-R\")" }
action = "block"
message = "🚫 Blocked: recursive chown -R is destructive. Use `find . -user old -exec chown new {} +` instead"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"curl\") && cmd.contains(\"-o\") && cmd.contains(\" /usr/\")" }
action = "block"
message = "🚫 Blocked: curl to /usr/ requires sudo and can overwrite system files. Download to ~/ instead"

[[b00t.hive.guards]]
pattern = "cargo build --release"
action = "warn"
message = "🦨 Release builds take a long time — use --debug for development iterations"

# ================================================================
# IDIOMATIC GUARDS: 8 Concepts from Plan
# ================================================================
#
# 6 guardable patterns (enforced via command guard + Rhai macro):
#   1. agent-format-errors        → error strings >120 chars
#   2. help-from-impl             → clap help vs impl drift
#   3. boolean-over-enum          → --type/--severity non-enum
#   4. rename-all-references      → pre-grep before git mv
#   5. asymmetric-naming          → singular subcommand no plural
#   6. why-over-what              → comment heuristics
#
# 2 agent-discipline (documented, not guardable by code):
#   7. precise-response           → see references/agent-disciplines.md
#   8. prefer-parameter-rich-tools → see references/kaizen-patterns.md
#
# ================================================================
# GUARD 4: rename-all-references
# Pattern: git mv detected without prior grep for references
# Reminds agent to grep for all references BEFORE renaming
# ================================================================
[[b00t.hive.guards]]
pattern = { rhai = "rename_refs_guard" }
action = "warn"
message = "🦨 git mv detected — did you grep for all references first? Run: grep -rn 'old_name' --include='*.rs' --include='*.toml' --include='*.md'"
redirect = "git mv"
repeat_threshold = 1

# ================================================================
# GUARD 1: agent-format-errors
# Pattern: detect overlength error strings in Rust source
# Triggers when agent tries to create/commit overly verbose error messages
# ================================================================
[[b00t.hive.guards]]
pattern = { rhai = "long_err_guard" }
action = "warn"
message = "🦨 Error strings should be <120 chars. Long errors waste context and hide root cause. Use structured error types with context fields instead."
repeat_threshold = 2

# ================================================================
# GUARD 2: help-from-impl
# Pattern: detect when clap help text references args that don't exist
# Checks for help text / impl drift in new or modified clap commands
# ================================================================
[[b00t.hive.guards]]
pattern = { rhai = "help_drift_guard" }
action = "warn"
message = "🦨 Help text may drift from impl. If adding/moving args, update both #[clap(about)] and actual handler/match arms. Run: grep -n 'about\\|long_about' to audit."

# ================================================================
# GUARD 3: boolean-over-enum
# Pattern: detects --type/--severity/--mode flags with ad-hoc values
# that should be proper Enum arguments with possible_values
# ================================================================
[[b00t.hive.guards]]
pattern = { rhai = "enum_flag_guard" }
action = "warn"
message = "🦨 Boolean flags with '--type'/'--severity'/'--mode' suggests non-standard arg handling. Prefer clap's ValueEnum for type-safe, documented options."

# ================================================================
# GUARD 5: asymmetric-naming
# Pattern: detects singular noun subcommand enum variants that
# lack a corresponding plural variant (e.g. 'Task' but no 'Tasks')
# ================================================================
[[b00t.hive.guards]]
pattern = { rhai = "asymmetric_naming_guard" }
action = "warn"
message = "🦨 Subcommand variant name looks singular but no plural alias found. Keep naming consistent: append 'Command' suffix or add plural alias: #[clap(alias = \"tasks\")]"

# ================================================================
# GUARD 6: why-over-what
# Pattern: comment heuristics — detects comments that describe
# WHAT instead of WHY (e.g. "increment counter" instead of "track retry budget")
# ================================================================
[[b00t.hive.guards]]
pattern = { rhai = "why_comment_guard" }
action = "warn"
message = "🦨 Comment likely describes WHAT not WHY. Good comments explain intent and invariants. Bad comments restate the code. Consider: is this comment earning its keep?"

# ── Federated Idiomatics ──────────────────────────────────────────
# Each idiomatic is a pattern that saves agent context. Declared here
# so `b00t idiomap` can build the federated map.

[[b00t.idiomatic]]
name = "guard-as-doc"
pattern = "guard message IS the documentation"
guard_ids = ["hive-guards.hive.toml:guard-doc-fail"]
principle = "self-contained learning moment, no separate doc search"
context_saved = "160 chars max per guard message"
topic = "guard-design"
priority = "S"

[[b00t.idiomatic]]
name = "escalation-🦨→💩"
pattern = "escalate from warn (🦨) to block (💩) after repeat_threshold hits"
guard_ids = [
    "hive-guards.hive.toml:escalation-🦨→💩",
]
principle = "first encounter warns, repeated violations escalate — agent must not persist in blocked patterns"
context_saved = "eliminates redisambiguation; agent knows after first warn that retry is futile after threshold"
topic = "guard-design"
priority = "A"

[[b00t.idiomatic]]
name = "no-llm-in-guards"
pattern = "guard conditions must not use LLM inference — pure string/rhai only"
guard_ids = ["hive-guards.hive.toml:no-llm-in-guards"]
principle = "LLM inference in guards introduces latency, cost, and non-determinism; guards must be fast, predictable, and free"
context_saved = "~2s latency per inference-based guard check × number of guards per command"
topic = "guard-design"
priority = "S"
