[b00t]
name = "hive-guards"
type = "hive_profile"
hint = "Universal command guards — always active regardless of hive profile; enforces b00t engineering standards"

# 🤓 This is the universal guard registry loaded by `b00t run` before profile-specific guards.
# Profile guards supplement; these are always checked first.
# 🔗 Runtime resilience: b00t-hive-hive-watchdog.service (profile 'hive-watchdog') is
#    the always-on companion — it stops crash-looping units the guards can't see.
# action: warn (proceed with message), block (refuse), redirect (replace command)

[b00t.hive.exclusion]
group = "guards"  # not a workload profile; always active

# 🤓 rhai_macros — named guard expressions defined in datum header.
# Each macro becomes `let <name> = <expr>;` in Rhai scope before guard evaluation.
# Guards reference macros by bare name: pattern = { rhai = "pip_guard" }
# Compose with || &&:          pattern = { rhai = "pip_guard || docker_guard" }
[b00t.hive.rhai_macros]
pip_guard = "cmd.contains(\"pip\") && cmd.contains(\"install\")"
pip3_guard = "cmd.contains(\"pip3\") && cmd.contains(\"install\")"
pip_mod_guard = "cmd.contains(\"python -m pip\") || cmd.contains(\"python3 -m pip\")"
conda_guard = "cmd.contains(\"conda\") && cmd.contains(\"install\")"
docker_guard = "cmd.contains(\"docker\")"
docker_run_guard = "docker_guard && cmd.contains(\"run\")"
docker_build_guard = "docker_guard && cmd.contains(\"build\")"
docker_compose_guard = "cmd.contains(\"docker-compose\") || cmd.contains(\"docker compose\")"
force_push_guard = "cmd.contains(\"git\") && cmd.contains(\"push\") && cmd.contains(\"--force\")"
hard_reset_guard = "cmd.contains(\"git\") && cmd.contains(\"reset\") && cmd.contains(\"--hard\")"
npm_global_guard = "cmd.contains(\"npm\") && cmd.contains(\"install\") && cmd.contains(\"-g\")"
brew_guard = "cmd.contains(\"brew\") && cmd.contains(\"install\")"
hf_download_guard = "cmd.contains(\"huggingface-cli\") && cmd.contains(\"download\")"
ulimit_guard = "cmd.contains(\"ulimit\") && cmd.contains(\"-n\")"
rm_rf_guard = "cmd.contains(\"rm\") && cmd.contains(\"-rf\") && cmd.contains(\"/ \")"
ledgerr_mcp_guard = "cmd.contains(\"ledgerr-mcp\")"
ledgerr_port_guard = "cmd.contains(\"rotel-visual\")"
ledgerr_just_guard = "cmd.contains(\"just\") && cmd.contains(\"ledgrrr::\")"
# 🤓 shared-node resource protocol (2026-07-18): uncapped container workloads
#    crashed sm3lly twice on 2026-07-17 — cgroup caps are mandatory.
podman_run_uncapped = "cmd.contains(\"podman run\") && !cmd.contains(\"--memory\")"
podman_build_uncapped = "cmd.contains(\"podman build\") && !cmd.contains(\"--memory\")"

# --- Shared-node resource protocol guards ---
[[b00t.hive.guards]]
pattern = { rhai = "podman_build_uncapped" }
action = "block"
message = "🚫 uncapped podman build OOMed the node (2026-07-17, 20.7G buildah RSS). MUST add --memory=16g --memory-swap=16g and stop inference sidecars first. Resubmit identical command within 300s to force."
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = { rhai = "podman_run_uncapped" }
action = "warn"
message = "🦨 shared node: podman run MUST carry --memory + --memory-swap caps (see AGENTS/--role=podman.md); GPU jobs go through b00t hive plan=<profile> first"
repeat_threshold = 1

# --- Python/pip guards ---
[[b00t.hive.guards]]
pattern = "pip install"
action = "warn"
message = "🦨 use uv pip install (faster, reproducible, respects .python-version)"
redirect = "uv pip install"
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = "pip3 install"
action = "warn"
message = "🦨 use uv pip install"
redirect = "uv pip install"
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = "python -m pip"
action = "warn"
message = "🦨 use uv pip"
redirect = "uv pip"
repeat_threshold = 1

[[b00t.hive.guards]]
pattern = "conda install"
action = "warn"
message = "🦨 use uv (conda env not used in b00t hive; use uv venv + uv pip)"

# --- Container guards ---
[[b00t.hive.guards]]
pattern = "systemctl"
action = "warn"
message = """⚠️  systemctl is deprecated for service management. b00t alternatives:
  systemctl start X    → podman kube play _b00t_/k8s/<name>.pod.yml
  systemctl stop X     → podman kube down _b00t_/k8s/<name>.pod.yml
  systemctl status X   → podman pod ps --filter name=<name>
  systemctl enable X   → podman generate systemd --new <name>
  systemctl daemon-reload → b00t-cli datum validate ._b00t_/"""
redirect = "use podman kube play or b00t hive activate"

[[b00t.hive.guards]]
pattern = "systemctl --user start b00t@"
action = "warn"
message = """⚠️  b00t service management: use b00t hive activate, not systemctl.
  systemctl --user start b00t@inference-*  → b00t hive activate <profile>
  systemctl --user start b00t@opencode-*   → opencode serve --port 3000 --model qwen36-local/sm0l
  systemctl --user start b00t@pi-*         → b00t-cli agent invoke pi '<task>'"""
redirect = "use b00t hive activate or b00t-cli agent invoke"

[[b00t.hive.guards]]
pattern = "docker run"
action = "warn"
message = "🦨 use podman run (CDI GPU passthrough: --device nvidia.com/gpu=all --security-opt=label=disable)"

[[b00t.hive.guards]]
pattern = "docker build"
action = "warn"
message = "🦨 use podman build"
redirect = "podman build"

[[b00t.hive.guards]]
pattern = "docker-compose"
action = "warn"
message = "🦨 use podman-compose or podman play kube"

# --- Destructive operations ---
[[b00t.hive.guards]]
pattern = "rm -rf /"
action = "block"
message = "🚫 blocked: destructive root deletion"

[[b00t.hive.guards]]
pattern = "git push --force"
action = "warn"
message = "⚠️ force push detected — confirm branch is not main/master"

[[b00t.hive.guards]]
pattern = "git reset --hard"
action = "warn"
message = "⚠️ hard reset will discard uncommitted changes; checkpoint first with: git stash"

# --- Rust shop guards ---
[[b00t.hive.guards]]
pattern = "npm install -g"
action = "warn"
message = "🦨 prefer pnpm add -g for global JS tools (b00t hive uses pnpm)"

[[b00t.hive.guards]]
pattern = "brew install"
action = "warn"
message = "🦨 b00t hive is linux; use apt, cargo install, or uv tool install"

# --- HF/model download guards ---
[[b00t.hive.guards]]
pattern = "huggingface-cli download"
action = "warn"
message = "🦨 huggingface-cli is deprecated; use: hf download"
redirect = "hf download"

# --- Parse-time stage guards ---
[[b00t.hive.guards]]
pattern = { stage = "pre_parse" }
action = "block"
message = "🚫 blocked at parse time"

[[b00t.hive.guards]]
pattern = "ulimit -n"
action = "warn"
message = "⚠️ ulimit only affects current shell; systemd services use LimitNOFILE=65536 in unit file; for persistent system fix: sudo bash -c 'echo \"* soft nofile 65536\" >> /etc/security/limits.conf'"


# --- SCM branch/commit conventions ---
# Enforced via `b00t hive run` before any command reaches git.
# Prevents accidental main-branch work and non-conventional commits.
# Ref: _b00t_/schema/SCM-CONVENTIONS.tomllmd
# Uses simple cmd.contains() — regex_match(cmd, pattern) also available
# for more precise matching if needed (registered on Rhai engine).

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git checkout\") && (cmd.contains(\" main\") || cmd.contains(\" master\"))" }
action = "block"
message = "🚫 blocked: switching to main/master — work on a feature branch (feat/, fix/, chore/)"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git push\") && cmd.contains(\"origin main\")" }
action = "block"
message = "🚫 blocked: pushing to main — create a PR instead"
redirect = "gh pr create"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git merge\") && cmd.contains(\"main\")" }
action = "block"
message = "🚫 blocked: merging main — use gh pr merge or rebase flow"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git checkout -b\") && !cmd.contains(\"/\")" }
action = "warn"
message = "🦨 branch name should use type/description format (e.g. feat/add-widget, fix/login-crash)"

[[b00t.hive.guards]]
pattern = { rhai = "cmd.contains(\"git commit\") && cmd.contains(\"-m\") && !cmd.contains(\":\")" }
action = "warn"
message = "🦨 commit message should follow Conventional Commits: type(scope): description (e.g. feat: add widget)"

# --- Ledgerr/l3dg3rr guards ---

[[b00t.hive.guards]]
pattern = { rhai = "ledgerr_mcp_guard" }
action = "warn"
message = "🦨 ledgerr-mcp requires env vars: LEDGERR_MCP_DISABLE (optional), plus MCP transport config (stdio/tcp). Ensure your .env or hive profile has the needed environment."

[[b00t.hive.guards]]
pattern = { rhai = "ledgerr_port_guard" }
action = "warn"
message = "🦨 rotel-visual binds to port 4318 by default. Check conflict: ss -tlnp 'sport = :4318' or lsof -i :4318. Override with ROTEL_PORT env var."

[[b00t.hive.guards]]
pattern = { rhai = "ledgerr_just_guard" }
action = "warn"
message = "🦨 just ledgrrr:: module may not be loaded. Verify with: just ledgrrr::list-commands 2>&1 || echo 'just ledgrrr module not loaded'"

[[b00t.usage]]
description = "Check a command against universal guards"
command = "b00t run <your-command>"

[[b00t.usage]]
description = "List all active guards"
command = "b00t hive status --guards"

# ─── PRECRITERIA — system-normal state checks ────────────────────────────────
# Run before b00t task list/add/hive activate (NOT before read-only ops).
# Each check is a symbolic command that symbolically evaluates to system state.
# Implementation: b00t-cli reads [[b00t.hive.precriteria]] and runs checks
# before mutating operations. severity=error → warn (default) or block (--strict).

[[b00t.hive.precriteria]]
id          = "git-stash-reviewed"
label       = "git stash queue reviewed and integrated"
check       = "git stash list 2>/dev/null | wc -l | tr -d ' '"
expected    = "0"
severity    = "warn"
on_fail     = "git stash list  # review each entry; use 'git stash show -p stash@{N}' to inspect"
datum       = "SYSTEM-NORMAL"
# 🤓 NEVER auto-drop stashes — review and branch each entry before discarding
# 🤓 Recovery path if accidentally dropped: git stash store -m 'msg' <sha>

[[b00t.hive.precriteria]]
id          = "git-no-active-conflict"
label       = "no active merge/rebase conflicts"
check       = "git status --porcelain 2>/dev/null | grep -cE '^(UU|AA|DD)' || echo 0"
expected    = "0"
severity    = "error"
on_fail     = "git status  # resolve conflicts, then: git add && git commit (or git rebase --continue)"
datum       = "SYSTEM-NORMAL"

[[b00t.hive.precriteria]]
id          = "not-on-main"
label       = "not directly on main/master branch"
check       = "git branch --show-current 2>/dev/null | grep -cE '^(main|master)$' || echo 0"
expected    = "0"
severity    = "warn"
on_fail     = "git checkout -b task/<id>-<slug>  # always branch first"
datum       = "SYSTEM-NORMAL"
