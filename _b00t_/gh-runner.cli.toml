[b00t]
name = "gh-runner"
type = "cli"
hint = "Manage self-hosted GitHub Actions runners via b00t hive — install, status, logs, deregister, doctor"
depends_on = [["gh.cli", "wrkflw.cli"]]
unlocks = ["gh-runner *", "gh-runner-*"]
lfmf_category = "gh-runner"

# ── Abstract interfaces ────────────────────────────────────────────

[b00t.abstracts.install]
description = "Install and register a self-hosted runner for a repository"
command = "b00t gh-runner install --repo {repo} --labels {labels} --workdir {workdir} [--user {user}] [--group {group}] [--ephemeral]"
tokens = ["repo", "labels", "workdir", "user", "group"]

[b00t.abstracts.status]
description = "Check runner status — systemd service state + GitHub API registration"
command = "b00t gh-runner status [--repo {repo}] [--json]"
tokens = ["repo"]

[b00t.abstracts.logs]
description = "View runner service logs via journalctl"
command = "b00t gh-runner logs [--repo {repo}] [--follow]"
tokens = ["repo"]

[b00t.abstracts.deregister]
description = "Deregister runner from GitHub and remove local service"
command = "b00t gh-runner deregister --repo {repo} [--remove-service]"
tokens = ["repo"]

[b00t.abstracts.doctor]
description = "Diagnose runner health — config, connectivity, token, disk"
command = "b00t gh-runner doctor [--repo {repo}]"
tokens = ["repo"]

[validate]
command = "which b00t && b00t gh-runner status"
regex = "runner"

[[b00t.usage]]
description = "Install runner for a repo (example: app4dog/middleware)"
command = "b00t gh-runner install --repo app4dog/middleware --labels 'self-hosted,app4dog,linux,x64' --workdir /var/lib/gh-runner/middleware --user gh-runner --ephemeral"

[[b00t.usage]]
description = "Check runner status"
command = "b00t gh-runner status --repo app4dog/middleware"

[[b00t.usage]]
description = "Tail runner logs"
command = "b00t gh-runner logs --repo app4dog/middleware --follow"

[[b00t.usage]]
description = "Deregister and clean up"
command = "b00t gh-runner deregister --repo app4dog/middleware --remove-service"

[[b00t.usage]]
description = "Run health diagnostics"
command = "b00t gh-runner doctor --repo app4dog/middleware"

[[b00t.references]]
name = "actions/runner"
url = "https://github.com/actions/runner"
description = "Official GitHub self-hosted runner binary"

