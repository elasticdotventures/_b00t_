[b00t]
name = "gh-runner"
type = "cli"
hint = "Manage self-hosted GitHub Actions runners via podman kube play — install, status, logs, deregister, doctor"
depends_on = [["gh.cli", "wrkflw.cli"]]
unlocks = ["gh-runner *", "gh-runner-*"]
lfmf_category = "gh-runner"

# ── Abstract interfaces ────────────────────────────────────────────

[b00t.abstracts.install]
description = "Install and register a self-hosted runner pod for a repository"
command = "b00t gh-runner install --repo {repo} --labels {labels} --workdir {workdir} [--group {group}] [--ephemeral]"
tokens = ["repo", "labels", "workdir", "group"]

[b00t.abstracts.status]
description = "Check runner status — podman pod state + GitHub API registration"
command = "b00t gh-runner status [--repo {repo}] [--json]"
tokens = ["repo"]

[b00t.abstracts.logs]
description = "View runner pod logs via podman pod logs"
command = "b00t gh-runner logs [--repo {repo}] [--follow]"
tokens = ["repo"]

[b00t.abstracts.deregister]
description = "Deregister runner from GitHub and remove podman pod"
command = "b00t gh-runner deregister --repo {repo} [--remove-workdir]"
tokens = ["repo"]

[b00t.abstracts.doctor]
description = "Diagnose runner health — podman, gh auth, network, token"
command = "b00t gh-runner doctor [--repo {repo}]"
tokens = ["repo"]

[validate]
command = "which b00t && b00t gh-runner status"
regex = "runner"

[[b00t.usage]]
description = "Install runner pod for a repo (example: app4dog/middleware)"
command = "b00t gh-runner install --repo app4dog/middleware --labels 'self-hosted,app4dog,linux,x64' --workdir /var/lib/gh-runner/middleware --ephemeral"

[[b00t.usage]]
description = "Check runner pod + registration status"
command = "b00t gh-runner status --repo app4dog/middleware"

[[b00t.usage]]
description = "Tail runner pod logs"
command = "b00t gh-runner logs --repo app4dog/middleware --follow"

[[b00t.usage]]
description = "Deregister and remove pod + workdir"
command = "b00t gh-runner deregister --repo app4dog/middleware --remove-workdir"

[[b00t.usage]]
description = "Run health diagnostics"
command = "b00t gh-runner doctor --repo app4dog/middleware"

[[b00t.references]]
name = "actions/runner"
url = "https://github.com/actions/runner"
description = "Official GitHub self-hosted runner"

[[b00t.references]]
name = "actions/runner container image"
url = "https://github.com/actions/runner/pkgs/container/actions-runner"
description = "Official GitHub Actions runner container image (ghcr.io)"

