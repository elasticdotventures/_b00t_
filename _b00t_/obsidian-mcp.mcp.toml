# b00t datum: obsidian-mcp-connector bridge
# type: mcp
# Bridges MCP stdio ↔ HTTP to a running Obsidian instance.
# Provides both MCP tool access (agent-facing) and REST API access (grok indexing).
#
# Two plugin backends:
#   A. Semantic Notes Vault MCP (recommended) — runs INSIDE Obsidian, port 3443, 8 tools
#   B. obsidian-mcp-connector (container/npx bridge) — port 27200, MCP transport only
#
# Env vars (set via .env or b00t install):
#   OBSIDIAN_MCP_KEY — required, API key from plugin settings
#   OBSIDIAN_HOST    — default: windows-host.lan
#   OBSIDIAN_PORT    — default: 3443
#
# Quick start:
#   b00t install obsidian-mcp        — prompts for token, tests connection
#   just obsidian-proxy              — launch local proxy to Windows host
#   b00t mcp install obsidian-mcp   — register with Claude Code / VSCode
#
# 🤓 Proxy architecture:
#   b00t-mcp runs mcp-remote locally, which connects to the Windows
#   host's Obsidian MCP plugin via HTTPS. All MCP traffic is proxied
#   through the local stdio→HTTP bridge. The token never leaves your
#   machine — it's stored in your env/keyring.

[b00t]
name = "obsidian-mcp"
type = "mcp"
hint = "MCP server bridging to Obsidian vault — 8 tools via Semantic Notes Vault MCP plugin. Use via mcp-cli (avelino/mcp) or mcp-remote."
depends_on = ["mcp-cli.cli"]

[b00t.learn]
topic = "obsidian-mcp-connector"
auto_digest = false

# ── Transport A: Node.js MCP proxy (proven working) ──
# Handles Streamable HTTP + session management + self-signed cert.
# Reads JSON-RPC from stdin, proxies to remote Obsidian plugin over HTTPS.
[[b00t.mcp.stdio]]
transport = "stdio"
command = "scripts/obsidian-mcp.sh"
requires = ["OBSIDIAN_MCP_KEY"]

# ── Transport B: avelino/mcp CLI (requires TLS cert trust) ──
# Install: cargo install --git https://github.com/avelino/mcp.git
# Set MCP_CA_CERT=_b00t_/certs/obsidian-mcp.crt or use socat wrapper.

# ── Transport B: obsidian-mcp-connector (container/npx bridge) ──
# Requires Obsidian MCP Connector plugin + optionally the bridge container.
[[b00t.mcp.stdio]]
transport = "stdio"
command = "podman"
args = ["run", "-i", "--rm", "--name", "obsidian-mcp", "--network", "host",
        "-e", "OBSIDIAN_TOKEN", "-e", "OBSIDIAN_MCP_KEY", "obsidian-mcp-bridge:latest"]
requires = ["OBSIDIAN_TOKEN", "OBSIDIAN_MCP_KEY"]

[[b00t.mcp.stdio]]
transport = "stdio"
command = "npx"
args = ["-y", "mcp-remote", "http://${OBSIDIAN_HOST:-windows-host.lan}:27200/mcp",
        "--header", "Authorization: Bearer ${OBSIDIAN_MCP_KEY}"]
requires = ["OBSIDIAN_MCP_KEY"]

# ── REST API transport (for b00t grok digest) ──
# Requires Obsidian Local REST API plugin (port 27123).
[[b00t.mcp.stdio]]
transport = "stdio"
command = "sh"
args = ["-c", 'curl -s -H "Authorization: Bearer ${OBSIDIAN_TOKEN}" "http://${OBSIDIAN_HOST:-windows-host.lan}:27123/vault/${1}" -- "$@"', "_"]
requires = ["OBSIDIAN_TOKEN"]

# ── Grok knowledge skill ──
[b00t.grok]
topic = "obsidian-vault"
description = "Index Obsidian vault files into grok knowledge base for semantic query"
auto_digest = false

[b00t.grok.source.rest]
method = "GET"
url = "http://${OBSIDIAN_HOST:-windows-host.lan}:27123/vault/"
headers = { Authorization = "Bearer ${OBSIDIAN_TOKEN}" }
requires = ["OBSIDIAN_TOKEN"]

[[b00t.references]]
name = "Semantic Notes Vault MCP — runs inside Obsidian, MIT license"
url = "https://github.com/aaronsb/obsidian-mcp-plugin"

[[b00t.references]]
name = "GitHub: istefox/obsidian-mcp-connector (alternative)"
url = "https://github.com/istefox/obsidian-mcp-connector"

[[b00t.references]]
name = "claudian — Claude desktop integration for Obsidian"
url = "https://github.com/your/claudian-repo"

[[b00t.references]]
name = "claude-obsidian — Obsidian plugin for Claude Code"
url = "https://github.com/your/claude-obsidian-repo"

[[b00t.references]]
name = "MCP Remote (npm)"
url = "https://www.npmjs.com/package/mcp-remote"

[[b00t.references]]
name = "Smart Connections — local embedding model for semantic search"
url = "https://github.com/brianpetro/obsidian-smart-connections"

[[b00t.usage]]
description = "Call a vault tool via mcp-cli"
command = "mcp obsidian vault '{\"action\":\"search\",\"query\":\"<query>\"}'"

[[b00t.usage]]
description = "List Obsidian vault tools via mcp-cli"
command = "mcp obsidian --list"

[[b00t.usage]]
description = "Start mcp proxy for all configured servers"
command = "mcp serve"

[[b00t.usage]]
description = "Set up token in ~/.b00t/.env (one-time setup)"
command = "read -s OBSIDIAN_MCP_KEY && echo \"OBSIDIAN_MCP_KEY=$OBSIDIAN_MCP_KEY\" >> ~/.b00t/.env && just obsidian-proxy"

[[b00t.usage]]
description = "Launch local proxy to Windows host Obsidian vault"
command = "just obsidian-proxy"

[[b00t.usage]]
description = "Install Semantic Notes Vault MCP via claude mcp add"
command = "claude mcp add --transport http obsidian https://${OBSIDIAN_HOST:-windows-host.lan}:${OBSIDIAN_PORT:-3443}/mcp --header \"Authorization: Bearer ${OBSIDIAN_MCP_KEY}\""

[[b00t.usage]]
description = "List vault tools (Streamable HTTP — requires Accept header)"
command = "curl -sk -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -H 'Authorization: Bearer $OBSIDIAN_MCP_KEY' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-03-26\",\"capabilities\":{},\"clientInfo\":{\"name\":\"b00t\",\"version\":\"0.10.0\"}}}' https://${OBSIDIAN_HOST:-windows-host.lan}:${OBSIDIAN_PORT:-3443}/mcp"
