[b00t]
name = "ralph"
type = "mcp"
hint = "Ralph OODA loop via b00t-mcp — use b00t_up / b00t_status MCP tools to drive the loop"

[b00t.mcp]
protocol_version = "2024-11-05"

[b00t.mcp.server.stdio]
command = "b00t-mcp"
args = ["--transport", "stdio"]

[b00t.mcp.capabilities]
tools = ["b00t_up", "b00t_status", "b00t_cli_check"]
resources = ["taskmaster://tasks"]

[b00t.install]
requires = ["b00t-mcp"]
note = "ralph loop is driven by b00t.sh; MCP exposes b00t_up/b00t_status to external agents"
