[b00t]
name = "ralph"
type = "mcp"
hint = "Ralph OODA loop — use `b00t ooda run` via b00t-mcp to drive autonomous execution"

[[b00t.mcp.stdio]]
command = "b00t-mcp"
args = ["--stdio"]
transport = "stdio"
priority = 0
requires = ["b00t-mcp"]

[[b00t.usage]]
description = "Run ralph OODA loop with claude executor"
command = "b00t ooda run"

[[b00t.usage]]
description = "Run ralph OODA loop with local ch0nky via pi"
command = "b00t ooda run --agent=pi --max-iter=10"

[[b00t.usage]]
description = "Run ralph OODA loop with opencode executor"
command = "b00t ooda run --agent=opencode"

[[b00t.usage]]
description = "Run ralph OODA loop targeting specific task"
command = "b00t ooda run --task=42"

[[b00t.usage]]
description = "Check ralph OODA status"
command = "b00t ooda status"

[b00t.install]
requires = ["b00t-mcp"]
