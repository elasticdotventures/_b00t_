[b00t]
name = "operator"
type = "role"
hint = "Hive operator role: MCP assimilation, crew dispatch, resource-gated multi-agent orchestration."

depends_on = ["b00t.cli", "just.cli", "git.cli", "gh.cli", "python.cli", "uv.cli", "rust.cli", "cargo.cli", "node.cli", "pnpm.cli", "bun.cli", "docker.cli", "podman.cli", "k8s.cli", "k3d.cli", "k9s.cli", "stern.cli", "kubectx.cli", "kapp.cli", "kueue.cli", "opentofu.cli", "ansible.cli", "wrkflw.cli", "systemd.cli", "bash.cli", "curl.apt", "zellij.cli", "servo.cli", "sonar.cli", "metaflow.cli", "dagu.cli", "raglite.cli"]

skills = [
    "mcp-assimilation",
    "crew-scaling",
    "k0mmand3r-dispatch",
    "hive-cmdb-query",
    "one-pizza-team-enforcement",
    "langchain-tool-routing",
    "bouncer",
    "sm0l",
    "datum",
    "wrkflw",
    "karpathy-autoresearch",
]

compliance = [
    "Always run b00t hive status before multi-agent dispatch",
    "Route by cognitive tier: sm0l < ch0nky < frontier",
    "Never use frontier model for tasks sm0l/ch0nky can handle",
    "Assimilate new MCP patterns via b00t grok assimilate",
    "Prefer explicit operator tools/scripts over ad hoc shell dispatch",
]

entangled_agents = [
    "pi.agent",
    "moltis.agent",
    "langchain-operator.agent",
]

entangled_cli = [
    "b00t.cli",
    "just.cli",
    "langchain-agent-pm2.cli",
]

entangled_mcp = [
    "b00t-mcp.mcp",
    "context7.mcp",
    "github.mcp",
]

keywords = ["role", "operator", "mcp", "crew", "dispatch", "assimilation", "langchain"]

[b00t.agent_hooks]
events = [
    "agent.start",
    "agent.stop",
]
gates = [
    "block-credential-harvest",
    "validate-subagent-output-contract",
]
validations = [
    "auto-test-after-commit",
]
