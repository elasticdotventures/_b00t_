# b00t Hive Profile — Qwen3.6-27B vLLM inference (ch0nky tier)
# Replaces inference-gemma4: gemma4 GGUF unsupported in vLLM (unknown dtype for tensor)
# PRE-REQ: hf download unsloth/Qwen3.6-27B-GGUF --include "Qwen3.6-27B-Q4_K_M.gguf"
# Activate: b00t hive activate inference-qwen36-27b
# Autostart fix: enable b00t-hive-inference-qwen36-27b.service (generated unit), NOT template

[b00t]
name = "inference-qwen36-27b"
type = "hive_profile"
hint = "Qwen3.6-27B GGUF on vLLM at :8001 — ch0nky tier; Q4_K_M ~15GB VRAM; RTX 3090"

[b00t.hive.resources]
# 🤓 Q4_K_M weights ~15GB + vLLM overhead ~2GB + KV cache ~2GB = ~19GB peak
ram_gb    = 8
gpu_mb    = 19000
cpu_cores = 2

[b00t.hive.resources.gate]
ram_free_gb = 4
gpu_free_mb = 18000
# 🤓 Gate deliberately lower than gemma4's 16000 to avoid false blocks on system startup

[b00t.hive.exclusion]
group    = "primary-workload"
priority = 70

[b00t.hive.services]
# 🤓 Empty: b00t generates b00t-hive-inference-qwen36-27b.service from [b00t.hive.service] inline spec
start = []
stop  = []

# ─── Inline service spec — b00t generates & enables this unit on activate ────
[b00t.hive.service]
description      = "vLLM Qwen3.6-27B GGUF inference node (port 8001) — ch0nky tier"
service_type     = "simple"
limit_nofile     = 65536
restart          = "on-failure"
restart_sec      = "30s"
timeout_start_sec = "300"
after            = ["network.target"]
environment      = [
  "PATH=/home/brianh/.venv/bin:/usr/local/bin:/usr/bin:/bin",
  "HF_HOME=/home/brianh/.cache/huggingface",
  "VLLM_WORKER_MULTIPROC_METHOD=spawn",
]
exec_start_pre   = [
  # Verify AWQ model is downloaded before starting vllm
  "/bin/bash -c 'python3 -c "from huggingface_hub import try_to_load_from_cache; p=try_to_load_from_cache(\"Qwen/Qwen3-27B-AWQ\", \"config.json\"); p or (print(\"AWQ model not found — run: hf download Qwen/Qwen3-27B-AWQ\" , __import__(\"sys\").stderr) or exit(1))\"'",
]
exec_start = """/home/brianh/.venv/bin/vllm serve \
    Qwen/Qwen3-27B-AWQ \
    --tokenizer Qwen/Qwen3-27B \
    --quantization awq \
    --served-model-name ch0nky \
    --port 8001 \
    --max-model-len 32768 \
    --enable-chunked-prefill \
    --enforce-eager \
    --enable-auto-tool-choice \
    --tool-call-parser hermes"""
# 🤓 vllm requires AWQ format — GGUF is experimental/unsupported in vllm
# 🤓 GGUF path: use inference-qwen36-27b-llamacpp profile (llama.cpp backend)
# 🤓 AWQ model: Qwen/Qwen3-27B-AWQ — ~14GB, fits RTX 3090 24GB
# 🤓 --enforce-eager: avoids Triton CUDA graph compilation deadlock on RTX 3090
# 🤓 --tool-call-parser hermes: Qwen3 uses hermes-style tool call format
# ⚠️  Download first: b00t hive activate download-mode; hf download Qwen/Qwen3-27B-AWQ

[b00t.hive.env]
B00T_AI_CH0NKY_BASE  = "http://127.0.0.1:8001/v1"
B00T_AI_CH0NKY_MODEL = "ch0nky"
OPENAI_BASE_URL      = "http://127.0.0.1:8001/v1"
OPENAI_API_KEY       = "local-b00t"
PI_MODEL             = "ch0nky"

[b00t.hive.mcp_tools]
activate = ["vllm-local", "pi-agent"]

[[b00t.hive.guards]]
pattern = "pip install"
action  = "warn"
message = "🦨 use uv pip install"

[[b00t.hive.guards]]
pattern = "docker run"
action  = "warn"
message = "🦨 use podman (CDI GPU)"

# ─── Usage recipes ───────────────────────────────────────────────────────────
[[b00t.usage]]
description = "Activate via b00t hive (generates + enables systemd unit)"
command     = "b00t hive activate inference-qwen36-27b"

[[b00t.usage]]
description = "Verify ch0nky endpoint"
command     = "curl -s http://localhost:8001/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "Check generated service status"
command     = "systemctl --user status b00t-hive-inference-qwen36-27b"

[[b00t.usage]]
description = "Check vLLM logs"
command     = "journalctl --user -u b00t-hive-inference-qwen36-27b -f --no-pager"

[[b00t.usage]]
description = "Dry-run (check resource gate + preview commands)"
command     = "b00t hive plan inference-qwen36-27b"

[[b00t.usage]]
description = "Force-activate (bypass resource gate)"
command     = "b00t hive activate inference-qwen36-27b --force"

[[b00t.usage]]
description = "Test opencode with local ch0nky model"
command     = "opencode run --model vllm-local/ch0nky 'say hello in 3 words'"

