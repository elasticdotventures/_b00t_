[b00t]
name = "socratic"
type = "skill"
type_tags = ["transferable"]
hint = "Socratic method — question assumptions systematically; ask 'why?' before accepting any premise"
keywords = ["socratic", "questions", "assumptions", "dialectic", "inquiry", "challenge", "premise", "why"]

[b00t.learn]
content = """
Socratic method: expose false beliefs by disciplined questioning, not assertion.
Never accept a premise at face value. Probe it:
  "What do you mean by X?"
  "How do you know that?"
  "What is the evidence?"
  "What are the counter-examples?"
  "What follows if you're wrong?"
Apply to your own reasoning too — internal Socratic dialogue catches errors before they ship.
In code review: "why is this abstraction here?" not "this abstraction is wrong."
The goal is not to win — it's to find the true answer through collaborative inquiry.
Elenchus: lead the speaker to contradict themselves → exposes hidden assumptions.
Anti-pattern: accepting "that's how it's always been done" as an answer to any "why."
"""

