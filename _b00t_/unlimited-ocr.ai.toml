[b00t]
name = "unlimited-ocr"
type = "ai"
desires = "latest"
hint = "Baidu Unlimited-OCR — OCR model for unlimited-length text recognition, served via podman container"
depends_on = ["podman.cli"]

install = '''
echo "📦 Installing Unlimited-OCR via podman..."

IMAGE="ghcr.io/baidu/unlimited-ocr:latest"
# Pull + verify
podman pull "$IMAGE"
# Create wrapper script
mkdir -p ~/.local/bin
cat > ~/.local/bin/unlimited-ocr <<'WRAPPER'
#!/usr/bin/env bash
# unlimited-ocr podman wrapper
# Usage: unlimited-ocr <input_image> [output_file]
PODMAN_ARGS=(
  --rm
  --device nvidia.com/gpu=all
  -v "$(pwd):/workspace:Z"
  -v "$HOME/.cache/unlimited-ocr:/root/.cache:Z"
)
exec podman run "$${PODMAN_ARGS[@]}" ghcr.io/baidu/unlimited-ocr:latest "$@"
WRAPPER
chmod +x ~/.local/bin/unlimited-ocr

# Verify
unlimited-ocr --version 2>/dev/null || echo "unlimited-ocr installed (version check TBD)"
'''

update = '''
echo "🔄 Updating Unlimited-OCR..."
podman pull ghcr.io/baidu/unlimited-ocr:latest
echo "Updated to latest image"
'''

version = "podman image inspect ghcr.io/baidu/unlimited-ocr:latest --format '{{.Created}}' 2>/dev/null || echo 'unknown'"
version_regex = '(.+)'
lfmf_category = "ocr"

[b00t.ai]
provider = "baidu"
model = "unlimited-ocr"
runtime = "podman"
capabilities = "ocr,text-recognition"
tier = "ch0nky"

[b00t.learn]
topic = "unlimited-ocr"
auto_digest = false

[[b00t.usage]]
description = "OCR an image file"
command = "unlimited-ocr input.png"

[[b00t.usage]]
description = "OCR to output text file"
command = "unlimited-ocr scan.png output.txt"

[[b00t.usage]]
description = "Update to latest image"
command = "podman pull ghcr.io/baidu/unlimited-ocr:latest"

[[b00t.references]]
name = "Unlimited-OCR on HuggingFace"
url = "https://huggingface.co/baidu/Unlimited-OCR"
type = "model"

[[b00t.references]]
name = "Unlimited-OCR GitHub"
url = "https://github.com/baidu/Unlimited-OCR"
type = "source"

[validate]
command = "podman image exists ghcr.io/baidu/unlimited-ocr:latest || podman pull ghcr.io/baidu/unlimited-ocr:latest"
regex = ""

[roles]
required_for = []
optional_for = ["developer", "analyst"]

[b00t.metadata]
category = "ocr"
tags = ["ocr", "podman", "gpu", "baidu", "text-recognition"]
maturity = "unknown"

