[b00t]
name = "scoring"
type = "agent"
hint = "Stateless scoring agent: evaluates sub-agent output across ROI/cost/time/accuracy/utility/risk dimensions."

entangled_cli = [
    "b00t.cli",
    "just.cli",
]

entangled_mcp = ["b00t-mcp.mcp"]

keywords = ["agent", "scoring", "evaluation", "statistics", "ab-test"]

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

[b00t.capabilities]
scoring_dimensions = ["roi", "cost", "time", "accuracy", "utility", "risk"]
model_tier = "sm0l"
output_contract = "SCORE: PASS|FAIL:<variant>:<result>"
