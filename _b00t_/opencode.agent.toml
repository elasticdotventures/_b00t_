# b00t Agent Datum — opencode as first-class hive sub-agent
# 🤓 opencode is managed as a systemd --user service (b00t hive pattern)
#    NOT a subprocess-per-invocation: b00t starts/stops the unit; tasks sent via ACP HTTP
#    Activate: systemctl --user start b00t@opencode-agent.service
#    Tasks:    opencode run --model gemma4-local/ch0nky "task" (hits the running server)
#    Swap:     systemctl --user stop b00t@opencode-agent && systemctl --user start b00t@pi-agent
# https://opencode.ai/

[b00t]
name = "opencode"
type = "agent"
hint = "opencode coding agent — systemd-managed ACP server; ch0nky tier; swap with pi via hive stop/start"

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
pid = "opencode-001"
branch = "main"
model = "qwen36-local/ch0nky"
skills = ["code", "refactor", "debug", "edit", "bash", "read", "write", "grep", "find", "ls", "tui"]
personality = "pragmatic"
humor = "low"
role = "specialist"

[b00t.agent.ipc]
# 🤓 opencode ACP server listens on HTTP :3000; tasks submitted via opencode run --attach or HTTP
socket = "/tmp/b00t/agents/opencode.sock"
port = 3000
pubsub = false
protocol = "http+acp"

[b00t.agent.crew]
role = "specialist"
captain = false


[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

[b00t.agent.mcp]
# 🤓 opencode reads MCP config from ~/.config/opencode/opencode.json
enabled = true

# ── Inline service spec — b00t generates this unit dynamically ───────────────
# 🤓 b00t@opencode-agent.service → `opencode serve` persistent ACP daemon on :3000
#    Tasks reach it via: opencode run --model gemma4-local/ch0nky "task"
#    Swap pattern: stop this unit, start b00t@pi-agent.service — same ch0nky slot
[b00t.hive.service]
description = "opencode ACP server — ch0nky coding agent (port 3000)"
service_type = "simple"
restart = "on-failure"
restart_sec = "10s"
timeout_start_sec = "60"
after = ["network.target", "b00t-hive-inference-qwen36-27b.service"]
environment = [
  "PATH=/home/brianh/.nvm/versions/node/v22.15.1/bin:/usr/local/bin:/usr/bin:/bin",
  "OPENCODE_CONFIG=/home/brianh/.config/opencode/opencode.json",
]
exec_start = "opencode serve --port 3000 --model qwen36-local/ch0nky"

[b00t.hive.resources]
ram_gb = 1
gpu_mb = 0
cpu_cores = 1

[b00t.hive.resources.gate]
ram_free_gb = 1
gpu_free_mb = 0

[b00t.hive.exclusion]
# 🤓 only one ch0nky coding-agent service active at a time; pi and opencode are mutually exclusive
group = "ch0nky-coding-agent"
priority = 60

[b00t.env]
AGENT_ID = "opencode"
AGENT_SKILLS = "code,refactor,debug,edit,bash"
OPENCODE_CONFIG = "/home/brianh/.config/opencode/opencode.json"

[[b00t.usage]]
description = "Start opencode agent service (b00t hive)"
command = "systemctl --user start b00t@opencode-agent.service"

[[b00t.usage]]
description = "Stop opencode agent service"
command = "systemctl --user stop b00t@opencode-agent.service"

[[b00t.usage]]
description = "Submit task to running opencode ACP server"
command = "opencode run --model qwen36-local/ch0nky 'your task here'"

[[b00t.usage]]
description = "Swap from pi to opencode (same ch0nky slot)"
command = "systemctl --user stop b00t@pi-agent.service && systemctl --user start b00t@opencode-agent.service"

