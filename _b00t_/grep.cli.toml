# b00t CLI Datum — grep
# @tribal: prefer `rg` (ripgrep) over grep — respects .gitignore, faster, better defaults

[b00t]
name = "grep"
type = "cli"
hint = "Text search. Use rg (ripgrep) as primary; grep only for POSIX compatibility or piped stdin."

[cli]
primary = "rg"
fallback = "grep"
install = "apt install ripgrep"

[cli.prefer_rg]
reasons = [
  "auto-skips .gitignore / .git — no noise from build artifacts or node_modules",
  "significantly faster on large codebases (parallel, SIMD)",
  "color output + line numbers by default",
  "--type flag filters by language (--type rust, --type py)",
  "regex by default, no -E flag needed",
]

# @example: rg 'pattern' src/          # search src/, respects .gitignore
# @example: rg -t rust 'unwrap\('      # Rust files only
# @example: rg -l 'TODO'               # filenames only
# @example: rg -C 3 'error'            # 3 lines context
# @example: grep -r 'pattern' .        # fallback for POSIX scripts

[cli.avoid]
grep_patterns = [
  "grep -r",      # use rg instead
  "grep -rn",     # use rg instead
  "find . | grep" # use rg --files or fd instead
]

