# AI-Source-Engine (AL-1.0) — Transformer Attribution Logging
#
# 🤓 RayFromBoston/AI-Source-Engine: AL-1.0 attribution logging for transformers.
#    Deep-dive completed: ENGINEERING_GUIDE.md + src/al10/ source tree analyzed.
#
#    What makes it special:
#      1. Zero-second-pass: reuses existing attention weights (already computed
#         during inference). No additional model pass. 1% overhead is plausible.
#      2. Per-token provenance: not "doc influenced response" but "source 10
#         contributed 41.2% to this specific output token". Mathematical receipts.
#      3. Two-engine architecture: training-side source_idx alignment +
#         inference-side attention bucketing. If either breaks, trust breaks.
#      4. Hard invariants: len(input_ids)==len(source_idx) per row, ratios sum~1.0.
#      5. Framework adapters: torch, huggingface, vllm already shipping.

# ── b00t Concept Coverage Analysis ───────────────────────────────────────────

[coverage]
overall = "~30% concept overlap"
analysis = """
  b00t has NO equivalent for:
    - Per-token attention provenance (operates at code level, not transformer)
    - source_idx → token alignment (different domain — b00t doesn't train models)
    - Bucket-and-normalize ratio computation (no attention weights to bucket)
    - Framework adapters (torch/HF/vllm — not b00t's domain)

  b00t HAS isomorphic patterns:
    - Attribution receipts (JSON, SHA256) ↔ evidence/satisfies.jsonl (70% match)
    - Hard invariants ↔ Satisfies<Constraint> gate validation (60%)
    - Source registry (manifest, hashes) ↔ Store manifest.jsonl (80%)
    - Exhaustive sort token invariance ↔ ─ (0% — no b00t equivalent)

  What b00t could adopt:
    - AL-1.0 receipt JSON schema as an evidence/satisfies output format
    - Source registry pattern as a store manifest extension
    - Exhaustive sort token concept for datum ordering validation
"""

