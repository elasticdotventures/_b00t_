[b00t]
name = "alpha"
depends_on = ["epoch-progression.job"]
type = "agent"
hint = "Curious agent specializing in Rust & testing"

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
pid = "01QR79jKinPGYGza4dPvj3jJ"
branch = "claude/multi-agent-boot-poc-01QR79jKinPGYGza4dPvj3jJ"
model = "claude-sonnet-4-5"
skills = ["rust", "testing", "tdd", "architecture"]
personality = "curious"
humor = "moderate"
role = "specialist"

[b00t.agent.ipc]
socket = "/tmp/b00t/agents/alpha.sock"
pubsub = true
protocol = "msgpack"

[b00t.agent.crew]
# Initially specialist, can be promoted to captain
role = "specialist"
captain = false


[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

[b00t.env]
# Agent-specific environment
AGENT_ID = "alpha"
AGENT_SKILLS = "rust,testing,tdd,architecture"
