[b00t]
name = "six-sigma"
type = "skill"
type_tags = ["transferable"]
hint = "DMAIC — Define, Measure, Analyze, Improve, Control; reduce variance via data-driven decisions"
keywords = ["dmaic", "six-sigma", "variance", "quality", "data-driven", "control", "defect", "sigma"]

[b00t.learn]
content = """
Six Sigma: reduce defects to 3.4 per million by eliminating variance.
DMAIC cycle:
  Define   — what is the problem? what is the target state? who is affected?
  Measure  — collect baseline data. no guessing, no anecdote.
  Analyze  — find root cause. use fishbone/5-whys/pareto. don't fix symptoms.
  Improve  — implement targeted solution. pilot first, measure impact.
  Control  — lock in the gain. add monitoring, set triggers to catch regression.
Key rule: never skip Measure — improving an unmeasured process is theater.
In code: DMAIC maps to: define acceptance criteria → measure test coverage →
analyze failure modes → improve code → add CI gates.
"""

