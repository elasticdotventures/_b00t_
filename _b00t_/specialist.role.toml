[b00t]
name = "specialist"
trigger_words = ["implement", "refactor", "debug", "build", "delegate", "sm0l", "ch0nky"]
type = "role"
hint = "Hive specialist role: sm0l-tier subagent with delegate skill, CMDB hygiene, 🍰 cake accrual"

# <|🦨: repoint-candidate — cargo.cli never authored; rust.cli/rustc.cli exist; _b00t_#850, #163 |>
depends_on = ["playbook.skill", "delegate.skill", "opencode.agent", "b00t.cli", "git.cli", "just.cli", "bash.cli", "cargo.cli"]

skills = [
    "delegate",
    # <|🦨: prose-logical — code/refactor/debug/edit/read/write/glob are tool-capability names, not datum keys; #163 |>
    "code",
    "refactor",
    "debug",
    "edit",
    "bash.cli",
    "read",
    "write",
    "grep.cli",
    "glob",
    "task.cli",
    # <|🦨: repoint-candidate — datum-authoring.skill exists; #163 |>
    "datum",
    "mece",
]

compliance = [
    "Always delegate sub-tasks via b00t agent delegate",
    "Update CMDB datums, never work directly with system files",
    "Route sm0l tasks to qwen36-local/sm0l, ch0nky to qwen36-local/ch0nky",
    "Accrue 🍰 cake via CMDB hygiene: datum writes, task updates, just recipes",
    "Log delegation evidence to .b00t/delegation-evidence.jsonl",
    "Use podman kube play, not systemctl",
]

[b00t.role.models]
sm0l = { provider = "qwen36-local", model = "sm0l", endpoint = "http://127.0.0.1:8001/v1", tier = "sm0l", context = 32768 }
ch0nky = { provider = "qwen36-local", model = "ch0nky", endpoint = "http://127.0.0.1:8001/v1", tier = "ch0nky", context = 32768 }

[b00t.role.agents]
opencode = { path = "_b00t_/opencode.agent.toml", tier = "sm0l", supports = ["code", "refactor", "debug", "edit", "bash"] }
pi = { path = "_b00t_/pi.agent.toml", tier = "ch0nky", supports = ["code", "refactor", "debug", "edit", "bash"] }

[b00t.role.session]
# 🤓 Session state is durable across reloads — stored in .b00t/session.json
state_file = ".b00t/session.json"
autoload_skills = ["delegate"]
autoload_roles = ["specialist"]

[b00t.role.cake]
# 🤓 🍰 earned per session for CMDB hygiene, delegate usage, just recipes
enabled = true
balance_file = ".b00t/cake-balance.jsonl"

