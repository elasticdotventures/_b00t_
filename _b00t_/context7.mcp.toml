[b00t]
name = "context7"
type = "mcp"
hint = "MCP server"

[[b00t.gate]]
command = "bunx"

[[b00t.mcp.stdio]]
command = "bunx"
requires = []
args = ["-y", "@upstash/context7-mcp"]
priority = 0
transport = "stdio"

[validate]
command = "bunx -y @upstash/context7-mcp --help"
regex = "context7-mcp"

[roles]
required_for = ["developer", "orchestrator"]
optional_for = ["analyst"]
