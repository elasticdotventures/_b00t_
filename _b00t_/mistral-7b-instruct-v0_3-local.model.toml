# b00t AI Model Datum - local mistral.rs + Candle runtime

[b00t]
name = "mistral-7b-instruct-v0_3-local"
type = "model"
hint = "Local Mistral 7B Instruct served via mistral.rs (Candle)"
aliases = ["mistral-local", "mistral7b-local"]

[b00t.env]
VLLM_MODEL_DIR = "~/.b00t/models/mistralai__Mistral-7B-Instruct-v0.3"
MISTRALRS_API_BASE = "http://127.0.0.1:1234/v1"
MISTRALRS_MODEL_NAME = "mistral-local"

[ai_model]
provider = "openai_compatible"
size = "small"
capabilities = ["chat", "code", "reasoning"]
litellm_model = "openai/mistral-local"
api_base = "http://127.0.0.1:1234/v1"
api_key_env = "MISTRALRS_API_KEY"
rpm_limit = 120
context_window = 32768

[ai_model.parameters]
max_tokens = 1024
temperature = 0.2

[ai_model.metadata]
runtime = "mistralrs-candle"
hf_repo = "mistralai/Mistral-7B-Instruct-v0.3"
cache_dir = "~/.b00t/models/mistralai__Mistral-7B-Instruct-v0.3"
served_model_name = "mistral-local"
