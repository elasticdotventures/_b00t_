[b00t.learn]
content = """
TRIZ (Theory of Inventive Problem Solving): contradictions are solvable without tradeoffs.
Step 1: identify the contradiction — "I need X but that causes Y."
Step 2: classify — technical (one param improves, another worsens) or physical (must be both A and not-A).
Step 3: look up the contradiction matrix → select from 40 inventive principles.
Key principles: segmentation, extraction, local quality, asymmetry, merging, universality,
nesting, anti-weight, prior action, prior cushioning, inversion, dynamism, partial/overdone.
TRIZ insight: ideal final result (IFR) — the system performs the function without existing.
Anti-pattern: compromising between two requirements instead of dissolving the contradiction.
"""

