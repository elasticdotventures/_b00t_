# b00t CLI Datum — pi-mcp-adapter (nicobailon/pi-mcp-adapter)
# 🤓 MCP proxy for pi-coding-agent: ~200 tokens vs 10k+ for raw MCP tool defs
# Servers lazy-loaded on demand; metadata cached so search works offline
# https://github.com/nicobailon/pi-mcp-adapter
# Install: pi install npm:pi-mcp-adapter (pi's own package manager, not npm -g)

[b00t]
name = "pi-mcp-adapter"
type = "cli"
desires = "latest"
hint = "pi MCP proxy — lazy-load MCP servers in pi-coding-agent; saves 10k+ context tokens vs raw MCP"
install = "pi install npm:pi-mcp-adapter"
update = "pi install npm:pi-mcp-adapter"

[b00t.learn]
topic = "pi-mcp-adapter"
auto_digest = true

[[b00t.usage]]
description = "Install pi-mcp-adapter into pi runtime"
command = "pi install npm:pi-mcp-adapter && echo 'restart pi to activate'"

[[b00t.usage]]
description = "Wire b00t-mcp server into pi via mcp.json"
command = """cat > ~/.pi/agent/mcp.json << 'EOF'
{
  "mcpServers": {
    "b00t": {
      "command": "b00t-mcp",
      "args": [],
      "lifecycle": "lazy",
      "idleTimeout": 30
    }
  }
}
EOF
echo 'b00t-mcp wired into pi MCP adapter'"""

[[b00t.usage]]
description = "Search available MCP tools inside pi session"
command = "pi -p 'mcp({ search: \"b00t\" })'"

[[b00t.usage]]
description = "Invoke b00t tool via pi MCP adapter"
command = "pi -p 'mcp({ tool: \"b00t_status\", args: \"{}\" })'"

[[b00t.usage]]
description = "Install pi-mcp-adapter as MCP server into Claude Code (exposes pi tools to Claude)"
command = "b00t mcp install pi-mcp-adapter claudecode"

[[b00t.usage]]
description = "Install pi-mcp-adapter as MCP server into repo .mcp.json"
command = "b00t mcp install pi-mcp-adapter dotmcpjson"

[[b00t.usage]]
description = "Self-install: pi agent calls b00t mcp install pi-mcp-adapter via MCP tool"
command = "pi -p 'bash({ cmd: \"b00t mcp install pi-mcp-adapter claudecode\" })'"

[validate]
command = "pi list"
regex = "pi-mcp-adapter"

