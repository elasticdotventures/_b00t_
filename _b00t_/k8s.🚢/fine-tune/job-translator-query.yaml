---
# One-shot translator query — runs sm0l-translator.py --query "__QUERY__"
# sed-replaced by just ai-finetune::translator-query before kubectl apply
apiVersion: batch/v1
kind: Job
metadata:
  name: b00t-translator-query
  namespace: b00t-finetune
  labels:
    b00t.tier: finetune
    b00t.io/job: translator-query
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        b00t.tier: finetune
        b00t.io/job: translator-query
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: translator
          image: unsloth/unsloth:latest
          command:
            - python3
            - /workspace/_b00t_/scripts/sm0l-translator.py
            - --query
            - __QUERY__
          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
              nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              nvidia.com/gpu: 1
          env:
            - name: HF_HOME
              value: /hf
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: hf-cache
              mountPath: /hf
      volumes:
        - name: workspace
          hostPath:
            path: /home/brianh/.b00t
            type: Directory
        - name: hf-cache
          hostPath:
            path: /home/brianh/.cache/huggingface
            type: DirectoryOrCreate
