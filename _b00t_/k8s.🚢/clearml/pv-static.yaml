---
# Static PVs for ClearML — bypasses local-path-provisioner (avoids image pull)
# Data lives under /home/brianh/.b00t-data/clearml/
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clearml-dragonfly
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /home/brianh/.b00t-data/clearml/dragonfly
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [sm3llsl1k3s0ld3r]
