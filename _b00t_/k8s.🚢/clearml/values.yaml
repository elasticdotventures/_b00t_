# ClearML single-node k0s values
# NodePort access: webserver 30080 already taken by gateway — use 30800/30808/30801
# Accessible via Gateway: http://clearml.b00t.local:30080

clearml:
  cookieDomain: ".b00t.local"

apiserver:
  service:
    type: NodePort
    nodePort: 30008

webserver:
  service:
    type: NodePort
    nodePort: 30880

fileserver:
  service:
    type: NodePort
    nodePort: 30081

# Single-node: tolerate control-plane taint
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

elasticsearch:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Single-node: accept yellow cluster health
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
  # 🤓 ES 7.17.x JvmOptionsParser crashes on cgroup v2 (Ubuntu 26/kernel 7) before
  #    ES even starts — no JVM flag can fix a launcher that NPEs in DefaultSystemMemoryInfo.
  #    ES 8.x rewrote cgroup detection; minimum version for cgroup v2 bare-metal.
  imageTag: "8.14.3"
  esJavaOpts: "-Xms1g -Xmx1g"
  master:
    replicaCount: 1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

mongodb:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

redis:
  master:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
