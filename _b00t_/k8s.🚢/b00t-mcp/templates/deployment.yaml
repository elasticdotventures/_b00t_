{{- range .Values.mcpServers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: b00t-mcp-{{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app.kubernetes.io/name: b00t-mcp
    app.kubernetes.io/component: {{ .name }}
    b00t.io/mcp-server: {{ .name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: b00t-mcp
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: b00t-mcp
        app.kubernetes.io/component: {{ .name }}
        b00t.io/mcp-server: {{ .name | quote }}
        b00t.io/transport: {{ .transport | default "native" | quote }}
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          {{- if .command }}
          command: {{ .command | toJson }}
          {{- end }}
          {{- if .args }}
          args: {{ .args | toJson }}
          {{- else if eq (.transport | default "native") "gateway" }}
          command: ["npx"]
          args: ["-y", "@supercorp-ai/supergateway", "--stdio", {{ .gatewayCmd | quote }}, "--port", {{ .port | default 3000 | quote }}, "--host", "0.0.0.0"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .port | default 3000 }}
              protocol: TCP
          env:
            - name: MCP_SERVER_NAME
              value: {{ .name | quote }}
            {{- range .env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- if and .probe .probe.enabled }}
          {{- if eq (.probe.type | default "http") "tcp" }}
          livenessProbe:
            tcpSocket:
              port: {{ .port | default 3000 }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: {{ .port | default 3000 }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else }}
          livenessProbe:
            httpGet:
              path: {{ .probe.path | default "/health" }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .probe.path | default "/health" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .readOnlyRootFilesystem | default false }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range .extraVolumeMounts }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range .extraVolumes }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      restartPolicy: Always
{{- end }}
