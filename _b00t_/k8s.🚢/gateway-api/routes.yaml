---
# HTTPRoute: expose ch0nky via Gateway API
# Reachable at: http://ch0nky.b00t.local:30080/v1/...
# Add to /etc/hosts or Pi-hole: 192.168.1.137 ch0nky.b00t.local
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ch0nky
  namespace: b00t-inference
spec:
  parentRefs:
    - name: b00t-gateway
      namespace: b00t-gateway
  hostnames:
    - "ch0nky.b00t.local"
  rules:
    - backendRefs:
        - name: ch0nky
          port: 8001
---
# MLflow experiment tracking — http://mlflow.b00t.local:30080
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mlflow
  namespace: b00t-inference
spec:
  parentRefs:
    - name: b00t-gateway
      namespace: b00t-gateway
  hostnames:
    - "mlflow.b00t.local"
  rules:
    - backendRefs:
        - name: mlflow
          port: 5000
