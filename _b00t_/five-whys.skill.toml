[b00t]
name = "five-whys"
type = "skill"
type_tags = ["transferable"]
hint = "Root cause analysis — ask 'why?' 5 times; stops at systemic cause not symptom"
keywords = ["five-whys", "root-cause", "rca", "why", "symptom", "systemic", "cause", "analysis"]

[b00t.learn]
content = """
Five Whys (Toyota): iterate "why?" until you reach a systemic/actionable root cause.
Rule: each answer becomes the subject of the next "why?"
Example:
  Bug in prod → why? → test missed it → why? → no test for this path → why? →
  developer didn't know the path existed → why? → no onboarding doc → why? →
  we never wrote it. Root cause: missing documentation process.
Fix the ROOT, not the symptom — patching the bug without fixing the process guarantees recurrence.
5 is a heuristic, not a law. Stop when: you reach something you can actually change.
Watch out: multiple branches. One "why" may have two answers → diagram both.
Anti-pattern: stopping at the first visible cause ("it was a bug") and calling it done.
In incidents: five-whys drives the corrective action section of the post-mortem.
"""

