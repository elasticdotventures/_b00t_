[b00t]
name = "rubber-duck"
type = "skill"
type_tags = ["transferable"]
hint = "Explain the problem aloud step by step — articulation surfaces hidden assumptions"
keywords = ["rubber-duck", "debugging", "articulation", "explain", "verbalize", "assumptions", "clarity"]

[b00t.learn]
content = """
Rubber duck debugging: explain the problem to a non-expert (or inanimate object) step by step.
The act of articulation forces you to make implicit assumptions explicit.
Protocol:
  1. Describe what the code/system SHOULD do.
  2. Describe what it ACTUALLY does.
  3. Describe each step in between, out loud.
  4. The bug appears at the step where description and reality diverge.
Why it works: you know more than you've made explicit. Speaking forces serialization of tacit knowledge.
Extend it: write the explanation as a comment before the code. If you can't explain it, you don't understand it.
Also applies to planning: "explain the plan" before implementing often reveals the flaw.
Anti-pattern: staring at the same code hoping the answer appears. It won't.
"""

