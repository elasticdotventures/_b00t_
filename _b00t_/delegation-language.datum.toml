# b00t Delegation Language — abstract frontier↔worker protocol
# Synthesized from: ralphex (stale-termination, parallel fan-out),
#                   agentic-stack (explicit delegation contract, salience RAG),
#                   beads (hash task IDs, dependency gate, DeferUntil)
# 🤓 This datum encodes HOW frontier models delegate to b00t workers, not what they do.

[b00t]
name    = "delegation-language"
version = "0.1.0"
type    = "datum"
hint    = "Abstract delegation protocol for frontier↔worker communication in b00t hive"

# ─── Output contract ─────────────────────────────────────────────────────────
[b00t.output_contract]
# @tribal: SCORE and EXIT_SIGNAL are parsed by b00t.sh metric_gate_check and
#          loop controller; format must match exactly — no trailing spaces
score_patterns = [
  "SCORE: PASS:<datum>:<result>",     # work done, gate passed
  "SCORE: FAIL:<datum>:<reason>",     # work failed
  "SCORE: SKIP:<reason>",             # no applicable gap found
  "SCORE: STALE:<N>:<datum>",         # consecutive stale rounds
]
exit_patterns = [
  "EXIT_SIGNAL: true",                # do not re-queue
  "EXIT_SIGNAL: false",               # re-queue for next iteration
]
delegate_pattern = "DELEGATE: <tier>:<datum>:<goal>"  # worker requests escalation

# ─── Stale-loop termination ───────────────────────────────────────────────────
[b00t.loop_control]
# @tribal: patience prevents infinite frontier token burn on stuck workers (ralphex pattern)
# After patience consecutive rounds with no PASS and no git commits → STALE + EXIT
loop_patience_default = 3   # override via env LOOP_PATIENCE=N in hive profile

# ─── Delegation contract ─────────────────────────────────────────────────────
[b00t.delegation_contract]
# @tribal: ALL four fields required for every sub-agent invocation (agentic-stack pattern)
# Worker MUST NOT receive injected diff/context — it fetches own context
required_fields = ["goal", "constraints", "return_format", "budget"]

[b00t.delegation_contract.budget_defaults]
tokens       = 8000
tool_calls   = 10
wall_time_s  = 60
max_depth    = 2   # 🤓 max nesting: frontier → ch0nky → sm0l; never 4 levels

# ─── Task schema extensions ───────────────────────────────────────────────────
[b00t.task_schema]
# @tribal: hash IDs prevent multi-agent merge conflicts on .b00t/tasks.json (beads pattern)
id_format      = "t-{sha256_hex6}"          # e.g. t-a3f2dd; progressive to 8 on collision
subtask_format = "{parent_id}.{N}"          # e.g. t-a3f2dd.1 (max depth 3)
extra_fields   = ["depends_on", "defer_until", "session_id", "closed_by"]

# ─── Parallel agent fan-out ───────────────────────────────────────────────────
[b00t.parallel_review]
# @tribal: each named agent fetches own diff; executive gates on ALL PASS (ralphex pattern)
named_agents   = ["quality", "implementation", "testing"]
gate_policy    = "all_pass"   # options: all_pass | majority | any_pass
prompt_dir     = "_b00t_/agents/"

# ─── Usage recipes ───────────────────────────────────────────────────────────
[[b00t.usage]]
description = "Emit a compliant delegation contract header before any sub-agent call"
command = """
cat <<EOF
[delegate]
goal        = "Run lint on changed files and return PASS/FAIL"
constraints = ["read-only", "no network"]
return_format = "SCORE: PASS|FAIL:<datum>:<result>\\nEXIT_SIGNAL: true|false"
budget      = { tokens = 8000, tool_calls = 10, wall_time_s = 60, max_depth = 2 }
EOF"""

[[b00t.usage]]
description = "Fan out named review agents in parallel; gate on all-pass"
command = "b00t agent delegate --agents=quality,implementation,testing --invoke=parallel"

[[b00t.usage]]
description = "List only unblocked ready tasks (deps satisfied + defer_until < now)"
command = "b00t task ready"

[[b00t.usage]]
description = "Add task with hash ID and optional parent for subtask hierarchy"
command = "b00t task add 'fix vllm config' --priority=1 --depends-on=t-a3f2dd"

[[b00t.usage]]
description = "Learn delegation language patterns"
command = "b00t learn delegation-language"

# b00t:map v1
# summary: abstract delegation protocol — contract, stale-termination, hash tasks, parallel fan-out
# tags: delegation, frontier, worker, protocol, stale, parallel, beads, ralphex, agentic-stack
# tier: frontier
# cmds: b00t learn delegation-language, b00t task ready, b00t agent delegate
# complexity: 5
