[b00t.learn]
content = """
## Chalk Interner Pattern

**Core split**: `Ty<I>(I::InternedTy)` is the HANDLE; `TyKind<I>` is the OPEN form (enum with all variants).
The `Interner` trait bridges them:

```rust
trait Interner {
    type InternedTy;                                   // opaque storage
    fn intern_ty(&self, data: &TyKind<Self>) -> Self::InternedTy;
    fn ty_data(data: &Self::InternedTy) -> &TyKind<Self>;
}
```

Consumers only see `Ty<I>` and call `.data()` — they never pick the storage strategy.
Embedder (rustc/tests) picks: arena-interned integers, `Box<TyKind>`, or `Arc`.

**Constraint**: `ty_data` needs no context → `InternedTy` must be pointer-like (`Box`, `&`).
To allow integer indices, change signature to `ty_data(&self, d) → &TyKind<Self>`.

## Mapping to b00t

| Chalk | b00t equivalent |
|---|---|
| `Ty<I>` | `Datum<S: DatumStore>` handle |
| `TyKind<I>` | `BootDatum` (open struct) |
| `Interner` | `DatumStore` trait |
| arena-interned | future: irontology graph store |
| `Box` strategy | current: `HashMap<String, BootDatum>` (eager) |
| integer index | future: SQLite rowid + lazy-load |

Current `get_all_datums()` = Box strategy: loads everything eagerly.
Chalk-style abstraction would let future stores be lazy (SQLite, Qdrant) without changing callers.

## FOL / Horn Clause connection

Chalk compiles Rust trait goals into Prolog-style Horn clauses:
`T: Trait` → `∀ T. (T: Trait) :- (clause_1 ∧ clause_2 ...)`
b00t's `compile_datum_triples` → `graph_rules::derive` → `find_adjacent` is the same pattern:
triples are Horn facts; rules derive new triples; DWIW fanout is the query engine.
"""

