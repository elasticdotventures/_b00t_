[b00t]
name = "crawl4ai-mcp"
type = "mcp"
hint = "MCP server"

# <|🦨: aspirational — companion .cli datum never authored; the .mcp datum is the tool surface; roadmap _b00t_#850, triage #163 |>
entangled_cli = ["crawl4ai-mcp.cli"]

[b00t.env]
CRAWL4AI_MCP_LOG = "INFO"

[[b00t.mcp.stdio]]
requires = ["docker"]
command = "docker"
transport = "stdio"
args = ["run", "--rm", "-i", "--volume", "./crawls:/app/crawls", "uysalsadi/crawl4ai-mcp-server:latest"]
priority = 0
