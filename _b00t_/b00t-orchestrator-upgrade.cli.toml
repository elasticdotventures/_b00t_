[b00t]
name = "b00t-orchestrator-upgrade"
type = "cli" 
hint = "Orchestrator upgrade path: TODO-next/b00t job → Azure AI Foundry for enterprise multi-agent systems"
depends_on = ["azure-ai-foundry.cli"]

install = '''
# 🤓 B00t Orchestrator Upgrade Guide
echo "🥾 B00t Orchestrator Evolution: TODO-next + b00t job → Azure AI Foundry"

cat << 'EOF'

╔══════════════════════════════════════════════════════════════════╗
║                     🥾 B00t Orchestrator Hierarchy               ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  📊 Simple Task Management:                                      ║
║     └─ TODO-next.md + b00t job (lightweight local workflows)    ║
║                                                                  ║  
║  🏢 Enterprise Multi-Agent Orchestration:                       ║
║     └─ Azure AI Foundry (Connected agents, sub-agent delegation)║
║                                                                  ║
║  🔄 Migration Path:                                              ║
║     TODO-next/b00t job → Azure AI Foundry when complexity increases ║
║                                                                  ║
╚══════════════════════════════════════════════════════════════════╝

ORCHESTRATION CAPABILITY MATRIX:

┌─────────────────┬──────────────┬─────────────────────┐
│ Capability      │ TODO/job     │ Azure AI Foundry    │
├─────────────────┼──────────────┼─────────────────────┤
│ Task Lists      │ ✅ Excellent │ ✅ Good             │
│ PRD Parsing     │ ✅ Good      │ ✅ Excellent        │
│ Single Agents   │ ✅ Good      │ ✅ Excellent        │  
│ Multi-Agents    │ ❌ Limited   │ ✅ Excellent        │
│ Sub-Agent Trees │ ❌ No        │ ✅ Max Depth 2     │
│ Stateful Flow   │ ❌ No        │ ✅ Enterprise       │
│ Enterprise Sec  │ ❌ Basic     │ ✅ Azure AD/RBAC   │
│ Observability   │ ❌ Limited   │ ✅ Comprehensive    │
│ Scalability     │ ❌ Local     │ ✅ Cloud-Native     │
└─────────────────┴──────────────┴─────────────────────┘

USE CASE RECOMMENDATIONS:

🎯 Use TODO-next + b00t job for:
   • Personal project tracking
   • Simple development workflows  
   • Prototyping and experimentation
   • Single-user task management
   • Basic PRD-to-task conversion

🏢 Use Azure AI Foundry for:
   • Customer service automation (support + billing + escalation agents)
   • Content creation workflows (research + writing + management)
   • Supply chain orchestration (multiple specialized agents)
   • Enterprise business process automation
   • Multi-tenant agent systems
   • Production-grade agent deployments

MIGRATION INDICATORS:

Upgrade to Azure AI Foundry when you need:
❗ Multiple specialized agents working together
❗ Hierarchical agent delegation (agents managing sub-agents)
❗ Stateful workflows that preserve context
❗ Enterprise security, audit, and compliance
❗ Cloud-scale agent deployments
❗ Integration with Azure enterprise services

EOF

# Check if user has a lightweight local backlog that could benefit from Foundry
if [ -f "TODO-next.md" ] || ls _b00t_/*.job.toml >/dev/null 2>&1; then
    echo ""
    echo "🔄 MIGRATION OPPORTUNITY DETECTED"
    echo "   Found TODO-next.md or b00t job workflows in current directory"
    echo "   Consider upgrading to Azure AI Foundry for:"
    echo "   • Connected agent workflows"
    echo "   • Enterprise security and scalability" 
    echo "   • Advanced orchestration patterns"
    echo ""
    echo "📚 Migration Guide: ~/.b00t/foundry-samples/migration"
fi

echo ""
echo "✅ Orchestrator upgrade guidance installed"
echo "💡 Next: Evaluate your use case complexity against the matrix above"
echo "🔧 Install Foundry: b00t cli install azure-ai-foundry"
'''

version = "echo 'Orchestrator Guide v1.0'"
version_regex = 'v(\d+\.\d+)'

[[b00t.usage]]
description = "Show orchestrator comparison matrix"
command = "b00t cli install b00t-orchestrator-upgrade"

[[b00t.usage]]
description = "Install Azure AI Foundry for enterprise orchestration"
command = "b00t cli install azure-ai-foundry"

[[b00t.usage]]
description = "Use local lightweight orchestration"
command = "printf '# TODO-next\\n\\n## Critical path\\n- [ ] First backlog item\\n' > TODO-next.md"

[b00t.learn]
topic = "orchestrator-hierarchy"
auto_digest = true
content = """
# B00t Orchestrator Hierarchy and Migration Strategy

## Orchestration Evolution Path

B00t recognizes different orchestration needs and provides tools for each level:

### Level 1: Lightweight Local Orchestration
**Tooling: TODO-next.md + b00t job**
- Basic backlog lists and project tracking
- Job definitions for repeatable workflows
- Single-user or small-team local execution
- Development and prototyping

### Level 2: Enterprise Multi-Agent Orchestration  
**Tool: Azure AI Foundry**
- Connected agents with hierarchical delegation
- Sub-agent specialization (max depth 2)
- Stateful workflows with context preservation
- Enterprise security, observability, scalability

## Migration Decision Framework

### Complexity Indicators

**Stay with TODO-next + b00t job when:**
- Working on personal projects
- Need simple task tracking
- Single developer workflows
- Prototype/experimental phase
- Basic PRD → task conversion

**Upgrade to Azure AI Foundry when:**
- Need multiple specialized agents
- Require agent-to-sub-agent delegation
- Building customer-facing automation
- Enterprise security requirements
- Production-scale deployments
- Complex business process automation

### Real-World Migration Examples

**Customer Support Evolution:**
```
TaskMaster: "Customer support task list"
     ↓ (complexity increases)
Azure AI Foundry: Support Coordinator → [Technical Agent, Billing Agent, Escalation Agent]
```

**Content Creation Evolution:**
```
TaskMaster: "Blog post tasks: research, write, publish"
     ↓ (workflow complexity increases)  
Azure AI Foundry: Content Workflow → [Collector Agent, Writer Agent, Manager Agent]
```

## Technical Migration Path

1. **Assessment**: Evaluate current TODO-next and b00t job usage patterns
2. **Planning**: Identify agent specialization opportunities
3. **Pilot**: Start with simple connected agents
4. **Scale**: Expand to full multi-agent workflows
5. **Optimize**: Leverage enterprise features (security, observability)

The key insight: TODO-next/b00t job and Azure AI Foundry serve different orchestration needs. Use the local backlog/job path for simplicity, migrate to Foundry when complexity demands connected agents and enterprise features.
"""
