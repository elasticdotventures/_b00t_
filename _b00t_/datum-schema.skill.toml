[b00t]
name = "datum-schema"
type = "skill"
hint = "Datum type taxonomy and field schema reference — the canonical types in _b00t_ ecosystem"

[b00t.skill]
depends_on = ["tomllm-format"]
unlocks = ["datum-authoring"]
description = """
Datum types (b00t datum_type / type field):
- skill — skill definitions with [b00t.skill]
- cli — CLI tool wrappers with [b00t.cli]
- mcp — MCP server definitions with [b00t.mcp]
- agent — sub-agent definitions with [b00t.agent]
- role — role definitions with skills, compliance, entanglements
- gate — governance gates with [gate] section
- schema — schema definitions for data protocols
- hardware — hardware capability descriptions

[b00t] required fields (all datums):
- name: unique identifier (kebab-case)
- type: one of the datum types above
- hint: ≤120 char human-readable description

Skill-specific fields ([b00t.skill]):
- depends_on: list of prerequisite skills/blessings
- unlocks: list of capabilities unlocked when loaded
- description: full description of the skill
- tags: keyword tags for search/discovery (NOT type_tags — deprecated)
- metadata: structured metadata sub-table

Tail-map format (# b00t:map v1):
- summary: one-line summary (≤120 chars)
- tags: comma-separated keywords
- tier: sm0l | ch0nky | frontier
- cmds: comma-separated relevant CLI commands
- complexity: 1-10 integer

Forbidden fields:
- [b00t.version] — use [b00t.schema] with schema version instead
- [b00t.type_tags] — use tags: [...] in tail-map instead
"""

# b00t:map v1
# summary: Datum type taxonomy — all supported datum types, required fields, forbidden patterns
# tags: datum, schema, type-taxonomy, reference
# tier: ch0nky
# cmds: b00t learn datum-schema
# complexity: 5
