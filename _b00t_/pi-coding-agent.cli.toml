# b00t CLI Datum — pi coding agent (@mariozechner/pi-coding-agent)
# 🤓 Lightweight AI coding assistant; supports local models via openai-completions API
# Wired as b00t hive sub-agent for sm0l/ch0nky tier tasks
# https://github.com/badlogic/pi-mono/

[b00t]
name = "pi-coding-agent"
type = "cli"
desires = "latest"
hint = "pi — lightweight AI coding agent; local model support via openai-completions; MCP via pi-mcp-adapter"
install = "npm install -g @mariozechner/pi-coding-agent"
update = "npm install -g @mariozechner/pi-coding-agent"
version = "pi --version"
version_regex = '([0-9]+\\.[0-9]+\\.[0-9]+)'

[b00t.env]
PI_CODING_AGENT_DIR = "~/.pi/agent"

[b00t.learn]
topic = "pi-coding-agent"
auto_digest = true

# ── Local Gemma-4 via openai-compatible vLLM ─────────────────────────────────
# 🤓 pi uses --provider llama-cpp + LLAMA_CPP_BASE_URL for local vLLM
[[b00t.usage]]
description = "Run pi with local Gemma 4 (requires vLLM serving on :8001)"
command = "LLAMA_CPP_BASE_URL=http://127.0.0.1:8001/v1 pi --provider llama-cpp --model ch0nky"

# ── Non-interactive (sub-agent usage) ────────────────────────────────────────
[[b00t.usage]]
description = "Delegate a coding task to pi sub-agent (non-interactive)"
command = "LLAMA_CPP_BASE_URL=http://127.0.0.1:8001/v1 pi -p --provider llama-cpp --model ch0nky 'implement X in Y'"

[[b00t.usage]]
description = "Install pi-mcp-adapter (enables MCP access from pi)"
command = "pi install npm:pi-mcp-adapter"

[[b00t.usage]]
description = "Probe available models from local vLLM endpoint"
command = "curl -s http://127.0.0.1:8001/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "Interactive pi with gemma4 + all tools"
command = "LLAMA_CPP_BASE_URL=http://127.0.0.1:8001/v1 pi --provider llama-cpp --model ch0nky"

[validate]
command = "pi --version"
regex = "[0-9]+"

[roles]
required_for = ["local-inference", "sub-agent"]
optional_for = ["developer", "hive"]

# b00t:map v1
# summary: pi-coding-agent CLI datum — local LLM sub-agent with MCP via pi-mcp-adapter
# tags: pi, coding-agent, sub-agent, local-llm, gemma4, mcp
# tier: ch0nky
# cmds: LLAMA_CPP_BASE_URL=http://127.0.0.1:8001/v1 pi --provider llama-cpp --model ch0nky -p "task"
# complexity: 4
