# b00t CLI Datum — pi coding agent (@earendil-works/pi-coding-agent)
# 🤓 CANONICAL datum for the `pi` BINARY ONLY: install / update / version.
#    Nothing else may duplicate these fields. The agent facet (pi.agent.toml)
#    depends_on this datum instead of re-declaring it.
#
# 🤓 package: @earendil-works/pi-coding-agent (0.85.1+ verified; 1.1.0 installed 2026-10-13).
#    install/update are self-contained npm commands — no justfile delegation.
#    (~/.dotfiles is a bare repo; _b00t_/pi-agent.just does NOT exist on disk.)
#
# 🔗参 pi.polyseme.toml          → "pi" branch point (all five facets)
# 🔗参 pi-agent.justfile.toml    → executable command surface
# 🔗参 pi-mcp-adapter.cli.toml   → MCP client extension (separate concern)
# https://github.com/earendil-works/pi-mono / https://pi.dev/docs/latest/extensions

[b00t]
name = "pi-coding-agent"
type = "cli"
desires = "stable"
version_min = "0.85.0"
hint = "pi — lightweight AI coding agent; local model support via openai-completions; MCP via pi-mcp-adapter"
# 🤓 Self-contained: npm install is cwd-independent and doesn't require a justfile on disk.
install = "npm install -g @earendil-works/pi-coding-agent@latest"
update = "npm install -g @earendil-works/pi-coding-agent@latest"
# 🤓 version/version_regex are canonical HERE — pi.agent must not re-declare them.
version = "pi --version"
version_regex = "([0-9]+\\.[0-9]+\\.[0-9]+)"
aliases = ["pi"]
# 🤓 pi IS installable as a cli — but it is an agent HARNESS, not a conventional
#    CLI. `type_tags` is the queryable trait mechanism (b00t whoami --tag-count,
#    datum_proof trait resolution), so tag the harness rather than inventing a
#    DatumType. Same convention as datums/openharness.tomllmd.
#    "The model is the agent. The code is the harness."
type_tags = ["agent-harness", "coding-agent", "mcp-client", "sub-agent", "extension-host"]
# ⚠️需 INVARIANT: exactly ONE cli datum for pi. pi.agent is the hive-agent facet
#    and must never re-declare install/update/version — it depends_on this datum.
#    Two installable datums sharing name="pi" would make `b00t install pi`
#    nondeterministic (install_datum picks the first installable HashMap match).

[b00t.env]
PI_CODING_AGENT_DIR = "~/.pi/agent"

[b00t.learn]
topic = "pi-coding-agent"
auto_digest = true

# ── Local ch0nky via custom llama-cpp provider in ~/.pi/agent/models.json ───
# 🤓 verified 2026-04-30: ~/.pi/agent/models.json MUST use apiKey=local-b00t for the qwen36 ch0nky slot
[[b00t.usage]]
description = "Install or update the pi binary"
command = "npm install -g @earendil-works/pi-coding-agent@latest"

# ── Non-interactive (sub-agent usage) ────────────────────────────────────────
[[b00t.usage]]
description = "Verify the installed pi version"
command = "pi --version"

[[b00t.usage]]
description = "List pi's model registry (optionally fuzzy-filtered)"
command = "pi list-models neo-coder"

[[b00t.usage]]
description = "Probe the sm3lly OpenAI-compatible endpoint"
command = "curl -s http://sm3lly.lan:8002/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "List the local ch0nky model from pi's model registry"
command = "pi --list-models ch0nky"

[validate]
command = "pi --version"
regex = "[0-9]+"

# ── Equivalence pointers ─────────────────────────────────────────────────────
entangled_agents = ["pi.agent"]
entangled_cli = ["pi-mcp-adapter.cli", "just.cli"]
entangled_mcp = ["b00t-mcp.mcp"]
depends_on = ["node.cli"]

[roles]
required_for = ["local-inference", "sub-agent"]
optional_for = ["developer", "hive"]

# b00t:map v1
# summary: pi-coding-agent CLI datum — canonical install/version for the pi binary (@earendil-works package)
# tags: pi, coding-agent, sub-agent, local-llm, neo-coder, sm3lly, cli, canonical
# tier: ch0nky
# cmds: npm install -g @earendil-works/pi-coding-agent@latest, pi --version, pi list-models neo-coder
# complexity: 3
