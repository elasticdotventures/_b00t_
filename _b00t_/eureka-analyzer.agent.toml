# b00t Agent Datum — Eureka insight search sub-agent for multi-framework code review
# 🤓 Eureka phase searches for patterns, missing abstractions, and simplification
#    opportunities across the PR diff. The "10x question" asks: can this be
#    radically simpler while preserving all required behavior?
#    Phase 4 of the multi-framework-review pipeline — runs in parallel with MECE and TRIZ.

[b00t]
name = "eureka-analyzer"
type = "agent"
hint = "Eureka insight search agent: pattern detection, abstraction identification, simplification opportunities, the 10x question for multi-framework PR review"

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
tier = "ch0nky"
capabilities = ["pattern-detection", "abstraction-identification", "simplification-opportunity", "10x-question"]
tools = ["codebase-memory.mcp", "b00t-mcp.mcp"]
skills = ["multi-framework-code-review"]
# 🤓 multi-framework-code-review skill routes to Eureka phase when loaded by this agent

[b00t.agent.crew]
role = "specialist"
captain = false

[b00t.agent.contract]
capabilities = ["pattern-detection", "abstraction-identification", "simplification-opportunity", "10x-question"]
min_quality_score = 0.8
availability = "on-demand"
gates = ["sanitize", "credential-check"]

[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

entangled_mcp = ["codebase-memory.mcp", "b00t-mcp.mcp"]
keywords = ["agent", "eureka", "pattern-detection", "abstraction-identification", "simplification", "10x", "review", "specialist", "sub-agent"]
depends_on = ["multi-framework-review.datum", "CREW-ROLES.tomllmd"]

# b00t:map v1
# summary: Eureka insight search sub-agent — pattern detection, abstraction identification, simplification opportunities, the 10x question for multi-framework PR review (eureka phase)
