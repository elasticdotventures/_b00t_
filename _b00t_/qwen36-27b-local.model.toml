# b00t AI Model Datum - Qwen3.6-27B local via vLLM GGUF or llamacpp podman
# RTX 3090 24GB VRAM: Q4_K_M ~15GB VRAM fits with headroom for KV cache
# HF download: b00t hive activate download-mode FIRST (stops vllm; frees RAM)
# then: hf download unsloth/Qwen3.6-27B-GGUF --include "Qwen3.6-27B-Q4_K_M.gguf"
# Replaces gemma4 as ch0nky tier — gemma4 GGUF unsupported in vLLM (unknown dtype)

[b00t]
name    = "qwen36-27b-local"
type    = "model"
hint    = "Qwen3.6-27B GGUF served locally on port 8001; ch0nky tier; vLLM primary, llamacpp podman fallback"
aliases = ["qwen36", "qwen3.6-27b", "ch0nky-q36"]

[b00t.env]
# 🤓 VLLM_MODEL_DIR → used by `b00t model download` as --local-dir target (flat layout)
VLLM_MODEL_DIR       = "~/.cache/huggingface/hub/models--unsloth--Qwen3.6-27B-GGUF"
OPENAI_BASE_URL      = "http://127.0.0.1:8001/v1"
OPENAI_API_KEY       = "local-b00t"
B00T_AI_CH0NKY_BASE  = "http://127.0.0.1:8001/v1"
B00T_AI_CH0NKY_MODEL = "ch0nky"

[ai_model]
provider       = "openai_compatible"
size           = "large"
capabilities   = ["chat", "code", "reasoning", "tool_use"]
litellm_model  = "openai/ch0nky"
api_base       = "http://127.0.0.1:8001/v1"
api_key_env    = "OPENAI_API_KEY"
rpm_limit      = 60
context_window = 32768
enabled        = true
access_groups  = ["default", "local", "ch0nky"]

[ai_model.parameters]
max_tokens  = 8192
temperature = 0.6
# 🤓 Qwen3 uses thinking tokens; temperature 0.6 recommended by Qwen team for reasoning

[ai_model.metadata]
hf_repo        = "unsloth/Qwen3.6-27B-GGUF"
allow_patterns = "Qwen3.6-27B-Q4_K_M.gguf"
# 🤓 Q4_K_M ≈ 15GB VRAM; leaves ~9GB headroom on RTX 3090 for KV cache + OS
# 🤓 Q6_K ≈ 21GB VRAM — viable but tight; prefer Q4_K_M for concurrent dev work
gguf_file      = "Qwen3.6-27B-Q4_K_M.gguf"
# 🤓 vLLM GGUF requires --tokenizer arg (GGUF embeds no tokenizer); use base model id
tokenizer_repo = "Qwen/Qwen3-27B"
runtime        = "vllm-gguf"
fallback       = "llamacpp-podman"
gpu            = "rtx3090"
port           = 8001

# ─── Download recipe ─────────────────────────────────────────────────────────
[[b00t.usage]]
description = "1. Switch to download-mode (stops vllm, frees 24GB VRAM + RAM)"
command     = "b00t hive activate download-mode"

[[b00t.usage]]
description = "2. Download Qwen3.6-27B Q4_K_M GGUF via hf CLI"
command     = "hf download unsloth/Qwen3.6-27B-GGUF --include 'Qwen3.6-27B-Q4_K_M.gguf'"
# 🤓 hf CLI (huggingface_hub) caches to ~/.cache/huggingface/hub/
# 🤓 guard: huggingface-cli is deprecated → hf download (set in hive-guards)

[[b00t.usage]]
description = "3a. Serve via vLLM (preferred if Qwen3 arch loads cleanly)"
command     = "b00t hive activate inference-qwen36-27b"

[[b00t.usage]]
description = "3b. Serve via llamacpp podman (fallback — always works with GGUF)"
command     = "b00t hive activate inference-qwen36-27b-llamacpp"

[[b00t.usage]]
description = "4. Verify endpoint"
command     = "curl -s http://localhost:8001/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "Monitor download progress"
command     = "watch -n 30 'ls -lh ~/.cache/huggingface/hub/models--unsloth--Qwen3.6-27B-GGUF/blobs/'"

