# skill.source.toml — remote skill index sources for SkillResolver
# 🤓 Sources are declared here for future `--remote` support; not fetched on startup
# 🤓 Each [[source]] entry declares a remote repo with a known skill layout
# 💡例 b00t skill search "rust"    → local only (fast, no network)
# 💡例 b00t skill list             → lists all locally resolved skills

[b00t]
name = "skill-sources"
type = "config"
hint = "Remote skill index registry — declares external skill repos for SkillResolver"

[[b00t.usage]]
description = "Search skills locally (no network)"
command = "b00t skill search <query>"

[[b00t.usage]]
description = "List all available skills"
command = "b00t skill list"

# --- Remote Skill Sources ---

[[source]]
name = "agentskills-official"
description = "Official agentskills.io reference library"
url = "https://github.com/agentskills/agentskills"
# 🤓 skills-ref/ subdir contains SKILL.md skill dirs
skills_dir = "skills-ref"
format = "skill-md"
enabled = true

[[source]]
name = "psiace-skills"
description = "PsiACE curated skills (rust, python, go)"
url = "https://github.com/PsiACE/skills"
skills_dir = "skills"
format = "skill-md"
enabled = true

[[source]]
name = "anthropic-skills"
description = "Anthropic official Claude Code skills"
url = "https://github.com/anthropics/skills"
skills_dir = "."
format = "skill-md"
enabled = true

[[source]]
name = "karpathy-guidelines"
description = "Andrej Karpathy-inspired LLM coding guidelines"
url = "https://github.com/forrestchang/andrej-karpathy-skills"
skills_dir = "."
format = "skill-md"
enabled = false  # single CLAUDE.md, not a skills dir — use manually

# b00t:map v1
# summary: remote skill index registry — lazy-fetch sources for future b00t skill search --remote
# tags: skill, remote, agentskills, registry
# tier: sm0l
# cmds: b00t skill search <query>, b00t skill list
# complexity: 2
