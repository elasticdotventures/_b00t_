[b00t]
name = "claude-code-hooks"
hint = "b00t hook dispatcher registration for claude-code. Apply via: b00t learn claude-code-hooks"

# 🤓 Paste hookSettings into ~/.claude/settings.json [hooks] section,
#    OR into .claude/settings.local.json for per-project scope.
#    dispatch.sh handles all events; deduplication means one registration per event is safe.

[b00t.hookSettings]
# Minimal registration: all events → b00t dispatcher
# Extend matcher per-event to filter noise (e.g. only Bash for PreToolUse)
_example_json = '''
{
  "hooks": {
    "SessionStart": [
      {
        "hooks": [{ "type": "command", "command": "~/.b00t/_b00t_/agent-hooks/dispatch.sh" }]
      }
    ],
    "PreToolUse": [
      {
        "matcher": ".*",
        "hooks": [{ "type": "command", "command": "~/.b00t/_b00t_/agent-hooks/dispatch.sh", "timeout": 30 }]
      }
    ],
    "PostToolUse": [
      {
        "matcher": ".*",
        "hooks": [{ "type": "command", "command": "~/.b00t/_b00t_/agent-hooks/dispatch.sh", "timeout": 30 }]
      }
    ],
    "SubagentStart": [
      {
        "matcher": ".*",
        "hooks": [{ "type": "command", "command": "~/.b00t/_b00t_/agent-hooks/dispatch.sh" }]
      }
    ],
    "SubagentStop": [
      {
        "matcher": ".*",
        "hooks": [{ "type": "command", "command": "~/.b00t/_b00t_/agent-hooks/dispatch.sh", "timeout": 60 }]
      }
    ]
  }
}
'''

