# b00t Agent Datum — pi-coding-agent as first-class hive sub-agent
# 🤓 pi is a lightweight coding agent (~200 token MCP overhead via pi-mcp-adapter)
#    Wired to local Gemma 4 26B-A4B via llama-cpp provider (port 8001)
#    Acts as ch0nky executor — implement, refactor, debug tasks
#    MCP tools available via pi-mcp-adapter (b00t-mcp lazy-loaded)

[b00t]
name = "pi"
type = "agent"
hint = "pi coding agent — ch0nky tier executor; local Gemma 4 via llama-cpp; MCP via pi-mcp-adapter"

[b00t.agent]
pid = "pi-001"
branch = "main"
# 🤓 pi targets liter-llm gateway at :1234; "ch0nky" model routed to Gemma 4 at :8001
#    Cost accounting and provider routing handled by liter-llm/mistralrs-proxy
model = "ch0nky"
skills = ["code", "refactor", "debug", "edit", "bash", "read", "write", "grep", "find", "ls"]
personality = "pragmatic"
humor = "low"
role = "specialist"

[b00t.agent.ipc]
# 🤓 pi is invoked via CLI subprocess, not a persistent daemon; socket unused
socket = "/tmp/b00t/agents/pi.sock"
pubsub = false
protocol = "json"

[b00t.agent.crew]
role = "specialist"
captain = false

[b00t.agent.executor]
# 🤓 pi -p targets vLLM directly at :8001 (liter-llm/:1234 not required)
#    2imi9/gemma-4-E4B-it-NVFP4A16 served as ch0nky; --enforce-eager avoids RTX3090 deadlock
#    tool calls work: pi emits JSON tool_code blocks; caller must exec them (agentic loop)
cli_path = "pi"
cli_args = ["-p", "--provider", "llama-cpp", "--model", "ch0nky"]
supports_tools = ["read", "bash", "edit", "write", "grep", "find", "ls"]
max_iterations = 10
requires = ["pi", "b00t@inference-gemma4.service"]
hive_profile = "inference-gemma4"

[b00t.agent.mcp]
# pi accesses MCP via pi-mcp-adapter (lazy proxy); not a standalone MCP server
enabled = false
# 🤓 MCP servers available to pi defined in ~/.pi/agent/mcp.json

[b00t.env]
AGENT_ID = "pi"
AGENT_SKILLS = "code,refactor,debug,edit,bash"
PI_CODING_AGENT_DIR = "~/.pi/agent"
# 🤓 pi consumes liter-llm gateway at :1234; "ch0nky" routes to Gemma 4 at :8001
#    Same endpoint used by moltis — shared cost accounting via liter-llm
PI_MODEL = "ch0nky"
# 🤓 :8001 = vLLM direct; :1234 = liter-llm gateway (optional, not required for pi)
OPENAI_BASE_URL = "http://127.0.0.1:8001/v1"
OPENAI_API_KEY = "local-gemma4"

# b00t:map v1
# summary: pi coding agent — ch0nky executor via Gemma 4 local LLM, MCP via pi-mcp-adapter
# tags: pi, agent, gemma4, local-llm, ch0nky, specialist, mcp-adapter
# tier: ch0nky
# cmds: OPENAI_BASE_URL=http://127.0.0.1:8001/v1 OPENAI_API_KEY=local-gemma4 pi -p --provider llama-cpp --model ch0nky
# complexity: 5
