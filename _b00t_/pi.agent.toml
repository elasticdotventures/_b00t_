# b00t Agent Datum — pi-coding-agent as first-class hive sub-agent
# 🤓 pi is managed as a systemd --user service (b00t hive pattern)
#    pi --mode rpc runs as a persistent RPC/stdio server; b00t generates the unit
#    Activate: systemctl --user start b00t@pi-agent.service
#    Swap:     systemctl --user stop b00t@pi-agent && systemctl --user start b00t@opencode-agent
#    MCP tools available via pi-mcp-adapter (b00t-mcp lazy-loaded)
# https://shittycodingagent.ai/ / https://github.com/badlogic/pi-mono

[b00t]
name = "pi"
type = "agent"
desires = "latest"
hint = "pi coding agent — systemd-managed RPC server; ch0nky tier; swap with opencode via hive stop/start"
install = "npm install -g @mariozechner/pi-coding-agent@latest"
update = "npm install -g @mariozechner/pi-coding-agent@latest"
version = "pi --version"
version_regex = "([0-9]+\\.[0-9]+\\.[0-9]+)"

[b00t.agent]
pid = "pi-001"
branch = "main"
# 🤓 ch0nky is a logical local big-model slot on :8001. As of 2026-04-30 the verified path is qwen36-local/ch0nky via llama.cpp.
model = "ch0nky"
skills = ["code", "refactor", "debug", "edit", "bash", "read", "write", "grep", "find", "ls"]
personality = "pragmatic"
humor = "low"
role = "specialist"

[b00t.agent.executor]
# 🤓 cli_path must be on PATH; pi --mode rpc is the persistent path; this is one-shot fallback via handle_invoke
cli_path = "pi"
cli_args = ["-p", "--provider", "llama-cpp", "--model", "ch0nky"]
supports_tools = ["read", "write", "bash", "grep", "ls"]
max_iterations = 10
requires = ["b00t-hive-inference-qwen36-35b-a3b-llamacpp.service"]
# hive_profile activates the currently preferred ch0nky local model before invocation
hive_profile = "inference-qwen36-35b-a3b-llamacpp"

[b00t.agent.ipc]
# 🤓 pi --mode rpc exposes stdio RPC; pi-mcp-adapter bridges to MCP clients
socket = "/tmp/b00t/agents/pi.sock"
pubsub = false
protocol = "rpc+stdio"

[b00t.agent.crew]
role = "specialist"
captain = false

[b00t.agent.mcp]
# 🤓 pi-mcp-adapter bridges pi RPC → MCP; servers defined in ~/.pi/agent/mcp.json
enabled = true

# ── Inline service spec — b00t generates this unit dynamically ───────────────
# 🤓 b00t@pi-agent.service → `pi --mode rpc` persistent RPC daemon
#    pi-mcp-adapter must be installed: `pi install npm:pi-mcp-adapter`
#    Swap pattern: stop this unit, start b00t@opencode-agent.service — same ch0nky slot
[b00t.hive.service]
description = "pi coding agent RPC server — ch0nky tier (pi-mcp-adapter)"
service_type = "simple"
restart = "on-failure"
restart_sec = "10s"
timeout_start_sec = "60"
after = ["network.target", "b00t-hive-inference-qwen36-35b-a3b-llamacpp.service"]
environment = [
  "PATH=/home/brianh/.nvm/versions/node/v22.15.1/bin:/usr/local/bin:/usr/bin:/bin",
  "LLAMA_CPP_BASE_URL=http://127.0.0.1:8001/v1",
  # 🤓 OPENAI_API_KEY sourced from .env / CMDB; local llama.cpp proxy accepts any non-empty string
  "OPENAI_API_KEY=${OPENAI_API_KEY:-local-b00t}",
]
exec_start = "pi --mode rpc --provider llama-cpp --model ch0nky"

[b00t.hive.resources]
ram_gb = 1
gpu_mb = 0
cpu_cores = 1

[b00t.hive.resources.gate]
ram_free_gb = 1
gpu_free_mb = 0

[b00t.hive.exclusion]
# 🤓 only one ch0nky coding-agent service active at a time; pi and opencode are mutually exclusive
group = "ch0nky-coding-agent"
priority = 50

[b00t.env]
AGENT_ID = "pi"
AGENT_SKILLS = "code,refactor,debug,edit,bash"
PI_CODING_AGENT_DIR = "~/.pi/agent"
PI_MODEL = "ch0nky"
LLAMA_CPP_BASE_URL = "http://127.0.0.1:8001/v1"
# 🤓 OPENAI_API_KEY falls back to "local-b00t"; override via .env / CMDB for non-local deployments
OPENAI_API_KEY = "${OPENAI_API_KEY:-local-b00t}"

[[b00t.usage]]
description = "Start pi agent service (b00t hive)"
command = "systemctl --user start b00t@pi-agent.service"

[[b00t.usage]]
description = "Install or update pi to latest published version"
command = "npm install -g @mariozechner/pi-coding-agent@latest"

[[b00t.usage]]
description = "Verify the installed pi version"
command = "pi --version"

[[b00t.usage]]
description = "Verify the local ch0nky model is registered in pi"
command = "pi --list-models ch0nky"

[[b00t.usage]]
description = "Repair ~/.pi/agent/models.json for the current local qwen36 API key"
command = "sed -i 's/local-gemma4/local-b00t/g' ~/.pi/agent/models.json && sed -n '1,120p' ~/.pi/agent/models.json"

[[b00t.usage]]
description = "Probe the local ch0nky model through pi (verified 2026-04-30)"
command = "pi -p --provider llama-cpp --model ch0nky 'Reply with READY and the model alias only.'"

[[b00t.usage]]
description = "Stop pi agent service"
command = "systemctl --user stop b00t@pi-agent.service"

[[b00t.usage]]
description = "Swap from opencode to pi (same ch0nky slot)"
command = "systemctl --user stop b00t@opencode-agent.service && systemctl --user start b00t@pi-agent.service"

[[b00t.usage]]
description = "Connect to pi RPC server via pi-mcp-adapter (from another agent)"
command = "b00t mcp install pi-mcp-adapter claudecode"

