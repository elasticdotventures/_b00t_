# b00t:map v1
# summary: Canonical b00t capability registry — single source of truth for agent skill/capability declarations. Install recipes read from here to patch harness-specific configs (opencode, claude-code, hermes). Never edit harness JSON directly — use `just reviewer install-opencode` or `just capability-install <harness>`.
# tags: capability, registry, agent, skill, subagent, harness, install, canonical
# tier: frontier
# cmds: just reviewer install-opencode, just capability-install opencode, just capability-list
# complexity: 6

# ── Canonical Capability Registry ────────────────────────────────────────────
# This file is the SINGLE SOURCE OF TRUTH for b00t agent capabilities.
# Harness-specific configs (opencode agent-metadata.json, claude-code settings.json,
# hermes config.yaml) are PATCH TARGETS — never edit them directly.
# Install recipes read from this registry and apply idempotent patches.

[registry]
version = "1.0.0"
description = "Canonical b00t agent capability registry"

# ── Reviewer capability set ──────────────────────────────────────────────────

[[registry.capabilities]]
id = "b00t-reviewer"
name = "B00tReviewer"
type = "subagent"
tier = "frontier"
category = "code"
description = "Multi-framework code review — MECE+TRIZ+Eureka with cross-framework synthesis"
skills = ["b00t-integration"]
depends_on = ["mece-analyzer", "triz-analyzer", "eureka-analyzer", "synthesis-agent"]

[[registry.capabilities]]
id = "mece-analyzer"
name = "MeceAnalyzer"
type = "subagent"
tier = "ch0nky"
category = "code"
description = "MECE structural decomposition — mutually exclusive, collectively exhaustive categories"
mcp_tools = ["codebase-memory"]

[[registry.capabilities]]
id = "triz-analyzer"
name = "TrizAnalyzer"
type = "subagent"
tier = "ch0nky"
category = "code"
description = "TRIZ contradiction analysis — inventive principles, false contradiction flagging"
mcp_tools = ["codebase-memory", "context7"]

[[registry.capabilities]]
id = "eureka-analyzer"
name = "EurekaAnalyzer"
type = "subagent"
tier = "ch0nky"
category = "code"
description = "Eureka insight search — pattern detection, simplification, 10x question"
mcp_tools = ["codebase-memory"]

[[registry.capabilities]]
id = "synthesis-agent"
name = "SynthesisAgent"
type = "subagent"
tier = "ch0nky"
category = "code"
description = "Cross-framework triangulation — consolidate MECE+TRIZ+Eureka findings"
mcp_tools = ["b00t-mcp", "github"]

# ── Harness target specifications ────────────────────────────────────────────

[[registry.harnesses]]
id = "opencode-b00t"
target_file = "vendor/opencode-b00t/.opencode/agent-metadata.json"
target_type = "json"
patch_strategy = "merge-agents"
install_recipe = "just reviewer install-opencode"

[[registry.harnesses]]
id = "claude-code"
target_file = "~/.claude/settings.json"
target_type = "json"
patch_strategy = "merge-hooks"
install_recipe = "just reviewer install-hooks"

# ── Install recipe: b00t-cli capability-install ──────────────────────────────
# Planned: `b00t-cli capability install <harness>` reads this registry
# and applies the patch for the specified harness.
# Until then, use the harness-specific just recipes.
