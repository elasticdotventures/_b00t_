[b00t]
name = "podman-mcp-server"
type = "mcp"
hint = "Go-based MCP server exposing Podman/Docker runtimes over stdio or SSE transports."
desires = "latest"
depends_on = ["go.cli"]
lfmf_category = "podman-mcp"
install = { go = "github.com/elasticdotventures/podman-mcp-server/cmd/podman-mcp-server@latest" }
update = '''
# Update to the latest published version
GO111MODULE=on go install github.com/elasticdotventures/podman-mcp-server/cmd/podman-mcp-server@latest
'''
version = "podman-mcp-server --version"
version_regex = '(\\d+\\.\\d+\\.\\d+.*)'

[b00t.learn]
topic = "podman-mcp-server"
auto_digest = false

[[b00t.mcp.stdio]]
transport = "stdio"
command = "podman-mcp-server"

[[b00t.references]]
name = "GitHub: elasticdotventures/podman-mcp-server"
url = "https://github.com/elasticdotventures/podman-mcp-server"

[[b00t.references]]
name = "Model Context Protocol"
url = "https://modelcontextprotocol.io/specification/2025-11-25"

[[b00t.usage]]
description = "Install via Go toolchain"
command = "GO111MODULE=on go install github.com/elasticdotventures/podman-mcp-server/cmd/podman-mcp-server@latest"

[[b00t.usage]]
description = "Run stdio transport locally"
command = "podman-mcp-server"

[[b00t.usage]]
description = "Run SSE transport on port 8849"
command = "podman-mcp-server --sse-port 8849"

[[b00t.usage]]
description = "Register with Claude Desktop (stdio)"
command = "claude mcp add podman -- podman-mcp-server"

[[b00t.usage]]
description = "Register with Codex CLI (stdio)"
command = "codex mcp add podman -- podman-mcp-server"
