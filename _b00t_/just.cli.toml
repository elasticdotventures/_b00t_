[b00t]
name = "just"
type = "cli"
desires = "1.53.0"
install = '''
curl -sSL https://just.systems/install.sh | bash -s -- --to ~/.local/bin
'''
update = '''
# can be omitted if the install command is same
curl -sSL https://just.systems/install.sh | bash -s -- --to ~/.local/bin --force
'''
version = "just --version"
version_regex = '\d+\.\d+\.\d+'
hint = "just is a command runner that abstracts cli tools for a repo without reading the docs. run `just -l` to list commands."
unlocks = ["just *", "just-*"]
lfmf_category = "just"

# 🤓 Maintenance: deterministic version-check automation
#    `b00t cli up --maintenance` runs check_command, compares output to desires,
#    and auto-updates desires if a newer semver is found. No LLM involved.
[b00t.maintenance]
check_interval_days = 14
check_command = "curl -sL https://api.github.com/repos/casey/just/releases/latest | jq -r '.tag_name // empty' | sed 's/^v//'"
version_source = "github:casey/just"
check_regex = "(\\d+\\.\\d+\\.\\d+)"

# 🤓 Core requirement: b00t requires just; b00t-lite.sh auto-installs this
required_for_core = true

[b00t.learn]
topic = "just"
auto_digest = true

[[b00t.usage]]
description = "List all recipes in current directory"
command = "just -l"

[[b00t.usage]]
description = "Run a specific recipe"
command = "just <recipe-name>"

[[b00t.usage]]
description = "List recipes with working directory"
command = "just --list --list-prefix '> '"

[[b00t.usage]]
description = "Run recipe with dotenv"
command = "just --dotenv .env.local deploy"

[validate]
command = "just --version"
regex = "\\d+\\.\\d+\\.\\d+"

[roles]
required_for = ["developer", "orchestrator"]
optional_for = ["analyst"]
