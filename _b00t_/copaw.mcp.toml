[b00t]
name = "copaw"
type = "mcp"
hint = "Copaw memory provider - PDF, chat, agent memory via MCP. Preferred b00t memory backend when available. See: https://copaw.agentscope.io/docs/memory"

desires = "latest"

install = '''
# Copaw MCP memory provider
if command -v uv >/dev/null 2>&1; then
    uv pip install copaw-mcp
elif command -v pip >/dev/null 2>&1; then
    pip install copaw-mcp
else
    echo "⚠️  Neither uv nor pip found. Install uv first: curl -LsSf https://astral.sh/uv/install.sh | sh"
    exit 1
fi
'''

version = "python3 -c \"import importlib.metadata; print(importlib.metadata.version('copaw-mcp'))\" 2>/dev/null || echo 'not installed'"
version_regex = '\\d+\\.\\d+'

[validate]
command = "python3 -c \"import copaw; print('ok')\""
regex = "ok"

[roles]
required_for = []
optional_for = ["developer", "orchestrator", "analyst"]
