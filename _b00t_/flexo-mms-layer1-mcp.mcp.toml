# 🤓: open-mbee/flexo-mms-layer1-mcp (Python, FastMCP, Apache-2.0). Verified
# against the repo's own README 2026-08-22, not assumed. This is a real,
# published MCP server maintained by the Open-MBEE org itself -- b00t doesn't
# need to write an adapter, only register it.
#
# Wraps the MMS5 Layer1 REST API (orgs/repos/branches/models/SPARQL/
# locks/diffs/ACL). READ_ONLY=true by default -- only read/query tools
# register; set false to enable create/update/delete tools.
# Auth is passthrough: forwards the caller's Authorization header straight
# to MMS_URL, no credentials baked into this datum.
# Transport: FastMCP streamable-HTTP, server listens on 0.0.0.0:8000.
#
# REQUIRES A RUNNING FLEXO MMS BACKEND -- this MCP server is a thin proxy,
# not the model store itself. Deployed and verified end-to-end 2026-08-22:
# openldap -> quad-store (Apache Jena Fuseki, host port 3030) -> minio (host
# 9010, remapped from 9000 due to a local port conflict) -> auth-service
# (host 8092, remapped from 8082, same reason) -> store-service (8081) ->
# layer1-service (8080, this is MMS_URL, unmapped/default). Real SPARQL
# COUNT query against quad-server's /ds/sparql returned real results; a real
# MCP `initialize` handshake against this server (built from
# open-mbee/flexo-mms-layer1-mcp's own Dockerfile) succeeded end-to-end
# through layer1-service into the live quadstore. Two of the six containers
# (quad-server, and this MCP server itself) needed to run outside
# podman-compose on this host: quad-server hit a JDK cgroup-metrics NullPointerException
# under rootless podman (Fuseki's Prometheus metrics init calls
# jdk.internal.platform.Container.metrics(), which NPEs without --cgroupns=host --
# a flag podman-compose 1.5.0 has no compose-key for), and this MCP server's
# default host port 8000 was already bound by an unrelated local process.
[[b00t.mcp.httpstream]]
url = "http://127.0.0.1:8010/mcp"
transport = "httpstream"
priority = 0
requires = ["docker"]
requires_auth = false

[b00t.mcp.httpstream.env]
MMS_URL = "http://127.0.0.1:8080"
READ_ONLY = "true"

[[b00t.gate]]
rhai = "command_exists(\"docker\")"
hint = "docker required to build/run flexo-mms-layer1-mcp"

[[b00t.gate]]
env = "MMS_URL"
hint = "MMS_URL must point at a running Flexo MMS Layer1 service (default http://127.0.0.1:8080) -- see references for the docker-compose stack that provides one"

[[b00t.usage]]
description = "Clone and build the MCP server image"
command = "gh repo clone open-mbee/flexo-mms-layer1-mcp && cd flexo-mms-layer1-mcp && docker build -t flexo-mms-layer1-mcp ."

[[b00t.usage]]
description = "Run read-only against an existing Flexo MMS backend"
command = "docker run -d -p 8000:8000 -e MMS_URL=http://127.0.0.1:8080 -e READ_ONLY=true flexo-mms-layer1-mcp"

[[b00t.usage]]
description = "Bring up the full 5-container reference Flexo MMS backend (ldap/quad-store/minio/auth/store/layer1) for local dev"
command = "gh repo clone open-mbee/flexo-mms-deployment && cd flexo-mms-deployment/docker-compose && docker compose up"

