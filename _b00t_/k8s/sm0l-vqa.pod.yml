# b00t-sm0l-vqa: Qwen3-VL-4B-Instruct vision-language pod — sm0l VQA tier
# 🤓 Start: podman kube play _b00t_/k8s/sm0l-vqa.pod.yml
# 🤓 Stop:  podman kube down _b00t_/k8s/sm0l-vqa.pod.yml
# 🤓 Port 8002/v1 — OpenAI-compatible multimodal API. Model alias: sm0l-vqa
# 🤓 Q4_K_M weights ~2.5GB + mmproj Q8 ~0.6GB + KV@8k → ~4GB VRAM; coexists
#    with the resident ch0nky (b00t-sm0l, :8001, ~19GB) on RTX 3090 24GB —
#    no eviction needed. app4dog characterize stage consumer (common-core#4).
# 🤓 GPU: nvidia-container-runtime via io.podman.annotations
apiVersion: v1
kind: Pod
metadata:
  name: b00t-sm0l-vqa
  labels:
    app: b00t
    tier: sm0l
    model: qwen3-vl-4b
  annotations:
    # 🤓 CDI device injection — the nvidia-container-runtime hook broke after
    #    the 2026-07-17 reboot; CDI (user-level spec regenerated by
    #    nvidia-ctk cdi generate) is the working GPU path on sm3lly.
    cdi.k8s.io/gpu: nvidia.com/gpu=all
    io.podman.annotations.run: |
      --security-opt label=disable
spec:
  restartPolicy: UnlessStopped
  hostname: b00t-sm0l-vqa
  containers:
    - name: llamacpp
      image: ghcr.io/ggml-org/llama.cpp:server-cuda
      ports:
        - containerPort: 8080
          hostPort: 8002
          protocol: TCP
      # 🤓 no NVIDIA_* env vars — they trigger the broken legacy
      #    nvidia-container-toolkit OCI hook; CDI annotation above is the
      #    sole GPU injection path.
      volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
      args:
        - --host
        - "0.0.0.0"
        - --port
        - "8080"
        - -m
        - /models/snapshots/1cd86afb9a95c410a6038ab3b40d8b578c892266/Qwen3VL-4B-Instruct-Q4_K_M.gguf
        - --mmproj
        - /models/snapshots/1cd86afb9a95c410a6038ab3b40d8b578c892266/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
        - --alias
        - sm0l-vqa
        - -c
        - "8192"
        - -ngl
        - "99"
        - -fa
        - "on"
        - -np
        - "1"
        - --jinja
        - --temp
        - "0.7"
        - --top-p
        - "0.8"
        - --top-k
        - "20"
      securityContext:
        privileged: false
  volumes:
    - name: models
      hostPath:
        path: /home/brianh/.cache/huggingface/hub/models--Qwen--Qwen3-VL-4B-Instruct-GGUF
        type: Directory
