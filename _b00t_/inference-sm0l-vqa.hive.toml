# b00t Hive Profile — Qwen3-VL-4B-Instruct sm0l VQA via llama.cpp Podman
# 🤓 Vision-language sm0l tier: species/attribute VQA for the app4dog
#    characterize stage (common-core#4) and general image questions.
# 🤓 Coexists with inference-qwen36-35b-a3b-llamacpp (ch0nky, :8001, ~19GB) —
#    ~4GB VRAM total on the shared RTX 3090; NOT in the ai-inference
#    exclusion group for that reason.
# 🤓 Heavyweight VQA (BAGEL-7B-MoT NF4) is a separate batch-job path with
#    eviction — see common-core#4 evaluation 2026-07-17.
#
# ⚠️ kube play path BLOCKED on sm3lly: the global oci-nvidia-hook
#    (when.always=true) conflicts with kube-play CDI injection — raw
#    `podman run --device nvidia.com/gpu=all` is the proven GPU path
#    (same as ch0nky, same as b00t provider local batch jobs).
# Activate:   see [[b00t.usage]] start command below (podman run CDI)
# Deactivate: podman rm -f b00t-sm0l-vqa

[b00t]
name = "inference-sm0l-vqa"
type = "hive_profile"
hint = "Qwen3-VL-4B-Instruct Q4_K_M + mmproj via llamacpp podman — ~4GB VRAM, multimodal :8002/v1, coexists with ch0nky"
depends_on = ["huggingface.cli"]

[b00t.hive.resources]
# 🤓 Q4_K_M ~2.5GB + mmproj Q8 ~0.6GB + KV@8k + overhead ≈ 4GB VRAM
ram_gb    = 2
gpu_mb    = 4200
cpu_cores = 2

[b00t.hive.resources.gate]
ram_free_gb = 1
gpu_free_mb = 4500

[b00t.hive.exclusion]
# 🤓 own group — must NOT collide with ai-inference (ch0nky stays resident)
group    = "ai-vqa-sidecar"
priority = 60

[[b00t.hive.guards]]
pattern = "pip install"
action  = "warn"
message = "🦨 use uv pip install"

[[b00t.hive.guards]]
pattern = "docker run"
action  = "warn"
message = "🦨 use podman (CDI GPU: podman kube play)"

[b00t.hive.env]
B00T_AI_VQA_BASE  = "http://127.0.0.1:8002/v1"
B00T_AI_VQA_MODEL = "sm0l-vqa"

[[b00t.usage]]
description = "Start sm0l VQA sidecar (proven 2026-07-17: oreo smoke test PASS)"
command = "podman run -d --name b00t-sm0l-vqa --memory=6g --memory-swap=6g --device nvidia.com/gpu=all --security-opt=label=disable -v /home/brianh/.cache/huggingface/hub:/hf:z -p 8002:8002 ghcr.io/ggml-org/llama.cpp:server-cuda --model /hf/models--Qwen--Qwen3-VL-4B-Instruct-GGUF/snapshots/1cd86afb9a95c410a6038ab3b40d8b578c892266/Qwen3VL-4B-Instruct-Q4_K_M.gguf --mmproj /hf/models--Qwen--Qwen3-VL-4B-Instruct-GGUF/snapshots/1cd86afb9a95c410a6038ab3b40d8b578c892266/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf --host 0.0.0.0 --port 8002 -ngl 999 -fa on -c 8192 --jinja --alias sm0l-vqa --api-key local-b00t"

[[b00t.usage]]
description = "Stop sm0l VQA sidecar"
command = "podman rm -f b00t-sm0l-vqa"

[[b00t.usage]]
description = "Smoke test (multimodal chat with a photo)"
command = "curl -s http://127.0.0.1:8002/v1/chat/completions -H 'Content-Type: application/json' -d @vqa-smoke.json"

