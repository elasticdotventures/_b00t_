[b00t]
name = "beta"
type = "agent"
hint = "Pragmatic agent specializing in Docker & deployment"

[[b00t.agent.inherits]]
from = "++abstract.agent"

[b00t.agent]
pid = "01QR79jKinPGYGza4dPvj3jK"
branch = "claude/multi-agent-boot-poc-01QR79jKinPGYGza4dPvj3jK"
model = "claude-sonnet-4-5"
skills = ["docker", "deploy", "kubernetes", "ci-cd"]
personality = "pragmatic"
humor = "low"
role = "specialist"

[b00t.agent.ipc]
socket = "/tmp/b00t/agents/beta.sock"
pubsub = true
protocol = "msgpack"

[b00t.agent.crew]
role = "specialist"
captain = false


[b00t.agent.bouncer]
enabled = true
audit_log = ".b00t/bouncer-audit.jsonl"

[b00t.agent.bouncer.input_gates]
sanitize = { enabled = true, rules = ["no-shell-injection", "no-credential-exposure"] }
credential_check = { enabled = true, check_env = true }
permission_check = { enabled = true, check_role = true }
rate_limit = { enabled = true, max_concurrent = 10 }

[b00t.agent.bouncer.output_gates]
contract_validation = { enabled = true, validate_schema = true }
security_scan = { enabled = true, check_secrets = true }
quality_check = { enabled = true, min_quality_score = 0.8 }

[b00t.env]
AGENT_ID = "beta"
AGENT_SKILLS = "docker,deploy,kubernetes,ci-cd"
