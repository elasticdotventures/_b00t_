transport = "stdio"
args = ["/home/brianh/.dotfiles/_b00t_/scripts/kreuzberg-mcp-wrapper.py"]

# 🥾: FALLBACK — direct python path
[[b00t.mcp.stdio]]
priority = 10
command = "python3"
requires = ["python", "kreuzberg"]
transport = "stdio"
args = ["_b00t_/scripts/kreuzberg-mcp-wrapper.py"]

