[b00t]
name = "datum-authoring"
type = "skill"
hint = "Canonical datum schema reference — required fields, tail-map format, forbidden fields"

[b00t.skill]
depends_on = ["datum-schema", "tomllm-format"]
unlocks = ["_b00t_-write"]
description = """
Canonical datum authoring conventions:
- [b00t] required: name, type, hint (≤120 chars)
- Skill datums use [b00t.skill] with 'tags' (NOT 'type_tags')
- Tail section: # b00t:map v1 with summary/tags/tier/cmds/complexity
- Forbidden: [b00t.version] — use [b00t.schema] instead
- lfmf_category for learn references
"""

[b00t.skill.metadata]
applies_to = ["_b00t_/*.toml", "_b00t_/*.datum.toml"]
output_types = ["datum", "skill", "reference"]

# b00t:map v1
# summary: Canonical datum schema — required fields, tail-map format, field naming conventions
# tags: datum, authoring, schema, blessing, prerequisite
# tier: ch0nky
# cmds: b00t learn datum-authoring, b00t blessing --manifest --role=worker
# complexity: 6
