# b00t CLI Datum - vLLM OpenAI-compatible inference server
# 🤓 vLLM chosen over candle/mistral.rs for --cpu-offload-gb: serves models > VRAM via CPU RAM swap
# RTX 3090 24GB: Qwen3-Coder-Next Q4_K_M (48GB) needs --cpu-offload-gb ~28

[b00t]
name = "vllm"
trigger_words = ["vllm", "inference", "model", "gpu", "server", "qwen", "llama", "gemma"]
type = "cli"
desires = "0.19.1"
hint = "vLLM 0.19.1 OpenAI-compat inference; GGUF, GPTQ, FP8, CPU offload for oversized models"
install = """
uv pip install vllm==0.19.1
"""
update = """
uv pip install --upgrade vllm==0.19.1
"""
version = "vllm --version"
version_regex = '([0-9]+\\.[0-9]+\\.[0-9]+)'
lfmf_category = "vllm"

# ⚠️ ulimit fix required for production — vLLM needs nofile>=65536
# Run as root (once, persists across reboots):
#   echo "* soft nofile 65536" | sudo tee -a /etc/security/limits.conf
#   echo "* hard nofile 65536" | sudo tee -a /etc/security/limits.conf
#   echo "session required pam_limits.so" | sudo tee -a /etc/pam.d/common-session
# OR for systemd service (preferred):
#   LimitNOFILE=65536 in [Service] section (see vllm-qwen3-coder.service)
[b00t.learn]
topic = "vllm"
auto_digest = true

# ── Qwen3-Coder-Next (48GB Q4_K_M, RTX 3090 24GB) ──────────────────────────
[[b00t.usage]]
description = "Serve Qwen3-Coder-Next Q4_K_M with CPU offload (primary hive model)"
command = """
prlimit --nofile=65536:65536 -- vllm serve \
  ~/.cache/huggingface/hub/models--Qwen--Qwen3-Coder-Next-GGUF/snapshots/*/Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf \
  --served-model-name qwen3-coder \
  --port 8000 \
  --max-model-len 32768 \
  --cpu-offload-gb 28 \
  --enable-auto-tool-choice \
  --tool-call-parser hermes \
  --enable-chunked-prefill \
  --override-generation-config '{"temperature": 0.25, "min_p": 0, "top_p": 0.8}'
"""

# ── Qwen3-Coder 30B-A3B MoE GGUF (existing, OOMs without offload) ───────────
[[b00t.usage]]
description = "Serve Qwen3-Coder-30B-A3B GGUF with CPU offload"
command = """
prlimit --nofile=65536:65536 -- vllm serve \
  ~/.b00t/models/qwen3-coder-30b-a3b/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf \
  --served-model-name qwen3-coder \
  --port 8000 \
  --max-model-len 32768 \
  --cpu-offload-gb 8 \
  --enable-auto-tool-choice \
  --tool-call-parser hermes \
  --enable-chunked-prefill
"""

# ── Qwen3-Coder-Next FP8 native (full download ~40GB, no GGUF needed) ────────
[[b00t.usage]]
description = "Serve Qwen3-Coder-Next FP8 (native vLLM, best throughput)"
command = """
prlimit --nofile=65536:65536 -- vllm serve Qwen/Qwen3-Coder-Next-FP8 \
  --served-model-name qwen3-coder \
  --port 8000 \
  --max-model-len 32768 \
  --cpu-offload-gb 20 \
  --enable-auto-tool-choice \
  --tool-call-parser qwen3_next_vllm
"""

# ── Quick proof / hive-sm0l fallback ─────────────────────────────────────────
[[b00t.usage]]
description = "Serve Qwen2.5-3B Q8 (fast start, proof-of-concept, sm0l tier)"
command = """
prlimit --nofile=65536:65536 -- vllm serve \
  ~/.cache/huggingface/hub/models--Qwen--Qwen2.5-3B-Instruct-GGUF/snapshots/*/qwen2.5-3b-instruct-q8_0.gguf \
  --served-model-name qwen3-coder \
  --port 8000 \
  --max-model-len 32768 \
  --enable-auto-tool-choice \
  --tool-call-parser hermes
"""

[[b00t.usage]]
description = "Check served models"
command = "curl -s http://localhost:8000/v1/models | python3 -m json.tool"

[[b00t.usage]]
description = "Quick inference test"
command = """curl -s http://localhost:8000/v1/chat/completions \
  -H 'Content-Type: application/json' -H 'Authorization: Bearer local-vllm' \
  -d '{"model":"qwen3-coder","messages":[{"role":"user","content":"ping"}],"max_tokens":5}' | python3 -m json.tool"""

[[b00t.references]]
name = "vLLM 0.17.1 engine args"
trigger_words = ["vllm", "inference", "model", "gpu", "server", "qwen", "llama", "gemma"]
url = "https://docs.vllm.ai/en/v0.17.1/models/engine_args.html"

[[b00t.references]]
name = "Qwen3-Coder-Next GGUF"
trigger_words = ["vllm", "inference", "model", "gpu", "server", "qwen", "llama", "gemma"]
url = "https://huggingface.co/Qwen/Qwen3-Coder-Next-GGUF"

[[b00t.references]]
