[b00t]
name = "inference-sm0l"
type = "hive_profile"
hint = "vLLM sm0l model (Qwen2.5-3B Q8 or similar) — low RAM, GPU-light; compatible with concurrent dev work"
depends_on = ["vllm.cli", "ollama.ai"]

[b00t.hive.resources]
# 🤓 3B Q8 model = ~3.5GB VRAM + ~1GB RAM overhead
# Leaves most resources free for dev tools, builds, etc.
ram_gb = 4
gpu_mb = 5000
cpu_cores = 2

[b00t.hive.resources.gate]
ram_free_gb = 2
gpu_free_mb = 4000

[b00t.hive.exclusion]
group = "primary-workload"
priority = 50

[b00t.hive.services]
# 🤓 K8s-first: deploy via _b00t_/k8s.🚢/sm0l/deployment.yaml into b00t-inference namespace
# systemd unit (b00t-hive-inference-sm0l.service) is DISABLED — k8s preferred on sm3lly
# NodePort 30801 → http://192.168.1.137:30801
start = []
stop = []

[b00t.hive.mcp_tools]
activate = ["sm0l-local", "opencode-local"]

[[b00t.hive.guards]]
pattern = "pip install"
action = "warn"
message = "🦨 use uv pip install"
redirect = "uv pip install"

[[b00t.hive.guards]]
pattern = "docker run"
action = "warn"
message = "🦨 use k8s (kubectl apply -f _b00t_/k8s.🚢/sm0l/deployment.yaml) or podman CDI"

[[b00t.usage]]
description = "Deploy sm0l via k8s (preferred on sm3lly)"
command = "kubectl apply -f _b00t_/k8s.🚢/sm0l/deployment.yaml"

[[b00t.usage]]
description = "Check sm0l pod status"
command = "kubectl get pods,svc -n b00t-inference"

[[b00t.usage]]
description = "Set B00T_SM0L_ENDPOINT (NodePort 30801)"
command = "export B00T_SM0L_ENDPOINT=http://192.168.1.137:30801/completion"

[[b00t.usage]]
description = "Scale down sm0l (free GPU for ch0nky)"
command = "kubectl scale deployment sm0l --replicas=0 -n b00t-inference"

