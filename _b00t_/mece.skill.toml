[b00t.learn]
content = """
MECE (Mutually Exclusive, Collectively Exhaustive): the McKinsey structuring principle.
Mutually Exclusive: no item belongs to two categories. overlaps = ambiguity = missed edge cases.
Collectively Exhaustive: all possibilities are covered. gaps = hidden assumptions.
Application: before solving, structure the problem space. draw the tree. check each node.
Test ME: "can this item appear in two branches?" → if yes, redefine the branches.
Test CE: "is there anything not captured?" → if yes, add a branch or expand scope.
In code: applies to enum variants, error types, match arms, API routes.
In reasoning: applies to hypothesis lists, root cause categories, option sets.
Anti-pattern: using vague catch-all categories ("other") — that's a CE failure.
"""

