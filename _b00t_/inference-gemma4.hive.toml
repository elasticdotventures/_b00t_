[b00t]
name = "inference-gemma4"
type = "hive_profile"
hint = "Ollama gemma4:e2b (E2B Q4_K_M ~3.2GB VRAM) — local gemma4 subagent via ollama"
depends_on = ["qwen36-local.model.ai", "vllm.cli", "huggingface.cli", "ollama.ai"]

[b00t.hive.resources]
# 🤓 gemma4:e2b Q4_K_M = ~3.2GB VRAM + ~1GB RAM overhead for ollama
# RTX 3050 Laptop 4GB VRAM — leaves ~700MB headroom
ram_gb = 4
gpu_mb = 3500
cpu_cores = 2

[b00t.hive.resources.gate]
ram_free_gb = 3
gpu_free_mb = 3200

[b00t.hive.exclusion]
group = "primary-workload"
priority = 60  # 🤓 preferred over inference-sm0l when gemma4 is available

[b00t.hive.services]
start = [
  "ollama.service",  # 🤓 systemd --user unit for ollama; or run: ollama serve
]
stop = []

[b00t.hive.mcp_tools]
activate = ["ollama-local"]

[[b00t.hive.guards]]
pattern = "pip install"
action = "warn"
message = "🦨 use uv pip install"
redirect = "uv pip install"

[[b00t.hive.guards]]
pattern = "docker run"
action = "warn"
message = "🦨 use podman (CDI GPU: --device nvidia.com/gpu=all --security-opt=label=disable)"

[[b00t.hive.guards]]
pattern = "ollama pull gemma4"
action = "info"
message = "🤓 gemma4:e2b already pulled; use `ollama run gemma4:e2b` directly"

[[b00t.usage]]
description = "Start ollama server"
command = "ollama serve"

[[b00t.usage]]
description = "Pull gemma4:e2b model (one-time, ~3.2GB)"
command = "ollama pull gemma4:e2b"

[[b00t.usage]]
description = "Run gemma4:e2b interactively"
command = "ollama run gemma4:e2b"

[[b00t.usage]]
description = "Run gemma4:e2b as local subagent via OpenAI-compatible API"
command = "OLLAMA_HOST=127.0.0.1:11434 ollama serve & ollama run gemma4:e2b"

[[b00t.usage]]
description = "Query gemma4:e2b via REST (subagent pattern)"
command = "curl -s http://localhost:11434/api/generate -d '{\"model\":\"gemma4:e2b\",\"prompt\":\"$PROMPT\",\"stream\":false}' | python3 -c \"import sys,json; print(json.load(sys.stdin)['response'])\""

[[b00t.usage]]
description = "Activate gemma4 inference profile"
command = "b00t hive activate inference-gemma4"

# b00t:map v1
# summary: Ollama gemma4:e2b local inference — RTX 3050 4GB VRAM compatible (Q4_K_M ~3.2GB)
# tags: ollama, gemma4, inference, local-subagent, vllm-alternative, sm86
# tier: ch0nky
# cmds: ollama serve, ollama pull gemma4:e2b, ollama run gemma4:e2b
# complexity: 3
