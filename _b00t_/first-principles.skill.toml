[b00t]
name = "first-principles"
type = "skill"
type_tags = ["transferable"]
hint = "Decompose to atoms; rebuild from base truths; ignore analogy and precedent"
keywords = ["first-principles", "reasoning", "decompose", "atoms", "assumptions", "elon", "physics", "base-truth"]

[b00t.learn]
content = """
First-principles reasoning: refuse inherited assumptions; derive from base truths.
Step 1: state what you believe to be true about the problem.
Step 2: for each belief, ask: "is this a fact, or did I inherit it from convention?"
Step 3: discard the inherited beliefs. rebuild from what remains.
Musk example: "batteries are expensive" → why? → materials → materials are cheap → rethink assembly.
In software: "we need a database" → why? → persistent state → what's the simplest persistent state?
Key test: "would this design make sense to someone who had never seen this domain before?"
Anti-pattern: analogy reasoning ("we do it this way because that's how X does it").
First principles is expensive — apply to high-stakes decisions, not every micro-choice.
"""

