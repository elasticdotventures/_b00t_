<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- b00t hive control — DBus policy -->

  <!-- The _b00t service user owns the bus name -->
  <policy user="_b00t">
    <allow own="com.promptexecution.b00t1"/>
  </policy>

  <!-- Operator can call all methods -->
  <policy user="brianh">
    <allow send_destination="com.promptexecution.b00t1"/>
    <allow receive_sender="com.promptexecution.b00t1"/>
  </policy>

  <!-- b00t group members (agents) can call methods -->
  <policy group="b00t">
    <allow send_destination="com.promptexecution.b00t1"/>
    <allow receive_sender="com.promptexecution.b00t1"/>
  </policy>
</busconfig>
