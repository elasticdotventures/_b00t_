[package]
name = "b00t-c0re-lib"
# 🤓 SINGLE SOURCE OF TRUTH for b00t ecosystem versioning
# All other crates (b00t-cli, b00t-mcp) should reference this version
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core shared library for b00t-cli tools and b00t-mcp server"
keywords = ["b00t", "core", "template", "mcp", "shared"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "b00t_c0re_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_schemas"
path = "src/bin/generate_schemas.rs"

[features]
default = ["store-helixdb"]
python = ["pyo3"]
ledgrrr-events = []
store-neumann = ["dep:storage-neumann"]  # ARCHIVED/LEGACY — use store-helixdb or store-oxigraph
store-oxigraph = ["dep:oxigraph"]
store-helixdb = ["dep:helix-db"]
oxigraph = ["store-oxigraph"]
store-grafeo = ["dep:grafeo"]
store-zvec = ["dep:zvec"]
data-fabric = ["store-grafeo", "store-zvec"]
qdrant = []  # optional Qdrant REST gate; disabled on this node (see SOUL.tomllm)
ipc-fanout = ["dep:b00t-ipc", "data-fabric"]  # route write fanout through b00t-ipc Transport bus

[dependencies]
keyring = "4"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2 = "0.10"
chrono.workspace = true
regex.workspace = true
rmcp.workspace = true
toml.workspace = true
serde_yaml = "0.9"

# Core lib specific dependencies
shellexpand = "3.1.0"
dirs = "6.0"
duct = "1.0"
redis = { version = "0.32.4", features = ["aio", "tokio-comp", "connection-manager"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread", "process"] }
tokio-util = "0.7"
shell-words = "1.1"
rhai = "1.22.2"
statig = "0.4.1"
rig-core = "0.24.0"
ts-rs = "11.1.0"
schemars = "1.1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.20"
hex = "0.4"
tracing.workspace = true
lazy_static = "1.5.0"
async-trait = "0.1"
futures = "0.3"
cfg-if = "1.0.4"
oxigraph = { version = "0.5.8", optional = true }
storage-neumann = { version = "0.1", optional = true }
helix-db = { version = "2.0", optional = true }
grafeo = { version = "0.5.42", features = ["ai", "storage", "gql"], optional = true }
zvec = { git = "https://github.com/zvec-ai/zvec-rust.git", tag = "v0.5.0", optional = true }
b00t-ipc = { path = "../b00t-ipc", features = ["nats"], optional = true }
ufo-types = { path = "../crates/ufo-types" }
crepe = "0.2.0"
ascent = "0.8.0"
syn = { version = "2.0.118", features = ["full"] }
quote = "1.0.45"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
tracing-subscriber = "0.3"
