[package]
name = "b00t-c0re-lib"
# 🤓 SINGLE SOURCE OF TRUTH for b00t ecosystem versioning
# All other crates (b00t-cli, b00t-mcp) should reference this version
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core shared library for b00t-cli tools and b00t-mcp server"
keywords = ["b00t", "core", "template", "mcp", "shared"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "b00t_c0re_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_schemas"
path = "src/bin/generate_schemas.rs"

[[bin]]
name = "b00t-lsp"
path = "src/bin/b00t-lsp.rs"

[features]
default = []
python = ["pyo3"]
ledgerr-events = []

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
rmcp.workspace = true
toml.workspace = true
serde_yaml = "0.9"

# Irontology semantic bridge — direct library integration (no MCP subprocess)
# 🤓 binary pending (vendor/irontology-mcp has no main.rs yet); lib-only path works today
# storage-neumann = { path = "../vendor/irontology-mcp/crates/storage-neumann" }

# Core lib specific dependencies
shellexpand = "3.1.0"
dirs = "6.0"
duct = "1.0"
redis = { version = "0.32.4", features = ["aio", "tokio-comp", "connection-manager"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread", "process"] }
rhai = "1.22.2"
rig-core = "0.24.0"
ts-rs = "11.1.0"
schemars = "1.1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tracing.workspace = true
lazy_static = "1.5.0"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
tracing-subscriber = "0.3"
