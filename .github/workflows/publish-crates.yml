# .github/workflows/publish-crates.yml
name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.7.35). Optional for dry-run.
        required: false
        type: string
      dry_run:
        description: 'Run without publishing (dry-run)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi

          WORKSPACE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "workspace_version=${WORKSPACE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Verify workspace version matches release tag
        if: steps.release.outputs.tag != ''
        run: |
          echo "Workspace version: v${{ steps.release.outputs.workspace_version }}"
          echo "Release tag: ${{ steps.release.outputs.tag }}"

          if [ "v${{ steps.release.outputs.workspace_version }}" != "${{ steps.release.outputs.tag }}" ]; then
            echo "❌ Version mismatch: workspace v${{ steps.release.outputs.workspace_version }} != release ${{ steps.release.outputs.tag }}"
            exit 1
          fi
          echo "✅ Version match confirmed"

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Publish b00t-chat
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd b00t-lib-chat
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🔍 DRY RUN: Would publish b00t-chat"
            cargo publish --dry-run --allow-dirty --locked
          else
            echo "📦 Publishing b00t-chat to crates.io"
            cargo publish --allow-dirty --locked
          fi

      - name: Publish b00t-c0re-lib
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Wait for b00t-chat to propagate on crates.io (skip in dry-run)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "⏳ Waiting for b00t-chat to appear on crates.io..."
            found=0
            for i in $(seq 1 12); do
              if cargo search b00t-chat 2>/dev/null | grep -q "b00t-chat"; then
                echo "✅ b00t-chat available"; found=1; break
              fi
              echo "  attempt $i/12 — sleeping 10s"; sleep 10
            done
            if [ "$found" -eq 0 ]; then
              echo "❌ b00t-chat did not appear on crates.io after 12 attempts"; exit 1
            fi
          fi
          cd b00t-c0re-lib
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🔍 DRY RUN: Would publish b00t-c0re-lib"
            cargo publish --dry-run --allow-dirty --locked
          else
            echo "📦 Publishing b00t-c0re-lib to crates.io"
            cargo publish --allow-dirty --locked
          fi

      - name: Publish b00t-cli
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Wait for b00t-c0re-lib to propagate on crates.io (skip in dry-run)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "⏳ Waiting for b00t-c0re-lib to appear on crates.io..."
            found=0
            for i in $(seq 1 18); do
              if cargo search b00t-c0re-lib 2>/dev/null | grep -q "b00t-c0re-lib"; then
                echo "✅ b00t-c0re-lib available"; found=1; break
              fi
              echo "  attempt $i/18 — sleeping 10s"; sleep 10
            done
            if [ "$found" -eq 0 ]; then
              echo "❌ b00t-c0re-lib did not appear on crates.io after 18 attempts"; exit 1
            fi
          fi
          cd b00t-cli
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🔍 DRY RUN: Would publish b00t-cli"
            cargo publish --dry-run --allow-dirty --locked
          else
            echo "📦 Publishing b00t-cli to crates.io"
            cargo publish --allow-dirty --locked
          fi

      - name: Publish b00t-mcp
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Wait for b00t-cli to propagate on crates.io (skip in dry-run)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "⏳ Waiting for b00t-cli to appear on crates.io..."
            found=0
            for i in $(seq 1 18); do
              if cargo search b00t-cli 2>/dev/null | grep -q "^b00t-cli "; then
                echo "✅ b00t-cli available"; found=1; break
              fi
              echo "  attempt $i/18 — sleeping 10s"; sleep 10
            done
            if [ "$found" -eq 0 ]; then
              echo "❌ b00t-cli did not appear on crates.io after 18 attempts"; exit 1
            fi
          fi
          cd b00t-mcp
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "🔍 DRY RUN: Would publish b00t-mcp"
            cargo publish --dry-run --allow-dirty --locked
          else
            echo "📦 Publishing b00t-mcp to crates.io"
            cargo publish --allow-dirty --locked
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 📦 Crates Publishing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            echo "**Mode**: Dry Run (no actual publishing)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode**: Live Publishing" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Version**: ${{ steps.release.outputs.tag || 'manual trigger' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Crates:" >> $GITHUB_STEP_SUMMARY
          echo "- b00t-chat" >> $GITHUB_STEP_SUMMARY
          echo "- b00t-c0re-lib" >> $GITHUB_STEP_SUMMARY
          echo "- b00t-cli" >> $GITHUB_STEP_SUMMARY
          echo "- b00t-mcp" >> $GITHUB_STEP_SUMMARY
