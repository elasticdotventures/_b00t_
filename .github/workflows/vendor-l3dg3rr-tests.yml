name: Vendor l3dg3rr Tests

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ledgrrr/**'
      - '.gitmodules'
      - '.github/workflows/vendor-l3dg3rr-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vendor/ledgrrr/**'
      - '.gitmodules'
      - '.github/workflows/vendor-l3dg3rr-tests.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/ledgrrr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize l3dg3rr submodule
        working-directory: ${{ github.workspace }}
        run: |
          git submodule update --init --recursive vendor/ledgrrr vendor/runpod-sdk

      - name: Install Linux native dependencies
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/ledgrrr

      - name: Build tests (compile check only)
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace
