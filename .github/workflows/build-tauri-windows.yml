name: Package ledgrrr Desktop for Windows

on:
  pull_request:
    paths:
      - 'vendor/ledgrrr/crates/ledgerr-tauri/**'
      - 'vendor/ledgrrr/crates/ledgerr-host/src/tray/**'
      - '.github/workflows/build-tauri-windows.yml'
  push:
    branches: [main, feat/*, task/*]
    paths:
      - 'vendor/ledgrrr/crates/ledgerr-tauri/**'
      - 'vendor/ledgrrr/crates/ledgerr-host/src/tray/**'
      - '.github/workflows/build-tauri-windows.yml'
  workflow_dispatch:  # manual trigger

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Init required submodules
        run: git submodule update --init --depth 1 vendor/ledgrrr

      - name: Setup Rust
        run: |
          rustup set profile minimal
          rustup target add x86_64-pc-windows-msvc
          rustup show

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build MSI and NSIS installers
        run: |
          cd vendor/ledgrrr/crates/ledgerr-tauri
          cargo tauri build --bundles msi,nsis

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ledgrrr-desktop-windows
          path: |
            vendor/ledgrrr/target/release/bundle/msi/*.msi
            vendor/ledgrrr/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 90
