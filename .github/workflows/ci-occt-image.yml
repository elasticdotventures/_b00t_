name: Build and Publish CI OCCT base image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.ci-occt'
      - '.github/workflows/ci-occt-image.yml'
  workflow_dispatch:  # Allow manual trigger / rebuild

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elasticdotventures/ci-occt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ci-occt
            org.opencontainers.image.description=OpenCASCADE (OCCT) pre-baked base image for _b00t_ CI (cadrum/b00t-cad)

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ci-occt
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sanity-check image
        if: github.event_name != 'pull_request'
        run: |
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "${PRIMARY_TAG}" sh -c '
            test -f "$OCCT_ROOT/include/opencascade/TopoDS_Shape.hxx" &&
            test -f "$OCCT_ROOT/lib/libTKernel.a" &&
            echo "OCCT_ROOT=$OCCT_ROOT looks complete"
          '
