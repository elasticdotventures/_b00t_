name: Build and Upload Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag or release to build assets for (for example v0.7.35)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "${TAG}" ]; then
            echo "No release tag resolved" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}" -p b00t-cli -p b00t-mcp
          else
            cargo build --release --target "${{ matrix.target }}" -p b00t-cli -p b00t-mcp
          fi

      # capability-forge only, and only for the Vultr node's actual target
      # (x86_64-unknown-linux-gnu, native build). Not added to the shared
      # matrix build above: it pulls in async-openai/reqwest, which is a
      # real risk under `cross`'s Docker-based cross-compilation for the
      # aarch64/armv7/macOS targets (native TLS linking) -- no reason to put
      # those unrelated targets at risk for a binary they'll never run.
      - name: Build capability-forge (x86_64-unknown-linux-gnu only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: cargo build --release --target x86_64-unknown-linux-gnu -p capability-forge

      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/b00t"
          cp "target/${{ matrix.target }}/release/b00t-cli" "dist/b00t/"
          cp "target/${{ matrix.target }}/release/b00t-mcp" "dist/b00t/"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp "target/${{ matrix.target }}/release/capability-forge" "dist/b00t/"
          fi
          cp -r "_b00t_" "dist/b00t/_b00t_"
          ln -sf b00t-cli "dist/b00t/b00t"

          tar -C dist -czf "dist/b00t-${{ matrix.target }}.tar.gz" "b00t"
          shasum -a 256 "dist/b00t-${{ matrix.target }}.tar.gz" > "dist/b00t-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/b00t-${{ matrix.target }}.tar.gz
            dist/b00t-${{ matrix.target }}.tar.gz.sha256

  upload-assets:
    name: Upload assets to GitHub release
    needs: [resolve-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.resolve-release.outputs.tag }}" dist/* --clobber

  verify:
    name: Verify x86_64 Linux release bundle
    needs: [resolve-release, upload-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ needs.resolve-release.outputs.tag }}" --pattern "b00t-x86_64-unknown-linux-gnu.tar.gz"

      - name: Verify extracted binaries
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf b00t-x86_64-unknown-linux-gnu.tar.gz
          ./b00t/b00t-cli --version
          ./b00t/b00t-mcp --help >/dev/null
          # capability-forge is a long-running NATS service (blocks on connect), not a
          # CLI with --version/--help -- presence + executable bit is the real check.
          test -x ./b00t/capability-forge
