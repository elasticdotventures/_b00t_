# 🤓 The workflow that previously reported as "CI" was .github/workflows/blank.yml —
#    the GitHub starter template, with every real step commented out. It installed uv
#    and QEMU and never invoked cargo, which is why it "passed" in ~18s for a 30-crate
#    Rust workspace. See #919. The check name is deliberately kept as "CI" so any
#    branch-protection rule matching that name keeps working.
#
# 🤓 (#1261/#1264) This used to be a single `workspace` job running
#    `cargo check` + `cargo nextest run --workspace` end to end, with
#    `timeout-minutes: 60`. It CANCELLED at exactly 60:00 twice on #1261,
#    blocking that PR and every future Rust PR behind it (main has no branch
#    protection requiring this check, so PRs merge past a cancelled run
#    anyway -- but a CI job that structurally can't finish is still useless
#    as a signal). Split into:
#      - `check`: cargo check only, runs once, fails fast.
#      - `test`: cargo nextest, sharded 4-way via `--partition count:N/4`,
#        each shard only needs to finish 1/4 of the workspace's tests
#        inside the timeout instead of all of it.
#    Shared setup (submodule/ledgrrr init, Rust toolchain, sccache) lives in
#    .github/actions/setup-rust-workspace so the two jobs can't drift.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run teaches nothing; cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 🤓 OCCT (b00t-cad's `cadrum` dependency) lives here instead of being
    #    downloaded into `target/` by cadrum's own build.rs. That path used to
    #    ride along with Swatinem/rust-cache's cached `target/` tarball below,
    #    and cadrum's cache-hit check only verifies `include/`+`lib/` *exist*,
    #    not that they're complete — so one run cancelled mid-extraction by
    #    `cancel-in-progress` above was enough to cache a permanently-broken
    #    OCCT tree that every run after it silently inherited (see #926).
    #    Baking OCCT into this image instead means it's never touched by that
    #    cache at all. Image: Dockerfile.ci-occt / .github/workflows/ci-occt-image.yml.
    container:
      image: ghcr.io/elasticdotventures/ci-occt:latest
    env:
      OCCT_ROOT: /opt/occt
    # 🤓 Container jobs don't get the `bash -eo pipefail` default that host
    #    (`runs-on: ubuntu-latest`) jobs get — Actions falls back to plain
    #    `sh` (dash) inside a container unless told otherwise, which chokes
    #    on `set -o pipefail` in every `run:` step below. bash IS present in
    #    this image; Actions just doesn't assume it without this.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🥾
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 🤓 NOT `submodules: recursive`. This repo has 34 submodules, and a
          #    recursive checkout aborts on orphan//gutted gitlinks (see #924).
          #    Init only what the workspace actually needs, explicitly.
          submodules: false

      - name: Set up Rust workspace
        uses: ./.github/actions/setup-rust-workspace

      # --locked is the point: it makes lockfile/manifest disagreement a hard
      # failure instead of a silent re-resolve that differs from local builds.
      - name: cargo check --workspace --locked
        run: cargo check --workspace --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    name: cargo nextest (partition ${{ matrix.partition }}/${{ strategy.job-total }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    container:
      image: ghcr.io/elasticdotventures/ci-occt:latest
    env:
      OCCT_ROOT: /opt/occt
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🥾
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Rust workspace
        uses: ./.github/actions/setup-rust-workspace

      # 🤓 Native/CLI deps some tests shell out to. Not present on a bare
      #    ubuntu-latest runner — without these the tests fail with "command
      #    not found", not a real code defect. See #919.
      - name: Install z3 (required by b00t-c0re-lib::z3_examples tests)
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Install just (required by b00t-cli::datum_justfile tests, >= 1.13.0)
        uses: extractions/setup-just@v2

      # 🤓 CI-speed experiment (elasticdotventures/_b00t_#1226): swap the
      #    default libtest runner for nextest's per-test-process model.
      #    Two things make this an unusually clean fit for THIS workflow
      #    specifically, not just "nextest is generally faster":
      #    1. nextest doesn't run doctests -- and this workflow already
      #       skips them deliberately (see the cargo test step's own
      #       comment below, #919's cdylib+rlib E0460 bug), so nextest's
      #       one real limitation costs this job nothing it wasn't
      #       already paying.
      #    2. Per-test process isolation eliminates an entire class of
      #       flakiness this repo has hit more than once: tests in
      #       different modules mutating process-global state (cwd, HOME)
      #       with only a module-local Mutex, which only guards a test
      #       against others IN THE SAME MODULE, not the whole binary
      #       (see #1224's shard_tests fix). Under nextest each test gets
      #       its own process, so this class of cross-module race can't
      #       happen at all, by construction -- not just less likely.
      #    3. (#1261/#1264) nextest's `--partition count:N/M` is also what
      #       makes sharding this job across the matrix above possible at
      #       all -- libtest has no equivalent test-level partitioning.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # 🤓 capability-forge/tests/e2e_local_nats.rs spawns a real nats-server
      #    subprocess (resolved via PATH, override with NATS_SERVER_BIN) --
      #    not present on a bare ubuntu-latest/container runner, so all 3
      #    tests in that file fail with "No such file or directory" (os
      #    error 2), not a real code defect. Pinned tarball, not the
      #    upstream `curl | sh` installer, so the CI step is auditable and
      #    reproducible without depending on binaries.nats.dev's uptime.
      - name: Install nats-server (required by capability-forge::e2e_local_nats tests)
        run: |
          set -euo pipefail
          curl -sSLo /tmp/nats-server.tar.gz \
            https://github.com/nats-io/nats-server/releases/download/v2.14.5/nats-server-v2.14.5-linux-amd64.tar.gz
          tar -xzf /tmp/nats-server.tar.gz -C /tmp
          sudo install -m 0755 /tmp/nats-server-v2.14.5-linux-amd64/nats-server /usr/local/bin/nats-server
          nats-server --version

      # 🤓 b00t-c0re-lib/src/b00t_config.rs hardcodes #[ts(export_to = "/home/brianh/...")]
      #    (an absolute path to the maintainer's local sibling dashboard checkout).
      #    ts-rs auto-generates an `export_bindings_*` #[test] per type that writes
      #    there on `cargo test`, so the directory must exist for the test to
      #    succeed anywhere else. Making the dir writable here lets the real ts-rs
      #    export run for real (genuine output, just to a throwaway CI path) rather
      #    than skipping it. Fixing the hardcoded path itself is a follow-up (#919).
      - name: Prepare ts-rs export target dir
        run: |
          sudo mkdir -p /home/brianh/promptexecution/infrastructure/b00t-website/dashboard/src/types
          sudo chown -R "$(id -u):$(id -g)" /home/brianh

      # 🤓 --all-targets (= --lib --bins --tests --benches --examples) runs
      #    everything cargo test normally would EXCEPT doctests. This is
      #    necessary, not a weakening: b00t-c0re-lib declares
      #    crate-type = ["cdylib", "rlib"], and doctests in downstream crates
      #    (e.g. b00t-c0re-gov's eisenhower.rs) hit a well-documented Cargo bug
      #    in that configuration -- error[E0460]: found possibly newer version
      #    of crate b00t_c0re_lib -- reproduced deterministically on 3
      #    consecutive clean CI runs with no persisted cache involved. The
      #    failure is inherent to linking a doctest against a crate with a
      #    cdylib output alongside the rlib, not anything wrong with the
      #    tested code. All non-doctest tests still run for real. See #919.
      - name: cargo nextest run --workspace --locked --all-targets (shard ${{ matrix.partition }}/4)
        run: cargo nextest run --workspace --locked --all-targets --partition count:${{ matrix.partition }}/4

      # 🤓 Hit-rate evidence for #1226: printed even on failure (this run's own
      # cache behavior is worth seeing whether or not the tests above passed).
      - name: sccache stats
        if: always()
        run: sccache --show-stats
