name: l3dg3rr Utility Docs

on:
  pull_request:
    paths:
      - "b00t-l3dg3rr-viz/**"
      - "docs/l3dg3rr-visualization-utility.md"
      - ".github/workflows/l3dg3rr-docs.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "b00t-l3dg3rr-viz/**"
      - "docs/l3dg3rr-visualization-utility.md"
      - ".github/workflows/l3dg3rr-docs.yml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: l3dg3rr-utility-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  build-docs:
    name: Build l3dg3rr utility docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize workspace submodule deps
        run: git submodule update --init --depth 1 vendor/embed-anything-b00t vendor/ledgrrr vendor/runpod-sdk

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build utility docs
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p b00t-l3dg3rr-viz
          cargo doc -p b00t-l3dg3rr-viz --no-deps
          mkdir -p public/l3dg3rr
          cp -R target/doc/* public/l3dg3rr/
          cp docs/l3dg3rr-visualization-utility.md public/l3dg3rr/README.md

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: l3dg3rr-utility-docs
          path: public

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
