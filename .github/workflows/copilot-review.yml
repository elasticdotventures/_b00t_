name: copilot-pr-review

# Disabled (dispatch-only) — see #920.
# `pull_request_review_request:` is not a real GitHub Actions event (the real
# mechanism is `pull_request: types: [..., review_requested]`), so GitHub
# rejected this entire workflow file with a 0s "workflow file issue" failure
# on every push to main. Even fixed, the job body below shells out to
# `gh copilot explain`, which needs a Copilot-entitled token — no such PAT is
# configured in this repo's secrets (only CARGO_REGISTRY_TOKEN is), and
# GitHub's native App-based "Copilot code review" workflow already covers PR
# review. Re-enable only if a Copilot-entitled PAT is deliberately added.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up gh CLI
        run: |
          gh --version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gh copilot extension
        run: gh extension install github/gh-copilot --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr.diff
          wc -l /tmp/pr.diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run copilot explain on key changed files
        id: copilot
        run: |
          # Collect changed .rs files (max 5 to stay within context)
          RS_FILES=$(gh pr diff ${{ github.event.pull_request.number }} \
            | grep '^diff --git' \
            | grep '\.rs"' \
            | awk '{print $3}' \
            | sed 's|^a/||' \
            | head -5 \
            | tr '\n' ' ')

          if [[ -z "$RS_FILES" ]]; then
            echo "No Rust files changed — skipping copilot explain."
            echo "review_output=No Rust files changed." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTPUT=""
          for f in $RS_FILES; do
            if [[ -f "$f" ]]; then
              SNIPPET=$(head -80 "$f")
              EXPLAIN=$(echo "$SNIPPET" | gh copilot explain - 2>&1 | head -20 || true)
              OUTPUT+="### $f\n$EXPLAIN\n\n"
            fi
          done
          echo "review_output<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `${{ steps.copilot.outputs.review_output }}`;
            const body = [
              '## 🤖 gh copilot auto-review',
              '',
              output || '_No copilot output generated._',
              '',
              '---',
              '_Generated by `.github/workflows/copilot-review.yml` — review findings are advisory, not blocking._',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
