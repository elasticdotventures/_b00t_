name: Prepare GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to release. Leave blank to use Cargo.toml.
        required: false
        type: string
      run_tests:
        description: Run the workspace test suite before tagging.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Init required vendor submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 vendor/tomllm vendor/irontology-mcp vendor/embed-anything-b00t

      - name: Set up Rust toolchain
        if: inputs.run_tests
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          INPUT_VERSION="${{ inputs.version }}"

          if [ -n "${INPUT_VERSION}" ] && [ "${INPUT_VERSION}" != "${WORKSPACE_VERSION}" ]; then
            echo "Requested version ${INPUT_VERSION} does not match workspace version ${WORKSPACE_VERSION}" >&2
            exit 1
          fi

          TAG="v${WORKSPACE_VERSION}"
          echo "version=${WORKSPACE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Run workspace tests
        if: inputs.run_tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --exclude b00t-cli --exclude b00t-grok --exclude b00t-embed --exclude b00t-l3dg3rr-viz --exclude embed_anything
          # b00t-cli's optional candle stack is documented as unsupported until upstream
          # dependency conflicts are resolved, so release gating only exercises supported features.
          cargo test -p b00t-cli --features dbus,llamacpp-fallback
          # b00t-grok pyo3 feature requires Python dev headers at link time; not guaranteed in CI.
          # Gate on default features only; pyo3 binding is an optional extension, not a release invariant.
          cargo test -p b00t-grok

      - name: Generate Claude marketplace artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_claude_marketplace.py --repo-root .
          python3 scripts/generate_claude_marketplace.py --repo-root . --check

      - name: Package Claude marketplace artifacts
        id: marketplace-artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="claude-marketplace-${{ steps.version.outputs.tag }}.tar.gz"
          tar -czf "${ARTIFACT}" \
            .claude-plugin \
            plugins/roles \
            plugins/skills
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Upload Claude marketplace asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.marketplace-artifact.outputs.artifact }}" \
            --clobber
