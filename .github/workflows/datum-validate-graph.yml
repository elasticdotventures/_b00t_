name: Datum graph validator

on:
  pull_request:
    branches: [main]
    paths:
      - 'b00t-cli/src/datum_store.rs'
      - 'b00t-cli/src/commands/datum.rs'
      - '_b00t_/**'
      - 'justfile'
      - '.github/workflows/datum-validate-graph.yml'
  push:
    branches: [main]
    paths:
      - 'b00t-cli/src/datum_store.rs'
      - 'b00t-cli/src/commands/datum.rs'
      - '_b00t_/**'
      - 'justfile'
      - '.github/workflows/datum-validate-graph.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate graph references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Avoid recursive submodule checkout because orphan gitlinks can
          # break CI checkout before tests run — see rust-k0mmand3r.yml.
          submodules: false

      - name: Init required vendor submodules
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 vendor/ledgrrr

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run datum graph validator tests
        run: cargo test -p b00t-cli --lib validate_references -- --nocapture
