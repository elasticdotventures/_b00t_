# 🤓 SP5 — SysML-v2 coherence substrate. The graph substrate
#    (b00t-c0re-lib/src/graph_*.rs + query_bus::OxigraphSparqlSource) only
#    compiles under the opt-in `store-oxigraph` feature, which is mutually
#    exclusive with the default `store-helixdb` (compile_error! in
#    irontology_bridge.rs). So it can't ride the main `CI` workflow's
#    `--workspace` build — it needs its own `--no-default-features
#    --features store-oxigraph` job. This workflow is that job.

name: graph-oxigraph

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main]
    paths:
      - "b00t-c0re-lib/src/graph_load.rs"
      - "b00t-c0re-lib/src/graph_shapes.rs"
      - "b00t-c0re-lib/src/graph_kerml.rs"
      - "b00t-c0re-lib/src/query_bus.rs"
      - "b00t-c0re-lib/src/irontology_bridge.rs"
      - "b00t-c0re-lib/examples/b00t-graph.rs"
      - "b00t-c0re-lib/Cargo.toml"
      - "b00t-cli/src/datum_triples.rs"
      - "b00t-cli/src/identity_triples.rs"
      - "b00t-cli/src/commands/graph.rs"
      - "b00t-cli/src/commands/r0le.rs"
      - "b00t-cli/src/dispatch_sysml.rs"
      - ".github/workflows/graph-oxigraph.yml"
  workflow_dispatch:

concurrency:
  group: graph-oxigraph-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  graph-oxigraph:
    name: graph-oxigraph
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/elasticdotventures/ci-occt:latest
    env:
      OCCT_ROOT: /opt/occt
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout 🥾
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up Rust workspace
        uses: ./.github/actions/setup-rust-workspace

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # 1. Emit the graph from the repo's own _b00t_/ (default b00t-cli build).
      - name: emit-triples
        run: cargo run -p b00t-cli --locked -- graph emit-triples --out "$RUNNER_TEMP/graph.jsonl"

      - name: triple sanity
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/graph.jsonl"
          python3 -c "import json,sys; [json.loads(l) for l in open('$RUNNER_TEMP/graph.jsonl') if l.strip()]"
          echo "lines: $(wc -l < "$RUNNER_TEMP/graph.jsonl")"

      # 2. b00t-c0re-lib graph unit tests (store-oxigraph only).
      - name: nextest (store-oxigraph)
        run: cargo nextest run -p b00t-c0re-lib --no-default-features --features store-oxigraph --locked

      # 3. b00t-cli triple-compiler + subcommand + r0le tests (default build).
      - name: nextest (b00t-cli graph compilers)
        run: cargo nextest run -p b00t-cli --locked identity_triples commands::graph r0le:: dispatch_sysml

      # 4. SHACL-lite gate on the real graph. A hard Violation here is a real
      #    datum defect — fix the datum or file `b00t task add` + downgrade
      #    that one shape to Warning with a linked comment. Never silently
      #    loosen a shape.
      - name: validate --strict
        run: cargo run -p b00t-c0re-lib --no-default-features --features store-oxigraph --locked --example b00t-graph -- validate "$RUNNER_TEMP/graph.jsonl" --strict

      # 5. KerML view must render + start with the expected package header.
      - name: kerml view round-trips
        run: |
          set -euo pipefail
          cargo run -p b00t-c0re-lib --no-default-features --features store-oxigraph --locked --example b00t-graph -- kerml "$RUNNER_TEMP/graph.jsonl" --view datum-deps > "$RUNNER_TEMP/view.kerml"
          test -s "$RUNNER_TEMP/view.kerml"
          head -1 "$RUNNER_TEMP/view.kerml" | grep -q "^package b00t_datum_deps {"

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
