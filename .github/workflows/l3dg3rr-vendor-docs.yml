name: l3dg3rr Docs

on:
  push:
    branches: [main]
    paths:
      - 'vendor/ledgrrr'
      - 'vendor/ledgrrr/**'
      - '.gitmodules'
      - '.github/workflows/l3dg3rr-vendor-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vendor/ledgrrr'
      - 'vendor/ledgrrr/**'
      - '.gitmodules'
      - '.github/workflows/l3dg3rr-vendor-docs.yml'
  workflow_dispatch:

concurrency:
  group: l3dg3rr-vendor-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build l3dg3rr docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize l3dg3rr submodule
        run: git submodule update --init --recursive vendor/ledgrrr vendor/runpod-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust/cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/ledgrrr

      - name: Install just
        uses: extractions/setup-just@v1

      - name: Install mdBook and plugins
        run: |
          cd vendor/ledgrrr
          # 🤓 just docgen checks ~/.cargo/bin/mdbook — install everything via cargo
          # so all tools land in the same place. action-mdbook@v3 was removed because
          # it installs to a different prefix, causing null TOML values in the RenderContext
          # passed to mdbook-admonish.
          # mdbook-admonish requires the mdbook-0.5-compat fork until tommilligan/mdbook-admonish#235 merges.
          # See Justfile line 471 comment for local dev instructions.
          cargo install mdbook mdbook-mermaid --locked
          cargo install --git https://github.com/padamson/mdbook-admonish.git --branch feat/mdbook-0.5-compat mdbook-admonish
          cargo install --path crates/mdbook-rhai-mermaid

      - name: Build l3dg3rr docs
        run: |
          cd vendor/ledgrrr
          just docgen

      - name: Verify output
        run: |
          cd vendor/ledgrrr
          test -d book/book && echo "✓ book/book directory exists" || { echo "✗ docs build failed"; exit 1; }
          test -f book/book/theory.html && echo "✓ theory.html generated" || { echo "✗ theory.html missing"; exit 1; }
          test -f book/book/index.html && echo "✓ index.html generated" || { echo "✗ index.html missing"; exit 1; }
